name: lonaliza
description: "Lonaliza Native Shell App — ultra-lightweight, 120 FPS high performance travel shell."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  file_picker: ^10.3.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/logo/

flutter_native_splash:
  color: "#140522"
  image: assets/logo/logo.png
  android_12:
    color: "#140522"
    image: assets/logo/logo.png
