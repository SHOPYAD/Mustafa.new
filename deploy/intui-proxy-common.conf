# Shared proxy settings for Intui same-origin locations.
# Included from lonaliza.com vhost. Do not proxy search.lonaliza.com /tpwl/.
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_verify off;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "";
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_cookie_domain .intui.travel lonaliza.com;
proxy_cookie_domain intui.travel lonaliza.com;
proxy_cookie_domain en.intui.travel lonaliza.com;
proxy_cookie_domain www.intui.travel lonaliza.com;
proxy_cookie_domain find.intui.travel lonaliza.com;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering off;
add_header Strict-Transport-Security "max-age=31536000" always;
