server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name lonaliza.com www.lonaliza.com;
    include /www/server/panel/vhost/nginx/extension/lonaliza.com/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/lonaliza.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/lonaliza.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/lonaliza.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497 https://$host$request_uri;
    #SSL-END

    if ($host = www.lonaliza.com) {
        return 301 https://lonaliza.com$request_uri;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location ^~ /.well-known/ {
        root /www/wwwroot/lonaliza.com;
        allow all;
        default_type text/plain;
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.data|LICENSE|README.md|docs(/|$)|cursor_oktravel_platform_analysis.md|cursor_travel_platform_analysis.md) {
        return 404;
    }

    # Same-origin Travelpayouts White Label so /flights can read
    # iframe.contentDocument.scrollHeight. DNS for search.lonaliza.com
    # stays CNAME → whitelabel.travelpayouts.com (do not change).
    location = /tpwl {
        return 301 /tpwl/;
    }

    location ^~ /tpwl/ {
        proxy_pass https://whitelabel.travelpayouts.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name whitelabel.travelpayouts.com;
        proxy_ssl_verify off;
        proxy_set_header Host search.lonaliza.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host search.lonaliza.com;
        proxy_set_header Accept-Language "ar-SA,ar;q=0.9,en;q=0.1";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_redirect https://search.lonaliza.com/ /tpwl/;
        proxy_redirect https://whitelabel.travelpayouts.com/ /tpwl/;
        proxy_redirect http://search.lonaliza.com/ /tpwl/;
        proxy_cookie_domain search.lonaliza.com lonaliza.com;
        proxy_cookie_path / /tpwl/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Intui transfers HTML is same-origin via Next.js `/intui` `/getoffers`
    # `/ajax` `/intui-find` (curl → en.intui.travel). Cloudflare challenges
    # nginx/Node TLS fingerprints; do not proxy_pass Intui from nginx.
    # /tpwl/ above is unchanged. search.lonaliza.com CNAME is unchanged.

    # PWA service workers — served from public/ so they stay reachable
    # even before the next Next.js production rebuild.
    location = /sw.js {
        alias /www/wwwroot/lonaliza.com/public/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options nosniff;
    }

    location = /sw-admin-pwa.js {
        alias /www/wwwroot/lonaliza.com/public/sw-admin-pwa.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/admin";
        add_header X-Content-Type-Options nosniff;
    }

    location = /api/cron/email-dispatch {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3047;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Cron-Secret $http_x_cron_secret;
        proxy_read_timeout 60s;
    }

    # Isolated branded stand-in for origin 502/503/504 (Flutter + browsers).
    error_page 502 503 504 /shell-maintenance.html;
    location = /shell-maintenance.html {
        root /www/wwwroot/lonaliza.com/public;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Lonaliza-Shell-Error "1";
    }

    location / {
        proxy_pass http://127.0.0.1:3047;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    access_log  /www/wwwlogs/lonaliza.com.log;
    error_log  /www/wwwlogs/lonaliza.com.error.log;
}
