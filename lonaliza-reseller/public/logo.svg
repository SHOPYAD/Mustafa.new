<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 95" width="520" height="95" fill="none">
  <defs>
    <!-- Ultra-Luxe Metallic Gold Gradient -->
    <linearGradient id="luxeGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#E2A638" />
      <stop offset="70%" stop-color="#B87314" />
      <stop offset="90%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Vibrant Emerald Gradient -->
    <linearGradient id="luxeEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for Vector Clarity -->
    <filter id="vectorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ── 1. LUXURY CREST / TRAVEL EMBLEM (LEFT) ── -->
  <g transform="translate(6, 2)" filter="url(#vectorShadow)">
    <!-- Global Orbital Latitude / Travel Path -->
    <ellipse cx="45" cy="45" rx="43" ry="18" stroke="url(#luxeGold)" stroke-width="2.2" transform="rotate(-28 45 45)" opacity="0.9" stroke-dasharray="120 15 25 8" />
    <ellipse cx="45" cy="45" rx="41" ry="14" stroke="url(#luxeEmerald)" stroke-width="2" transform="rotate(32 45 45)" opacity="0.85" />

    <!-- Falcon Wings / Dynamic Aero Crest -->
    <path d="M45 4 Q70 23 83 43 Q60 40 45 28 Z" fill="url(#luxeGold)" opacity="0.95" />
    <path d="M45 86 Q20 67 7 47 Q30 50 45 62 Z" fill="url(#luxeGold)" opacity="0.9" />

    <!-- 8-Pointed Regal Compass Star -->
    <path d="M45 4 L53 37 L86 45 L53 53 L45 86 L37 53 L4 45 L37 37 Z" fill="url(#luxeGold)" />
    
    <!-- Inner Emerald Core Gem -->
    <path d="M45 19 L50 40 L71 45 L50 50 L45 71 L40 50 L19 45 L40 40 Z" fill="url(#luxeEmerald)" />

    <!-- Center Light Diamond Spark -->
    <circle cx="45" cy="45" r="4.5" fill="#FFFFFF" />
    <circle cx="45" cy="45" r="7" stroke="url(#luxeGold)" stroke-width="1.2" />
  </g>

  <!-- ── 2. BRAND TYPOGRAPHY: LONALIZA ── -->
  <g filter="url(#vectorShadow)">
    <text x="115" y="55" font-family="'Cinzel', 'Outfit', 'Sora', 'Segoe UI', sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="url(#luxeGold)">
      LONALIZA
    </text>

    <!-- Luxury Gold & Emerald Divider -->
    <line x1="117" y1="67" x2="250" y2="67" stroke="url(#luxeGold)" stroke-width="1.5" opacity="0.75" />
    <polygon points="256,64 260,67 256,70 252,67" fill="#10B981" />
    <line x1="262" y1="67" x2="495" y2="67" stroke="url(#luxeGold)" stroke-width="1.5" opacity="0.75" />

    <!-- Tagline: LUXURY TRAVEL (Strictly English Only) -->
    <text x="118" y="85" font-family="'Cinzel', 'Outfit', 'Sora', sans-serif" font-size="13" font-weight="700" letter-spacing="9" fill="#5EEAD4">
      LUXURY TRAVEL
    </text>
  </g>
</svg>