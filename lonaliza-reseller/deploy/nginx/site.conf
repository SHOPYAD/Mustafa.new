server {
    listen 80;
    server_name client-travel.com www.client-travel.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name client-travel.com www.client-travel.com;

    # SSL Certificates (Auto-generated by aaPanel or Let's Encrypt)
    ssl_certificate /www/server/panel/vhost/cert/client-travel.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/client-travel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
