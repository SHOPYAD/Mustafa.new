 <text x="120" y="234" text-anchor="middle" direction="rtl" fill="currentColor" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="700">ربط B2B لوناليزا</text>
<text class="state-label" x="120" y="253" text-anchor="middle" direction="rtl">جاهز</text><g class="talk-bars" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M109 207v6"/><path d="M120 204v12"/><path d="M131 207v6"/></g></svg>