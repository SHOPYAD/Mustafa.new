<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <linearGradient id="rubyGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Emerald Gem Gradient -->
    <linearGradient id="emeraldGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGlow)" stroke="url(#imperialGold)" stroke-width="4" filter="url(#goldGlow)" />
  <circle cx="80" cy="80" r="71" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Heraldic Supervisor Shield -->
  <path d="M 80,38 Q 112,38 120,54 Q 122,86 80,126 Q 38,86 40,54 Q 48,38 80,38 Z"
        fill="url(#shieldGrad)"
        stroke="url(#imperialGold)"
        stroke-width="2.5" />

  <!-- Shield Inner Accent Lines -->
  <path d="M 80,44 Q 106,44 113,56 Q 115,82 80,118 Q 45,82 47,56 Q 54,44 80,44 Z"
        fill="none"
        stroke="rgba(245, 158, 11, 0.4)"
        stroke-width="1" />

  <!-- Imperial Crown (High Detail) -->
  <g transform="translate(0, -6)">
    <!-- Crown Base Band -->
    <rect x="56" y="58" width="48" height="6" rx="2" fill="url(#imperialGold)" />
    <!-- Jewels on Crown Band -->
    <circle cx="62" cy="61" r="1.8" fill="url(#rubyGem)" />
    <circle cx="71" cy="61" r="1.8" fill="url(#emeraldGem)" />
    <circle cx="80" cy="61" r="2.2" fill="url(#rubyGem)" />
    <circle cx="89" cy="61" r="1.8" fill="url(#emeraldGem)" />
    <circle cx="98" cy="61" r="1.8" fill="url(#rubyGem)" />

    <!-- Crown Peaks -->
    <path d="M 56,58 L 52,43 L 64,52 L 80,36 L 96,52 L 108,43 L 104,58 Z"
          fill="url(#imperialGold)"
          stroke="#b45309"
          stroke-width="0.75" />

    <!-- Crown Peak Pearls -->
    <circle cx="52" cy="42" r="3" fill="#ffffff" stroke="url(#imperialGold)" stroke-width="1" />
    <circle cx="64" cy="51" r="2.5" fill="url(#emeraldGem)" />
    <circle cx="80" cy="35" r="4.2" fill="url(#rubyGem)" stroke="#fef08a" stroke-width="1.2" />
    <circle cx="96" cy="51" r="2.5" fill="url(#emeraldGem)" />
    <circle cx="108" cy="42" r="3" fill="#ffffff" stroke="url(#imperialGold)" stroke-width="1" />
  </g>

  <!-- Executive Monogram / Emblem "L" with Star Wings -->
  <g transform="translate(0, 10)">
    <!-- Central Radiance Stars -->
    <path d="M 80,72 L 82,78 L 88,80 L 82,82 L 80,88 L 78,82 L 72,80 L 78,78 Z" fill="url(#imperialGold)" />
    <path d="M 80,68 L 84,79 L 95,80 L 86,87 L 89,98 L 80,91 L 71,98 L 74,87 L 65,80 L 76,79 Z"
          fill="url(#imperialGold)"
          opacity="0.9"
          stroke="#b45309"
          stroke-width="0.8" />
    <circle cx="80" cy="83" r="4" fill="url(#rubyGem)" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Bottom Title Arc Ribbon Badge -->
  <g transform="translate(0, 4)">
    <rect x="42" y="132" width="76" height="15" rx="7.5" fill="#0f172a" stroke="url(#imperialGold)" stroke-width="1.5" />
    <text x="80" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">المشرف العام</text>
  </g>
</svg>
