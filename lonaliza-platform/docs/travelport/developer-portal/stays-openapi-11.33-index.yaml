  /hotel/book/reservations/passive:
    post:
      tags:
        - Reservations
      summary: Create passive hotel reservation
      description: >-
        Create Passive Reservation creates a new booking with a hotel segment
        booked outside the Travelport GDS, called a passive segment. This allows
        the booking to include complete travel details. Passive hotel segments
        are confirmed with a status code of MK, which is returned in the
        response in Receipt/OfferStatus/code. A status code of AK is used for
        placeholder-only passive segments. A passive hotel segment is any
        segment that is booked using anything other than the JSON APIs or
        another product that uses the Travelport GDS. (A passive hotel segment
        is any segment that is booked using anything other than a product that
        uses the Travelport GDS. Passive segments are informational only. They
        do not result in a reservation or a change in inventory. Information on
        a passive segment is not received from or passed to the hotel supplier.
        Instead, passive segments provide a way to consolidate all booking
        information, including details from direct hotel bookings or even phone
        reservations.)
      operationId: CreateHotelPassiveReservation
      parameters:
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
