components:
  schemas:
    ImageSizeEnum:
      type: string
      description: >-
        A size for the image to return, allowing you to set image quality.
        Hospitality APIs no longer support thumbnail.
      example: Small
      enum:
        - Large
        - Medium
        - Small
        - Thumbnail
        - ExtraLarge
    PropertiesResponseWrapper:
      properties:
        PropertiesResponse:
          $ref: '#/components/schemas/PropertiesResponse'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    PropertiesResponse:
      properties:
        Properties:
          $ref: '#/components/schemas/Properties'
      description: The response of a Properties endpoint request.
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
    BaseResponse:
      properties:
        '@type':
          type: string
          example: response
        transactionId:
          type: string
          description: >-
            "A unique system-generated (128 bit GUID format)
            transaction/tracking id for a single request and response (i.e. for
            a single transaction) used for internal tracking and
            troubleshooting. Also known as E2ETrackingId. Not returned in all
            Hotel API responses."
          example: 49f58f5f-c443-43b4-9f5d-be405fd00a01
        traceId:
          type: string
          description: >-
            "Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response. For Rules, returned
            if a custom trace ID was sent in the request header"
          example: TraceID_123456
        correlationId:
          type: string
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          format: uuid
        reservationStatus:
          $ref: '#/components/schemas/ReservationOfferStatusEnum'
        Result:
          $ref: '#/components/schemas/Result'
        Identifier:
          $ref: '#/components/schemas/Identifier'
        NextSteps:
          $ref: '#/components/schemas/NextSteps'
        ReferenceList:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/ReferenceList'
        CurrencyRateConversion:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/CurrencyRateConversion'
        Pagination:
          $ref: '#/components/schemas/Pagination'
      description: >-
        Base response is part of all JSON APIs responses and includes common
        items which are relevant across all APIs
    ReservationOfferStatusEnum:
      type: string
      description: Status of reservation or offer completion.
      enum:
        - Success
        - Fail
        - Partial
        - Pending
        - OnHold
        - Retry
        - Other
      x-enumDescriptions:
        Success: All offer items have been booked and issued successfully.
        Fail: All offer items have failed to issue.
        Partial: Some offer items have failed to issue.
        Pending: Some offer items are pending carrier response.
        OnHold: Document issuance has not been attempted.
        Retry: >-
          A communication error has occurred and retry of document issuance is
          required.
        Other: >-
          An issue has occurred and will be communicated in the error or warning
          response.
    Result:
      properties:
        '@type':
          type: string
          description: Discriminator class Result only
          example: Result
        status:
          $ref: '#/components/schemas/ResultStatusEnum'
        Error:
          maxItems: 50
          type: array
          description: >-
            A list of error information returned at the provider level for a
            response.
          items:
            $ref: '#/components/schemas/Error'
        Warning:
          maxItems: 100
          type: array
          description: >-
            A list of warning information returned at the provider level for a
            response.
          items:
            $ref: '#/components/schemas/Warning'
      description: Returns the error and/or warning message information, if applicable.
    ResultStatusEnum:
      type: string
      description: The status of an error or warning
      example: Complete
      enum:
        - Not processed
        - Incomplete
        - Complete
        - Unknown
    Error:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes Error or ErrorDetail
          example: ErrorDetail
        StatusCode:
          type: integer
          description: Http standard response code
          format: int32
          example: 200
          deprecated: true
        Message:
          maxLength: 4096
          type: string
          description: The Travelport standardized error or warning message
          example: No flights found.
        NameValuePair:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/NameValuePair'
      description: A list of error information returned from the provider.
      discriminator:
        propertyName: '@type'
    NameValuePair:
      required:
        - name
      properties:
        value:
          maxLength: 512
          type: string
          description: >-
            Text directly related to name description, providing more detail.
            May have character restrictions based on remark type (e.g. Free Text
            limitations: 84 characters, alphanumeric and some special
            characters).
          example: Sunday
        id:
          type: string
          description: Optional internally referenced id
          example: '6'
        name:
          maxLength: 512
          type: string
          description: Key, categorizing the of type of remark or error.
          example: Day1
      description: >-
        Further details describing remarks or error response, structured in
        name-value pairs.
    Warning:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes Warning or WarningDetail
          example: WarningDetail
        StatusCode:
          type: integer
          description: Http standard response code
          format: int32
          example: 200
          deprecated: true
        Message:
          maxLength: 4096
          type: string
          description: The Travelport standardized error or warning message
          example: Customer Loyalty could not be applied.
        NameValuePair:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/NameValuePair'
      description: A list of warning information returned from the provider.
      discriminator:
        propertyName: '@type'
    Identifier:
      properties:
        value:
          maxLength: 1024
          type: string
          description: >-
            "Unique offer identifier that can be sent in subsequent payload
            requests to reference this offer.

            When used specifically for form of payment, the value will begin
            with the characters 'FOP'. Similarly, the OfferIdentifier associated
            will begin with the character 'O'.

            For Hotel Create Reservation (Reference Payload), send the value
            from the Availability response in CatalogOffering/id or the value
            from SearchComplete returned in
            propertyItems/lowestPublicAvailableRate/rateKey/value. 

            Results from Availability and SearchComplete are stored in the cache
            for 30 minutes. If the offers expire before booking, you must send a
            new request."
          example: A0656EFF-FAF4-456F-B061-0161008D7C4E
        authority:
          maxLength: 128
          type: string
          description: >-
            "Name of the supplier system that created this identifier. 

            For Hotels, authority indicates which supplier returned the lowest
            available rate for that property: either TVPT (Travelport) or BKNG
            (booking.com). Booking.com access requires additional provisioning
            and a direct agreement with the supplier. Authority is not returned
            if the property is closed or returns an error.

            For Hotel Create Reservation (Full Payload) and Sync Reservation
            send the value from the Availability response in
            CatalogOffering/Identifier/authority for the instance you want to
            book."
          example: TVPT
      description: >-
        A globally unique identifier key often used to reference a given option
        (such as Pricing, Booking, Rules, or additional workflows) or to
        retrieve information (such as Hotel pagination).
    NextSteps:
      required:
        - NextStep
        - baseURI
      properties:
        baseURI:
          type: string
          description: >-
            The base portion of the uri in order to shorten the uris in the
            individual steps
        id:
          type: string
          description: Optional internally referenced id
          example: '5'
        NextStep:
          maxItems: 20
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/NextStep'
      description: >-
        Container for the steps that describe actions that may be taken on the
        containing object.
    NextStep:
      required:
        - action
        - method
      properties:
        value:
          type: string
          example: www.resourcelocation.com
        id:
          type: string
          description: Identifier for the Next Step
          example: '2'
        action:
          maxLength: 32
          type: string
          description: The action this next step is intended to achieve
          example: cancel
        method:
          $ref: '#/components/schemas/NextStepMethodEnum'
        description:
          maxLength: 32
          type: string
          description: Additional clarification for the next step
          example: remove offer from the order
      description: >-
        A URL that describes a step that can be applied to the resource
        containing the next step structure.
    NextStepMethodEnum:
      type: string
      description: >-
        Describes the set of potential methods that can be taken after an
        operation.
      enum:
        - GET
        - DELETE
        - PUT
        - POST
    ReferenceList:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator. Air Search child classes are ReferenceListAmenity,
            ReferenceListBrand, ReferenceListFlight, ReferenceListProduct,
            ReferenceListTermsAndConditions, and
            ReferenceListUniversalProductAttribute. Air Price child classes are
            ReferenceListAmenity and ReferenceListBrand. FareRules child class
            is ReferenceListFlight. Search Ancillaries child class is
            ReferenceListFlight. Seat Map child class is
            ReferenceListSeatingChart. Hotel Availability child class is
            ReferenceListPropertyDates. Reservation and Reservation Workbench
            child classes are ReferenceListAmenity, ReferenceListBrand, and
            ReferenceListUniversalProductAttribute. Exchange Search child
            classes are ReferenceListBrand, ReferenceListFlight, and
            ReferenceListExchangedPrice. Reservation Receipt child classes are
            ReferenceListOffer and ReferenceListTraveler. Book_Traveler child
            class is ReferenceListTraveler.
          example: ReferenceListFlight
        id:
          type: string
          description: Uniquely identifies for the Reference List
      description: >-
        ReferenceList consolidates frequently referenced objects into a single
        instance, which is referenced throughout the response payload. This is
        most commonly used in our Search APIs where response size is a
        consideration. Air Search API will return one instance
        ReferenceListFlight, ReferenceListProduct,
        ReferenceListTermsAndConditions, ReferenceListBrand, and optionaly if
        requested, ReferenceListAmenity and
        ReferenceListUniversalProductAttributes.
      discriminator:
        propertyName: '@type'
    CurrencyRateConversion:
      required:
        - ConversionRate
        - SourceCurrency
        - TargetCurrency
      properties:
        '@type':
          type: string
          default: CurrencyRateConversion
        SourceCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        TargetCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        ConversionRate:
          $ref: '#/components/schemas/ConversionRate'
      description: >-
        Conversion information for currency exchange between one currency and
        another. The response does not convert any amounts.

        For Hotel, returned only if requestedCurrency was sent in the request.
        By default the Hotel APIs return all rates in the currency of the
        hotel's location.
    CurrencyCode:
      properties:
        value:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: An ISO 4217 currency code.
          example: USD
        codeAuthority:
          maxLength: 32
          type: string
          description: Currency code authority
          example: ISO 4217
        decimalPlace:
          type: integer
          description: Number of decimal places for the currency.
          format: int32
          example: 4
        decimalAuthority:
          maxLength: 32
          type: string
          description: Currency code decimal authority
          example: ISO 4217
      description: >-
        Currency codes are the three-letter alphabetic codes that represent the
        various currencies used throughout the world. 

        For Hotel: SourceCurrency is based on the location of the hotel and used
        for all rates in the response. TargetCurrency is the currency code sent
        in the request in requestedCurrency.
    ConversionRate:
      properties:
        value:
          type: number
          format: float
        rateAuthority:
          maxLength: 32
          type: string
          description: Contextual rate authority
          example: ISO 4217
        rateAsOf:
          type: string
          description: Rate as of
          format: date-time
          example: '2026-08-07 12:12:00+00:00'
      description: >-
        Conversion rate of SourceCurrency value to TargetCurrency value. This
        value can be used to calculate, independently of the API, conversion for
        the rates in the response. The response does not convert any amounts.
    Pagination:
      required:
        - '@type'
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        '@type':
          type: string
          example: Pagination
        page:
          type: integer
          description: The current page number of the full result set
          format: int32
          example: 1
        pageSize:
          type: integer
          description: The total number of items on this page
          format: int32
          example: 20
        totalPages:
          type: integer
          description: The total number of pages in this result set
          format: int32
          example: 5
        totalItems:
          type: integer
          description: The total number of pages in this result set
          format: int32
          example: 100
      description: Pagination object used when result sets span across a number of pages.
    Properties:
      description: Returns the properties list and pagination information.
      allOf:
        - $ref: '#/components/schemas/PropertiesID'
        - required:
            - PropertyInfo
          properties:
            totalProperties:
              type: integer
              description: The total number of properties returned in the search.
              format: int32
            propertiesPerPage:
              type: integer
              description: The number of properties returned in the current page.
              format: int32
            numberOfPages:
              type: integer
              description: The total number of pages that can returned in the search.
              format: int32
            PropertyInfo:
              maxItems: 1000
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/PropertyInfo'
    PropertiesID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes Properties and PropertiesID
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    PropertyInfo:
      description: >-
        Each instance of PropertyInfo provides all information returned about
        one property.
      allOf:
        - $ref: '#/components/schemas/PropertyInfoID'
        - required:
            - Property
          properties:
            availability:
              $ref: '#/components/schemas/AvailabilityStatusEnum'
            Distance:
              $ref: '#/components/schemas/Distance'
            Property:
              $ref: '#/components/schemas/PropertyDetail'
            LowestAvailableRate:
              $ref: '#/components/schemas/CurrencyAmount'
            NextSteps:
              $ref: '#/components/schemas/NextSteps'
            featuredPropertyInd:
              type: boolean
              description: >-
                Indicates if a property has been promoted to the top of the
                Properties list through the featured properties program.
                Featured properties always have this indicator and are sorted at
                the top of the list when searching by IATA city/airport codes.
            MaximumAvailableRate:
              $ref: '#/components/schemas/MaximumAvailableRate'
    PropertyInfoID:
      properties:
        '@type':
          type: string
        id:
          type: string
          description: Property identifier composed of the chain and property codes.
        Identifier:
          $ref: '#/components/schemas/Identifier'
    AvailabilityStatusEnum:
      type: string
      description: >-
        Indicates whether the property has rooms available for the requested
        dates.
      enum:
        - Open
        - Close
        - ClosedOnArrival
        - ClosedOnArrivalOnRequest
        - OnRequest
        - RemoveCloseOnly
        - Other
      x-enumDescriptions:
        Open: Property has rooms/rates available that match search parameters.
        Close: Property has no rooms available.
        Other: >-
          Property has rooms/rates available that do not match search
          parameters.
    Distance:
      properties:
        value:
          type: number
          description: >-
            When using distance as a Hotel property search parameter, the
            maximum distance is 25 for miles and 40 for kilometres.
          format: float
          example: 25
        unitOfDistance:
          $ref: '#/components/schemas/UnitOfDistanceEnum'
      description: >-
        For Air: distance covered by the flight. 

        For Hotel: a radius around a specified location. The Distance object is
        returned in all Hotel Search responses but is not relevant to a search
        by property IDs, only for a search by location.
    UnitOfDistanceEnum:
      type: string
      description: >-
        For Hotels: Optional object to request either miles or kilometers for
        the search radius from the specified location. If unitOfDistance is not
        specified, the search defaults to miles for properties in the United
        States, Myanmar, and Liberia. The search defaults to kilometers in all
        other countries.
      example: Kilometers
      enum:
        - Miles
        - Kilometers
    PropertyDetail:
      allOf:
        - $ref: '#/components/schemas/Property'
        - properties:
            classTypeCode:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: The OTA code of the property detail
            segmentCatagoryCode:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: Segment category code
            locationCatagoryCode:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: Location category code
            complimentaryParking:
              $ref: '#/components/schemas/YesNoUnknownEnum'
            Address:
              $ref: '#/components/schemas/Address'
            Telephone:
              maxItems: 5
              minItems: 1
              type: array
              description: Property phone number.
              items:
                maxLength: 128
                type: string
                example: 001-123-45678
            Email:
              $ref: '#/components/schemas/Email'
            PropertyAmenity:
              maxItems: 250
              type: array
              items:
                $ref: '#/components/schemas/PropertyAmenity'
            PetPolicy:
              $ref: '#/components/schemas/PetPolicy'
            Restaurant:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/Restaurant'
            Attraction:
              maxItems: 100
              type: array
              description: Each instance is one attraction near the property.
              items:
                $ref: '#/components/schemas/Attraction'
            DrivingDirections:
              $ref: '#/components/schemas/TextFree'
            MeetingRooms:
              $ref: '#/components/schemas/MeetingRooms'
            VirtualTour:
              $ref: '#/components/schemas/VirtualTour'
            CheckInOutPolicy:
              $ref: '#/components/schemas/CheckInOutPolicy'
    Property:
      allOf:
        - $ref: '#/components/schemas/PropertyID'
        - required:
            - name
          properties:
            name:
              maxLength: 128
              type: string
              description: The name of a specific property.
            Rating:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/Rating'
            GeoLocation:
              $ref: '#/components/schemas/GeoLocation'
            Image:
              maxItems: 300
              type: array
              items:
                $ref: '#/components/schemas/Image'
            Description:
              maxItems: 5
              type: array
              description: A text description of the property.
              items:
                type: string
            BusinessService:
              maxItems: 100
              type: array
              description: Any business services available at the property.
              items:
                $ref: '#/components/schemas/Service'
            AccessibilityFeature:
              maxItems: 25
              type: array
              items:
                $ref: '#/components/schemas/OTA_CodeWithDescription'
            GuestRoomInfo:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/GuestRoomInfo'
    PropertyID:
      required:
        - '@type'
        - PropertyKey
      properties:
        '@type':
          type: string
          description: Discriminator classes Property, PropertyID, and PropertyDetail
          example: PropertyDetail
        id:
          type: string
          description: Property ID composed of the chain and property codes.
        Identifier:
          $ref: '#/components/schemas/Identifier'
        PropertyKey:
          $ref: '#/components/schemas/PropertyKey'
      discriminator:
        propertyName: '@type'
    PropertyKey:
      required:
        - chainCode
        - propertyCode
      properties:
        '@type':
          type: string
          default: PropertyKey
        chainCode:
          maxLength: 5
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,5})
          type: string
          description: Code for the hotel chain (typically 2 characters)
          example: UR
        propertyCode:
          maxLength: 32
          type: string
          description: >-
            The property code of the requested property (typically 5
            characters).
          example: G3375
      description: >-
        Contains up to 250 PropertyKey objects. Each PropertyKey object
        identifies one property.
    Rating:
      properties:
        value:
          type: number
          description: Rating used to classify hotels according to the quality
          format: float
          example: 5
        provider:
          maxLength: 32
          type: string
          description: The source who has granted the quality rating
          example: NTM
      description: The actual award or rating received by the facility.
    GeoLocation:
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          description: >-
            Numeric value representing latitude of search center point in
            degrees and decimal minutes.
          format: double
          example: 38.8951
        longitude:
          type: number
          description: >-
            Numeric value representing longitude of search center point in
            degrees and decimal minutes.
          format: double
          example: -77.0364
        altitude:
          type: number
          description: The height of a location, typically measured above sea level
          format: float
          example: 5280
        altitudeUnitOfDistance:
          $ref: '#/components/schemas/UnitOfDistanceEnum'
        positionAccuracy:
          $ref: '#/components/schemas/PositionAccuracyEnum'
        mapURL:
          type: string
          description: link for embedded map showing location
          example: www.destinationmap.com
        formatURL:
          type: string
          description: >-
            The URL to the format for the latitude and longitude for this
            location.
          example: www.destinationmap.com
      description: 'For Hotel: the geographic coordinates of the property.'
    PositionAccuracyEnum:
      type: string
      description: Specifies the level of accuracy for the position
      enum:
        - Zip9Code
        - Zip7Code
        - Zip5Code
        - Street
        - State
        - Property
        - Intersection
        - Exact
        - County
        - City
        - Block
    Image:
      properties:
        value:
          type: string
          description: URL of the image
        dimensionCategory:
          maxLength: 1
          type: string
          description: Deprecated and replaced by imageSize
        width:
          type: integer
          description: Image width
          format: int32
          example: 42
        height:
          type: integer
          description: Image height
          format: int32
          example: 43
        caption:
          maxLength: 128
          type: string
          description: Image caption
          example: Ticket
        pictureCategory:
          type: integer
          description: deprecated and replaced by pictureOf
          format: int32
          example: 5
        imageSize:
          $ref: '#/components/schemas/ImageSizeEnum'
        pictureOf:
          $ref: '#/components/schemas/PictureofEnum'
      description: >-
        Each instance is one image and its accompanying details, including a
        link to the image. Key value pairs; not all may be returned.
    PictureofEnum:
      type: string
      description: The image category
      example: Lobby
      enum:
        - Exterior
        - Lobby
        - Pool
        - Restaurant
        - HealthClub
        - GuestRoom
        - Suite
        - ConferenceRoom
        - Ballroom
        - Golf
        - Beach
        - Spa
        - Bar
        - Recreational
        - RoomAmenity
        - PropertyAmenity
        - BusinessCentre
        - Map
        - Promotional
        - Undefined
        - Studio
        - Attraction
        - Other
        - Amenity
        - Logo
        - MeetingRoom
    Service:
      properties:
        code:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: OTA code for this type of service.
        description:
          maxLength: 128
          type: string
          description: A description of the service.
        proximityCode:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: Proximity code
        existsInd:
          type: boolean
          description: If present and true this service exists
        includedInd:
          type: boolean
          description: If present and true this service is included with no charge
      description: Any services available at the property.
    OTA_CodeWithDescription:
      properties:
        value:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: OTA code for this offering.
        description:
          maxLength: 128
          type: string
          description: Free text description of a given offering.
      description: One instance for each feature/service option.
      example: An array of AccessibilityFeature options
    GuestRoomInfo:
      properties:
        '@type':
          type: string
          example: GuestRoomInfo
        code:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: OTA code for this description.
        number:
          type: integer
          description: Number of rooms with this feature or type of information.
          format: int32
        description:
          maxLength: 128
          type: string
          description: Description of the guest room information.
      description: One instance for each type of information about the guest rooms.
      example: Total number of rooms or number of floors.
    YesNoUnknownEnum:
      type: string
      description: Yes , No , Unknown
      example: 'Yes'
      enum:
        - 'Yes'
        - 'No'
        - Unknown
    Address:
      required:
        - '@type'
        - City
      properties:
        '@type':
          type: string
          description: Discriminator classes include Address or AddressDetail
          example: AddressDetail
        id:
          type: string
          description: unique address id
          example: Address_1
        BldgRoom:
          $ref: '#/components/schemas/AddressBldgRoom'
        Number:
          $ref: '#/components/schemas/AddressStreetNumber'
        Street:
          maxLength: 128
          type: string
          description: >-
            Street name. May also contain the street number when the Number
            element is missing.
          example: ABC Street
        AddressLine:
          maxItems: 3
          type: array
          description: >-
            Property street address. Used in place of Street and Number. Each
            element of the array represents an address line.
          items:
            maxLength: 128
            type: string
            example: 2035 S Havana street
        City:
          maxLength: 128
          type: string
          description: >-
            Full name of the city, town, or postal station (i.e., a postal
            service territory, often used in a military address).
          example: Dublin
        County:
          maxLength: 128
          type: string
          description: County or Region Name.
          example: Berkshire
        StateProv:
          $ref: '#/components/schemas/StateProv'
        Country:
          $ref: '#/components/schemas/Country'
        PostalCode:
          maxLength: 128
          type: string
          description: Postal code for the address.
          example: Sl6 1AB
        Addressee:
          maxLength: 37
          type: string
          description: The name of the company or person to be addressed
          example: ACME INC
        role:
          $ref: '#/components/schemas/Enum_AddressRole'
      description: The property or billing address information.
      discriminator:
        propertyName: '@type'
    AddressBldgRoom:
      properties:
        value:
          maxLength: 128
          type: string
          example: Moore House
        buldingInd:
          type: boolean
          description: >-
            When true, the information is a building name. When false, it is an
            apartment or room #
          example: true
      description: Address with building and room number
    AddressStreetNumber:
      properties:
        value:
          maxLength: 128
          type: string
          description: Street number value.
          example: 23B
        streetNmbrSuffix:
          maxLength: 32
          type: string
          description: Street Number Suffix
          example: B
        streetDirection:
          maxLength: 32
          type: string
          description: Direction of the Street
          example: NW
        ruralRouteNmbr:
          pattern: '[0-9]{1,5}'
          type: string
          description: RuralRoute Number
          example: '76'
        po_Box:
          maxLength: 128
          type: string
          description: PO Box Number
          example: '1001'
      description: >-
        The street number alone is the numerical number that precedes the street
        name in the address.
    StateProv:
      properties:
        value:
          maxLength: 8
          minLength: 1
          type: string
          description: >-
            State, province, or region code needed to identify location
            (typically two characters).
          example: CA
        name:
          maxLength: 512
          type: string
          description: State, province, or region name needed to identify location.
          example: California
      description: >-
        The standard code or abbreviation for the state, province, or region.
        May also include full length name.
    Country:
      properties:
        value:
          pattern: '[a-zA-Z]{2}'
          type: string
          description: The ISO 3166 code for the property's address.
          example: US
        id:
          type: string
          description: Custom user-assigned identifier for the country.
          example: '23'
        name:
          maxLength: 128
          type: string
          description: The full name of the country for the property's address.
          example: United States
        codeContext:
          maxLength: 32
          type: string
          description: >-
            The source of a code, such as the organization that provided the id
            number
          example: IATA
      description: Contains the information needed to identify a country.
    Enum_AddressRole:
      type: string
      description: >-
        Defines the type of location the address is assigned to. For
        TravelAgency address leave blank or use "Other".
      example: Business
      enum:
        - Home
        - Business
        - Mailing
        - Delivery
        - Destination
        - Other
        - Billing
    Email:
      properties:
        value:
          maxLength: 128
          type: string
          example: exampledomain@example.com
        id:
          type: string
          description: Electronic email addresses, in IETF specified format.
          example: email_1
        emailType:
          type: string
          description: >-
            Use email type to specify if the email is to be sent "TO" or sent
            "FROM"
          example: FROM
        comment:
          maxLength: 4096
          type: string
          description: Comments associated to the email
        preferredFormat:
          maxLength: 32
          type: string
          description: Mime media type
          example: text/html
        shareMarketing:
          $ref: '#/components/schemas/YesNoInheritEnum'
        shareSync:
          $ref: '#/components/schemas/YesNoInheritEnum'
        optOutInd:
          $ref: '#/components/schemas/YesNoInheritEnum'
        optInStatus:
          $ref: '#/components/schemas/OptInStatusEnum'
        optInDate:
          type: string
          description: The datetime of receiving the opt in notice
          format: date-time
          example: '2026-03-03 11:11:00+00:00'
        optOutDate:
          type: string
          description: The datetime the opt out notice was received
          format: date-time
          example: '2026-03-03 11:11:00+00:00'
        validInd:
          type: boolean
          description: >-
            If true, this is a valid email address that has been system verified
            via a successful email transmission.
          example: true
        provisionedInd:
          type: boolean
          description: If true then the email address came from the provisioning process
          example: true
      description: >-
        Electronic email addresses, in IETF specified format.

        Booking.com requires a traveler email address in the Hotel Create
        Reservation and Add Reservation requests. A system-generated
        confirmation email is sent to the traveler after the booking completes.
    YesNoInheritEnum:
      type: string
      description: Used to indicate marketing preferences, Yes, No, Inherit
      example: 'Yes'
      enum:
        - 'Yes'
        - 'No'
        - Inherit
    OptInStatusEnum:
      type: string
      description: Used to indicate marketing preferences, OptIn, OptOut
      enum:
        - OptedIn
        - OptedOut
        - Unknown
    PropertyAmenity:
      properties:
        '@type':
          type: string
          example: PropertyAmenity
        description:
          maxLength: 512
          type: string
          description: The type of amenity.
          example: Wedding services
        location:
          maxLength: 32
          type: string
          description: Location of the property
        Name:
          maxLength: 512
          type: string
          description: Name of the property
        OperationTimes:
          $ref: '#/components/schemas/OperationTimes'
        Inclusion:
          maxItems: 10
          type: array
          items:
            maxLength: 32
            type: string
        includedInd:
          type: boolean
          description: To represent if the Amenity is included in the rate
        surchargeInd:
          type: boolean
          description: To represent if the Amenity attracts a surcharge
        code:
          pattern: '[0-9A-Z]{1,3}(\\.[A-Z]{3}(\\.X){0,1}){0,1}'
          type: string
          description: OTA code used to describe the property amenity.
          example: '104'
        category:
          type: string
          description: Category of amenity.
          example: Meeting Facilities
      description: >-
        Each array instance is a specific amenity, such as type of breakfast,
        spa, or pool.
    OperationTimes:
      properties:
        '@type':
          type: string
          default: OperationTimes
        daysOfWeek:
          type: array
          items:
            $ref: '#/components/schemas/DayOfWeekEnum'
        openTime:
          type: string
          example: '45900'
        closeTime:
          type: string
          example: '06:00:00'
      description: The daily times of operation of the location.
    DayOfWeekEnum:
      type: string
      description: The names of the days of the week.
      example: Saturday
      enum:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
    PetPolicy:
      required:
        - allowed
      properties:
        '@type':
          type: string
          example: PetPolicy
        allowed:
          $ref: '#/components/schemas/YesNoUnknownEnum'
        policyCode:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: Pet policy code
        Description:
          $ref: '#/components/schemas/TextTitleAndDescription'
    TextTitleAndDescription:
      properties:
        value:
          maxLength: 4096
          type: string
          description: Descriptive text provided by the supplier.
          example: >-
            Ticket exchanged, room description text, or check in/out policy
            details.
        languages:
          type: array
          description: The language code of the description text.
          items:
            type: string
            example: English
        title:
          maxLength: 512
          type: string
          description: Title of the Text
          example: Group details.
      description: A descriptive text string and the related language.
    Restaurant:
      required:
        - name
      properties:
        '@type':
          type: string
          example: Restaurant
        name:
          maxLength: 128
          type: string
          description: The name of the restaurant
        cuisineCodes:
          type: array
          description: An OTA code to define the cuisine type
          example: 12
          items:
            pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
            type: string
        proximityCode:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: An OTA proximity code
        Distance:
          $ref: '#/components/schemas/Distance'
    Attraction:
      required:
        - name
      properties:
        '@type':
          type: string
          example: Attraction
        name:
          maxLength: 128
          type: string
          description: The name of the attraction.
        Distance:
          $ref: '#/components/schemas/Distance'
      description: An attraction near the property.
    TextFree:
      properties:
        value:
          maxLength: 4096
          type: string
          example: Additional information
        language:
          type: string
          description: Language of the text.
          example: English
      description: >-
        Textual information to provide descriptions and\/or additional
        information.
    MeetingRooms:
      properties:
        '@type':
          type: string
          example: MeetingRooms
        number:
          type: integer
          format: int32
        MeetingRoom:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/MeetingRoom'
    MeetingRoom:
      required:
        - name
      properties:
        '@type':
          type: string
          example: MeetingRoom
        name:
          maxLength: 128
          type: string
          description: The name of the meeting room
        codes:
          type: array
          description: OTA code for this room type.
          items:
            pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
            type: string
        capacity:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        unitOfSize:
          $ref: '#/components/schemas/UnitOfSize'
    UnitOfSize:
      type: string
      description: List of units of size i.e Square Feet, Square Meters
      enum:
        - Square Feet
        - Square Meters
    VirtualTour:
      required:
        - url
      properties:
        '@type':
          type: string
          example: VirtualTour
        url:
          type: string
        Description:
          $ref: '#/components/schemas/TextFree'
    CheckInOutPolicy:
      required:
        - checkInTime
        - checkOutTime
      properties:
        '@type':
          type: string
          example: CheckInOutPolicy
        checkInTime:
          pattern: ^(2[0-3]|[01][0-9]):([0-5]?[0-9])$
          type: string
          description: The check-in time, local to the property, in 24 hour format.
          example: '900'
        checkOutTime:
          pattern: ^(2[0-3]|[01][0-9]):([0-5]?[0-9])$
          type: string
          description: The check-out time, local to the property, in 24 hour format.
          example: '600'
        minimumAge:
          type: integer
          description: Minimum age to reserve room.
          format: int32
          example: 18
        Description:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/TextTitleAndDescription'
      description: Property check in and out policies.
    CurrencyAmount:
      properties:
        value:
          type: number
          description: The amount of a given currency.
          format: float
          example: 124.56
        code:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: >-
            An ISO 4217 alpha character code (3 characters) that specifies a
            money unit.
          example: USD
        minorUnit:
          type: integer
          description: >-
            Minor units are a mechanism for expressing the relationship between
            a major currency unit and its corresponding minor currency unit.
          format: int32
          example: 2
        currencySource:
          $ref: '#/components/schemas/CurrencySourceEnum'
        approximateInd:
          type: boolean
          description: >-
            "If true, the currency amount has been converted from the original
            amount.

            For Hotel Availability and Rules, true indicates this is a
            calculated value; false indicates this is the value returned by the
            property."
          example: true
      description: >-
        A monetary amount, up to 4 decimal places. Decimal place must be
        included.
    CurrencySourceEnum:
      type: string
      description: >-
        The system requesting or returning the currency code specified in the
        attribute
      example: Supplier
      enum:
        - Supplier
        - Charged
        - Requested
    MaximumAvailableRate:
      properties:
        value:
          type: number
          description: Amount of maximum available rate.
          format: float
          example: 124.56
        code:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: An ISO 4217 alpha character code that specifies a money unit.
          example: USD
        minorUnit:
          minimum: 0
          exclusiveMinimum: false
          pattern: ([0-4])
          type: integer
          description: >-
            Minor units are a mechanism for expressing the relationship between
            a major currency unit and its corresponding minor currency unit.
          format: int32
          example: 2
        authority:
          maxLength: 128
          type: string
          description: >-
            Indicates which supplier returned the maximum available rate for
            that property. Authority is not returned if it matches the value in
            PropertyInfo.Identifier.authority
          example: TVPT
      description: >-
        The hotel's maximum available rate for the property for the requested
        dates.
    ErrorResponse:
      description: Base common error response
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
    PropertiesQuerySearchWrapper:
      properties:
        PropertiesQuerySearch:
          $ref: '#/components/schemas/PropertiesQuerySearch'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    PropertiesQuerySearch:
      required:
        - '@type'
        - CheckInDate
        - CheckOutDate
        - SearchBy
      properties:
        '@type':
          type: string
          description: Discriminator class PropertiesQuerySearch only
          example: PropertiesQuerySearch
        SortOrder:
          $ref: '#/components/schemas/HotelSortOrderEnum'
        CheckInDate:
          type: string
          description: Check-in date in YYYY-MM-DD format.
          format: date
        CheckOutDate:
          type: string
          description: Check-out date in YYYY-MM-DD format.
          format: date
        ChainCodes:
          type: array
          description: >-
            One to six hotel chain codes to include in the search results. Each
            chain code is typically two alpha characters. ChainCodes supports
            the entry of brand codes, which are expanded internally by
            Travelport into the associated chain codes for that brand.
          items:
            maxLength: 5
            minLength: 2
            pattern: ([a-zA-Z0-9]{2,5})
            type: string
        HotelName:
          maxLength: 512
          type: string
          description: >-
            Search for properties with a matching hotel name. This string must
            match as a substring (case insensitive) in a property's name for the
            property to be returned. Must be at least three characters long.
            Supported characters are alphanumeric, comma, period, apostrophe,
            hyphen, semicolon, colon, and space.
        RequestedCurrency:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: >-
            Send a currency code to request conversion rate information for
            converting to that currency from the hotel location's currency. The
            response then returns the CurrencyRateConversion object, which
            provides the conversion rate of the specified currency that can be
            used to calculate, independently of the API, the conversion of the
            rates returned in the response.
        ImageSize:
          $ref: '#/components/schemas/ImageSizeEnum'
        RoomStayCandidate:
          maxItems: 10
          type: array
          description: Contains information associated with room searches.
          items:
            $ref: '#/components/schemas/RoomStayCandidate'
        RateCandidates:
          $ref: '#/components/schemas/RateCandidates'
        SearchBy:
          $ref: '#/components/schemas/SearchBy'
        returnAllImagesInd:
          type: boolean
          description: >-
            If true, returns all property images of the requested ImageSize. If
            false, returns the best single image. Default behavior is false.
        PropertyAmenityCode:
          type: array
          items:
            maxLength: 5
            minLength: 2
            pattern: ([a-zA-Z0-9]{2,5})
            type: string
        BrandCodes:
          type: array
          description: The permitted property brand code(s) to be returned for this request
          example: EM, EH
          items:
            maxLength: 2
            minLength: 2
            pattern: ([a-zA-Z0-9]{2,5})
            type: string
        returnOnlyAvailablePropertiesInd:
          type: boolean
          description: >-
            If true, returns only properties with current availability for the
            dates requested. In some cases, fewer than 25 properties per page
            may be returned. If false, return properties regardless of
            availability. Default behavior is false.
        AggregatorList:
          type: array
          items:
            $ref: '#/components/schemas/HotelAggregatorCodeEnum'
        recommendedPropertyAmenitiesInd:
          type: boolean
          description: >-
            If true, a limited set of property amenities will be returned in the
            response. if false, or omitted a full set of property amenities will
            be returned in the response.
        applyLenientPropertyListRulesInd:
          type: boolean
          description: >-
            If true, properties are returned by distance from location, some
            properties in the list will not support any of the negotiated rates
            in the request.
      description: >-
        Used for a Hotel Search by Location request. Defines the search
        criteria, including the type of location to search by (address,
        coordinates, airport, or city), stay dates, room occupancy details, and
        optional filtering criteria. This request is usually followed by a Hotel
        Availability request or optionally a Hotel Details request.
    HotelSortOrderEnum:
      type: string
      description: The method to be used in sorting hotel properties
      enum:
        - StarRating
        - Proximity
    RoomStayCandidate:
      required:
        - GuestCounts
      properties:
        GuestCounts:
          $ref: '#/components/schemas/GuestCounts'
        RoomAmenity:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/RoomAmenity'
      description: Information associated with room searches, such as the number of guests.
    GuestCounts:
      required:
        - GuestCount
      properties:
        '@type':
          type: string
          example: GuestCounts
        GuestCount:
          maxItems: 99
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/GuestCount'
      description: The number and age(s) of guests within the room.
    GuestCount:
      properties:
        '@type':
          type: string
          example: GuestCount
        age:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: >-
            The age of the guest. Required only when request includes a child in
            the room.
          format: int32
          example: 21
        count:
          type: integer
          description: Number of guests. Supports numeric values 1-9 inclusive.
          format: int32
          example: 2
        ageQualifyingCode:
          maxLength: 32
          type: string
          description: >-
            "Required only for children or if traveler age is relevant, such as
            for a senior discount. Supported values include '8' and '10'. 8:
            Traveler in this GuestCount is a child. 10: Traveler in this
            GuestCount is an adult."
          example: '10'
      description: |-
        Defines the number of guests and their age(s).
         Required for Create Reservation (Full Payload) if children are part of the request.
    RoomAmenity:
      properties:
        '@type':
          type: string
          default: RoomAmenity
        description:
          maxLength: 512
          type: string
          description: Description of amenity received from supplier.
          example: WiFi
        quantity:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: quantity of amenity
          format: int32
        Name:
          maxLength: 32
          type: string
          description: Room Amenity Name
          example: 24 hour Room Service
        Inclusion:
          maxItems: 10
          type: array
          items:
            maxLength: 32
            type: string
        includedInd:
          type: boolean
          description: Represents if the amenity is included with the rate
        surchargeInd:
          type: boolean
          description: Represents if the amenity attracts a surcharge.
        code:
          pattern: '[0-9A-Z]{1,3}(\\.[A-Z]{3}(\\.X){0,1}){0,1}'
          type: string
          description: >-
            OTA code used to describe the room amenity. This is optional in the
            Properties Search request but mandatory in the response.
      description: Room amenity name and description.
    RateCandidates:
      required:
        - '@type'
        - RateCandidate
      properties:
        '@type':
          type: string
          description: Discriminator classes RateCandidates and RateCandidatesDetail
          example: RateCandidates
        RateCandidate:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/RateCandidate'
        prePayRatesOnlyInd:
          type: boolean
          description: >-
            A prepay rate charges the full amount on the credit card immediately
            on booking. If true, returns only pre-paid rates. If false, allows
            the return of all rates.
        postPayRatesOnlyInd:
          type: boolean
          description: >-
            A postpay rate (most common in the US) charges the credit card at
            the property when the guest checks in. If true, returns only
            post-paid rates. If false, allows the return of all rates.
        removeSpecialRatesInd:
          type: boolean
          description: >-
            Used to request the removal of rate category
            (Promotional/Package/etc.) rates that may have been returned by the
            supplier as typical published rates. If true, removes all rate
            category type rates (except for negotiated rates). If true but one
            or more specific rate categories are requested, then this indicator
            is ignored and the rate category is applied. If false, allows the
            return of all rates returned by the supplier with no filtering.
            Default behavior is false.
      description: >-
        For a Hotel Search request: up to eight negotiated rate codes and/or one
        frequent guest number. For a Hotel Availability request: rate plans,
        access codes, and rate categories - send only if requesting rate plans.
      discriminator:
        propertyName: '@type'
    RateCandidate:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes RateCandidate and RateCandidateDetail
          example: RateCandidateDetail
        priority:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: A rate candidate priority
          format: int32
        rateCode:
          maxLength: 6
          minLength: 3
          type: string
          description: >-
            "The negotiated rateCode to be applied to the request. 

            For Hotel Availability, each rateCode must be associated with a
            chainCode, propertyCode, and a rateCategory of
            'Multi-level/Negotiated/Secure'. 

            For Hotel Rules, this value can be found, if returned, in the
            Availability response's ProductRateCodeInfo/RateCodeInfo/value."
          example: HL123
        rateCategory:
          $ref: '#/components/schemas/RateCategoryEnum'
        chainCode:
          maxLength: 5
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,5})
          type: string
          description: Code for the hotel chain (typically 2 characters)
          example: UR
        propertyCode:
          maxLength: 32
          type: string
          description: >-
            The property code of the requested property (typically 5
            characters).
          example: G3375
        masterRateCode:
          maxLength: 6
          minLength: 6
          type: string
          description: >-
            An agency-created rate code that can be translated into up to 12
            negotiated rate codes. If masterRateCode is sent, any additional
            rateCodes will be ignored.
          example: 1ABC23
      description: >-
        Rate plan details and/or frequent guest number, if requesting. 

        For Hotel Availability, the values required differ according to whether
        you are sending a negotiated rate code or a rate category. Send one
        instance of RateCandidate for each rate plan to request. To include
        CustomerLoyalty, use RateCandidateDetail.
         
        For Hotel Rules, include the values for the offer you want to request
        rules on, if returned in the Availability response. May include
        rateCode, rateID, rateCategory, chainCode, and propertyCode
      discriminator:
        propertyName: '@type'
    RateCategoryEnum:
      type: string
      description: >-
        For Hotel Search, request a rate category by sending up to 8 OTA rate
        categories to search for. If the supplier has rates available for the
        requested category, the response contains those rates and indicates them
        as such. Some properties do not return these rates unless explicitly
        requested.

        For a Hotel Rules request, this value can be found, if returned, in the
        Availability response's ProductRateCodeInfo/RateCodeInfo/rateCategory.
      example: Discount
      enum:
        - All
        - Association
        - Business
        - BusinessStandard
        - Club
        - Convention
        - Corporate
        - Consortiums
        - Discount
        - Credential
        - Employee
        - FamilyPlan
        - FullInclusive
        - Government
        - Inclusive
        - Industry/TravelAgentRate
        - Leisure
        - Military
        - Monthly
        - Multi-DayPackage
        - MultLevel/Negotiated/Secure
        - Other
        - Package
        - PrePaid
        - Promotional
        - RackGeneral
        - SeniorCitizen
        - Standard
        - Tour
        - VIP
        - Weekend
        - Weekly
      x-enumDescriptions:
        All: >-
          When requesting rates, All represents the category set 'Promotional,
          Package, Senior Citizen, Family Plan, Weekend, Association, Corporate,
          Government'.
    SearchBy:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes SearchByGeoLocation, SearchByAddress,
            SearchByAirport, and SearchByCity
          example: SearchByAirport
        SearchRadius:
          $ref: '#/components/schemas/Distance'
      description: >-
        Search for Hotels, based on the type of location: 1) geographic
        coordinates, 2) address, 3) IATA airport code, or 4) IATA city code.
      discriminator:
        propertyName: '@type'
    HotelAggregatorCodeEnum:
      type: string
      description: >-
        Restrict the search to a specific aggregator. You must be authorized for
        any aggregator selected.
      enum:
        - TVPT
        - BKNG
        - EXPE
        - BNTL
      x-enumDescriptions:
        TVPT: Travelport
        BKNG: Booking.com
        EXPE: not supported
        BNTL: not supported
    PropertiesQuerySpecificPropertyListWrapper:
      properties:
        PropertiesQuerySpecificPropertyList:
          $ref: '#/components/schemas/PropertiesQuerySpecificPropertyList'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    PropertiesQuerySpecificPropertyList:
      required:
        - '@type'
        - PropertyKey
        - checkinDate
        - checkoutDate
        - numberOfGuests
      properties:
        '@type':
          type: string
          description: Discriminator class PropertiesQuerySpecificPropertyList only
          example: PropertiesQuerySpecificPropertyList
        checkinDate:
          type: string
          description: Check-in date in YYYY-MM-DD format.
          format: date
        checkoutDate:
          type: string
          description: Check-out date in YYYY-MM-DD format.
          format: date
        numberOfGuests:
          type: integer
          description: >-
            Number of travelers. Must be a numeric value between 1 and 9. Send
            the total number of guests across all counts in
            RoomStayCandidate/GuestCount.
          format: int32
        requestedCurrency:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: >-
            Send a currency code to request conversion rate information for
            converting to that currency from the hotel location's currency. The
            response then returns the CurrencyRateConversion object, which
            provides the conversion rate of the specified currency that can be
            used to calculate, independently of the API, the conversion of the
            rates returned in the response.
        minimumRate:
          type: number
          description: Minimum rate
          format: float
        maximumRate:
          type: number
          description: Maximum rate
          format: float
        numberOfRooms:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: Number of rooms
          format: int32
        PropertyKey:
          maxItems: 250
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/PropertyKey'
        RateCandidates:
          $ref: '#/components/schemas/RateCandidates'
        imageSize:
          $ref: '#/components/schemas/ImageSizeEnum'
        RoomStayCandidates:
          $ref: '#/components/schemas/RoomStayCandidates'
        returnAllImagesInd:
          type: boolean
          description: >-
            If true, returns all property images of the requested ImageSize. If
            false, returns the best single image. Default behavior is false.
        AggregatorList:
          type: array
          items:
            $ref: '#/components/schemas/HotelAggregatorCodeEnum'
        recommendedPropertyAmenitiesInd:
          type: boolean
          description: >-
            if true, a limited set of property amenities will be returned in the
            response. if false, or omitted a full set of property amenities will
            be returned in the response.
      description: >-
        Used for a Hotel Search by ID request. Defines a request to search for
        specific hotel properties by their property IDs on given stay dates.
        This request typically starts the hotel shopping workflow when the
        property IDs are already known and is usually followed by a Hotel
        Availability request or optionally a Hotel Details request.
    RoomStayCandidates:
      required:
        - RoomStayCandidate
      properties:
        RoomStayCandidate:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/RoomStayCandidate'
      description: Includes traveler information.
    CatalogOfferingsQueryRequestHospitalityWrapper:
      properties:
        CatalogOfferingsQueryRequest:
          $ref: '#/components/schemas/CatalogOfferingsQueryRequest'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    CatalogOfferingsQueryRequest:
      required:
        - '@type'
        - CatalogOfferingsRequest
      properties:
        '@type':
          type: string
          description: Discriminator class CatalogOfferingsRequestHospitality
          example: CatalogOfferingsRequestHospitality
        CatalogOfferingsRequest:
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/CatalogOfferingsRequestHospitality'
      description: >-
        Used for a Hotel Availability request. Defines a request to retrieve
        available room types and rates for one or more specified hotel
        properties on given stay dates. This request typically follows a Hotel
        Search request and is sent before booking.
    CatalogOfferingsRequestHospitality:
      allOf:
        - $ref: '#/components/schemas/CatalogOfferingsRequest'
        - required:
            - StayDates
          properties:
            requestedCurrency:
              pattern: '[a-zA-Z]{3}'
              type: string
              description: >-
                If sent, the response includes a currency rate conversion value
                from the local currency to the currency specified. This value
                can be applied to the hotel's local pricing to convert rates;
                the API does not convert any amounts.
            maxResponseWaitTime:
              type: integer
              description: >-
                Supports a timeout in milliseconds when requesting availability
                for multiple properties. If sent, the request times out at the
                specified time and returns all properties retrieved at that
                point.
              format: int32
            StayDates:
              $ref: '#/components/schemas/DateOrDateWindows'
            HotelSearchCriterion:
              $ref: '#/components/schemas/HotelSearchCriterion'
            MinimumAmount:
              $ref: '#/components/schemas/CurrencyAmount'
            MaximumAmount:
              $ref: '#/components/schemas/CurrencyAmount'
            verboseResponseInd:
              type: boolean
              description: >-
                Used to indicate whether to group common property details. If
                true, disables the grouping of common property details in the
                response's ReferenceList object and instead returns them for
                each property in Offer/Products/Product. In this case
                ProductHospitality is returned. If false, returns common details
                across properties in a ReferenceList object with a
                cross-reference for each offer. For this case
                ProductHospitalityOffer will be returned. Default behavior is
                false.
            recommendedRoomAmenitiesInd:
              type: boolean
              description: >-
                if true, a limited set of room amenities will be returned in the
                response. if false, or omitted a full set of room amenities will
                be returned in the response.
    CatalogOfferingsRequest:
      properties:
        '@type':
          type: string
          example: CatalogOfferingsRequestHospitality
        SearchControlConsoleChannelID:
          $ref: '#/components/schemas/SearchControlConsoleChannelID'
      discriminator:
        propertyName: '@type'
    SearchControlConsoleChannelID:
      properties:
        value:
          maxLength: 32
          type: string
          description: String for the Content Optimizer channel ID.
          example: IBM
        sccType:
          maxLength: 32
          type: string
          description: String for the Content Optimizer type.
          example: '999'
      description: >-
        The Search API supports the Travelport Content Optimizer (formerly known
        as Search Control Console/SCC) for GDS content only. Send either the
        value or the sccType. If both values are sent, the sccType is applied.
        Travel agency administrators use Content Optimizer to create business
        rules for filtering certain air shopping results. If your client's
        application does not use Content Optimizer, do not use these attributes.
        Contact your Travelport representative if you would like additional
        information.
    DateOrDateWindows:
      properties:
        specific:
          type: string
          description: >-
            A specific date in YYYY-MM-DD format. When used within a window,
            must fall between start and end.
          format: date
          example: '2026-03-03'
        start:
          type: string
          description: >-
            "For Air, the earliest date acceptable for the start date. 

            For Hotel, the check-in, cancellation, or penalty deadline date.
            Format YYYY-MM-DD. Used with end to designate a range of dates."
          format: date
          example: '2026-03-03'
        end:
          type: string
          description: >-
            "For Air, the latest date acceptable for the end date. 

            For Hotel, the check-out, cancellation, or penalty deadline date.
            Format YYYY-MM-DD."
          format: date
          example: '2026-03-03'
        duration:
          type: string
          description: Duration from start date.
          example: P1D
        durationUnit:
          $ref: '#/components/schemas/DurationUnitEnum'
      description: Indicates a date, such as check-in, check-out, deadline, or expiry date.
    DurationUnitEnum:
      type: string
      description: Defines the Units that can be applied to Stay restrictions.
      example: Months
      enum:
        - Minutes
        - Hours
        - Days
        - Months
        - MON
        - TUES
        - WED
        - THU
        - FRI
        - SAT
        - SUN
    HotelSearchCriterion:
      required:
        - PropertyRequest
      properties:
        '@type':
          type: string
          example: HotelSearchCriterion
        numberOfRooms:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: >-
            Number of rooms requested at a single property. Supports values 1-9
            inclusive.
          format: int32
        PropertyRequest:
          maxItems: 100
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/PropertyRequest'
        RoomStayCandidates:
          $ref: '#/components/schemas/RoomStayCandidates'
        RateCandidates:
          $ref: '#/components/schemas/RateCandidates'
        AggregatorList:
          type: array
          items:
            $ref: '#/components/schemas/HotelAggregatorCodeEnum'
        ExtraAccommodation:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/ExtraAccommodation'
    PropertyRequest:
      required:
        - PropertyKey
      properties:
        '@type':
          type: string
          example: PropertyRequest
        moreRatesToken:
          maxLength: 512
          type: string
          description: More rates token
        PropertyKey:
          $ref: '#/components/schemas/PropertyKey'
      description: >-
        Property details for each property requested, up to 10 properties. Send
        a separate instance of PropertyRequest for each property.
    ExtraAccommodation:
      required:
        - '@type'
        - AccommodationType
        - quantity
      properties:
        '@type':
          type: string
          example: ExtraAccommodation
        quantity:
          type: integer
          description: The quantity.
          format: int32
        AccommodationType:
          $ref: '#/components/schemas/ExtraAccomodationENUM'
    ExtraAccomodationENUM:
      type: string
      enum:
        - Crib
        - ExtraAdult
        - ExtraChild
        - RollawayAdult
        - RollawayChild
    CatalogOfferingsHospitalityResponseWrapper:
      properties:
        CatalogOfferingsHospitalityResponse:
          $ref: '#/components/schemas/CatalogOfferingsHospitalityResponse'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    CatalogOfferingsHospitalityResponse:
      properties:
        '@type':
          type: string
          default: CatalogOfferingsHospitalityResponse
        CatalogOfferings:
          $ref: '#/components/schemas/CatalogOfferings'
      description: >-
        The response of a Catalog Offerings hospitality endpoint request. By
        default, common information from each room offer is consolidated into
        the single object ReferenceList. If the optional verboseResponseInd
        indicator is sent in the request, ReferenceList is not returned and
        common property details are not grouped.
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
    CatalogOfferings:
      allOf:
        - $ref: '#/components/schemas/CatalogOfferingsID'
        - required:
            - CatalogOffering
          properties:
            totalCatalogOffering:
              type: integer
              description: Total number of rates available for this request.
              format: int32
            catalogOfferingPerPage:
              type: integer
              description: Total number of rates returned per page.
              format: int32
            numberOfPages:
              type: integer
              description: Total number of pages created by this request.
              format: int32
              example: 5
            CatalogOffering:
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/CatalogOffering'
            AncillaryOffering:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/AncillaryOfferingID'
    CatalogOfferingsID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          example: CatalogOfferings
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: CatalogOfferings_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    CatalogOffering:
      description: >-
        For Hotels, each instance returns information related to one bookable
        room, at a unique rate. A response returns a maximum of 100 rates. The
        first rate in the list is the single lowest rate returned no matter how
        many aggregators respond. The remaining rates are grouped in the order
        of rates returned from Travelport, followed by rates returned from
        Booking.com.
      allOf:
        - $ref: '#/components/schemas/CatalogOfferingID'
        - required:
            - Price
            - ProductOptions
          properties:
            ProductOptions:
              maxItems: 10
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ProductOptions'
            Price:
              $ref: '#/components/schemas/PriceDetail'
            TermsAndConditions:
              $ref: '#/components/schemas/TermsAndConditions'
    CatalogOfferingID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            'Discriminator class for Hotel Availability is
            CatalogOfferingHospitality. 

            Discriminator class for ExchangeSearch is CatalogOfferingModify.'
          example: CatalogOffering
        id:
          type: string
          description: >-
            "Unique offer identifier that can be sent in subsequent payload
            requests to reference this offer. 

            For Hotel Availability, offers are cached for 30 minutes. If a Rules
            request or Reservation is not created within 30 minutes, a new
            Availability request must be sent."
          example: >-
            108c5875-c822-4d2e-bb9f-c96368100f4a:a709ffcdc1f681c5cf3f1d7da1a8ebfc
        CatalogOfferingRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            message
          example: co1
        Identifier:
          $ref: '#/components/schemas/Identifier'
        ContentSource:
          $ref: '#/components/schemas/ContentSourceEnum'
      discriminator:
        propertyName: '@type'
    ContentSourceEnum:
      type: string
      description: Indicates the owner the offer or document.
      example: GDS
      enum:
        - GDS
        - NDC
        - LCC
        - API
      x-enumDescriptions:
        GDS: Use for GDS sourced transactions
        NDC: Use for NDC sourced transactions
        LCC: Do not use - replaced by API
        API: Use for all other API sourced transactions including low cost carriers
    ProductOptions:
      allOf:
        - $ref: '#/components/schemas/ProductOptionsID'
        - required:
            - Product
          properties:
            sequence:
              type: integer
              description: NonnegativeInteger
              format: int32
              example: 1
            Product:
              maxItems: 1000
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ProductID'
    ProductOptionsID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes ProductOptionsID and ProductOptions.
          example: ProductOptions
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: ProductOptions_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
        ProductOptionsRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            message
          example: ProductOptions_1
      discriminator:
        propertyName: '@type'
    ProductID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator. Air Search child classes are ProductAir and
            ProductAncillary. Exchange Search child class is ProductAir.
            Ancillary Search is ProductAncillary. Seat Map child class
            isProductSeatAvailability. Air Price child classes are ProductAir
            and ProductAncillary. Hotel Availability child classes are
            ProductHospitality and ProductHospitalityOffer. Hotel Rules and
            HotelReservation child classes are ProductHospitality. All Vehicle
            APIs are ProductVehicle and ProductAncillaryVehicle. Reservation and
            Reservation Workbench child classes are ProductAir,
            ProductAncillary, ProductHospitality, ProductVehicle, and
            ProductAncillaryVehicle.
          example: ProductAir
        id:
          type: string
          description: Local id within a given message to support referencing this object.
          example: product_1
        productRef:
          type: string
          description: >-
            Reference id that corresponds to the product 'id' in
            ReferenceListProduct.Product. To find flight details for a product,
            use the ProductRef id to identify the product in
            ReferenceListProduct.Product, and use the Flight id's (e.g., s3, s4)
            to match to flight information in ReferenceListFlight.Flight.
          example: product_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: >-
        Parent class for Product information. One instance is given for each
        product.
      discriminator:
        propertyName: '@type'
    PriceDetail:
      description: >-
        Child class of Price. This includes all of the Price object plus the
        Pricebreakdown which gives detailed Price information per PTC or Hotel
        offering.

        For a Hotels Create Reservation (Full Payload) request, find the values
        to send in the Price objects from either Availability (returned in
        CatalogOffering/Price) or Rules (returned in Offer/Price). Although you
        can send the price returned in either API, the Rules pricing may be more
        accurate. If you sent a Rules request, send the value from that
        response. You must include CurrencyCode, Base, TotalTaxes, and
        TotalPrice. When returned from the previous steps, additionally send
        TermsAndConditionsFull, ProductRateCodeInfo, and RateCodeInfo.
      allOf:
        - $ref: '#/components/schemas/Price'
        - properties:
            FlightPassCredits:
              type: integer
              description: The total number of flight pass credits consumed for this offer.
              format: int32
              example: 2
            PriceBreakdown:
              maxItems: 50
              type: array
              items:
                $ref: '#/components/schemas/PriceBreakdown'
    Price:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes Price or PriceDetail
          example: PriceDetail
        id:
          type: string
          description: Internally referenced id
          example: '2'
        CurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        Base:
          type: number
          description: |-
            "Base price before taxes and fees. 
            For Hotel, may not be returned by all suppliers."
          format: float
          example: 20.2
        TotalTaxes:
          type: number
          description: |-
            "Total taxes applied to the base price. 
            For Hotel, may not be returned by all suppliers."
          format: float
          example: 34.4
        TotalFees:
          type: number
          description: Total fees included in Total Price.
          format: float
          example: 201
        TotalPrice:
          type: number
          description: >-
            Total price of this offer including the base price and all taxes and
            fees.
          format: float
          example: 34
        VendorCurrencyTotal:
          $ref: '#/components/schemas/VendorCurrencyTotal'
      description: >-
        Price includes a summary of the Base, Taxes, and Fees applicable to the
        offer in the currency indicated.
      discriminator:
        propertyName: '@type'
    VendorCurrencyTotal:
      properties:
        '@type':
          type: string
          default: VendorCurrencyTotal
        currencySource:
          $ref: '#/components/schemas/CurrencySourceEnum'
        CurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        Base:
          type: number
          description: >-
            The price prior to all applicable taxes of a product such as the
            rate for a room or fare for a flight.
          format: float
          example: 120.2
        Taxes:
          $ref: '#/components/schemas/Taxes'
        Fees:
          $ref: '#/components/schemas/Fees'
        Total:
          type: number
          description: Specifies the total price including base + taxes + fees
          format: float
          example: 30.13
        approximateInd:
          type: boolean
          description: True if this amount has been converted from the original amount
          example: true
      description: >-
        No longer used. Previously used to expose the local vendor currency when
        it is different to the purchased currency
      deprecated: true
    Taxes:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator. Child class is TaxesDetail
          example: TaxesDetail
        TotalTaxes:
          type: number
          description: >-
            A monetary amount, representing the total of all taxes included in
            this offer. Supports up to 4 decimal places; decimal place must be
            included.
          format: float
          example: 330.1
        TaxInfo:
          maxItems: 10
          type: array
          description: Returned for TripChange APIS only.
          items:
            $ref: '#/components/schemas/TaxInfo'
      description: >-
        Summary of all individual taxes. Child class TaxesDetail provides the
        breakdown of individual taxes.
      discriminator:
        propertyName: '@type'
    TaxInfo:
      required:
        - Amount
        - TaxBreakdown
        - TaxCode
      properties:
        '@type':
          type: string
          example: TaxInfo
        TaxCode:
          type: string
          description: The tax code
          example: XF
        CurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        Amount:
          type: number
          description: The amount of the tax applied
          format: float
        TaxBreakdown:
          maxItems: 20
          type: array
          description: The breakdown of the tax for this tax code
          items:
            $ref: '#/components/schemas/TaxBreakdown'
      description: >-
        Provides detailed information on tax breakdown when the tax code is
        common and is made up of multiple amounts. Used in TripChange APIS only.
    TaxBreakdown:
      required:
        - AirportCode
      properties:
        '@type':
          type: string
          example: TaxInfo
        AirportCode:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: The airport location the tax applies to
          example: MIA
        CurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        Amount:
          type: number
          description: The amount of the tax applied
          format: float
      description: The tax breakdown of XF style taxes
    Fees:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator. Child class FeesDetail
          example: FeesDetail
        TotalFees:
          type: number
          description: >-
            Total fees included in the TotalPrice. Supports up to 4 decimal
            places; decimal place needs to be included.
          format: float
          example: 111.11
        TotalAdditionalFeesPayableLocally:
          type: number
          description: >-
            Fees due separately at the property. Expected to be paid in local
            currency. These fees are not included in the Offer TotalPrice.
          format: float
          example: 2.1
      description: >-
        Includes TotalFees object to return the sum total of any fees. Child
        class FeesDetail includes a breakdown of the individual fees.
      discriminator:
        propertyName: '@type'
    PriceBreakdown:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator. Air Search and Air Price APIs child classes are
            PriceBreakdownAir and PriceBreakdownAncillary.Search Ancillaries and
            Seat Availabilities child classes are PriceBreakdown,
            PriceBreakdownAncillary, and PriceBreakdownAncillaryAir. All Hotel
            API child classes are PriceBreakdownHospitality.Vehicle API child
            classes are PriceBreakdownVehicleCharges,
            PriceBreakdownVehicleDeposit, PriceBreakdownVehiclePrice, and
            PriceBreakdownAncillaryVehicle. Reservation and Reservation
            Workbench APIs are PriceBreakdownAir, PriceBreakdownAncillary,
            PriceBreakdownHospitality, PriceBreakdownVehicleCharges,
            PriceBreakdownVehicleDeposit, PriceBreakdownVehiclePrice, and
            PriceBreakdownAncillaryVehicle.
          example: PriceBreakdownAir
        Amount:
          $ref: '#/components/schemas/Amount'
        Commission:
          $ref: '#/components/schemas/Commission'
      description: >-
        Contains a detailed breakdown of the Price provided for each PTC or each
        Traveler. The information returned may vary by provider and location.
      discriminator:
        propertyName: '@type'
    Amount:
      properties:
        '@type':
          type: string
          default: Amount
        currencySource:
          $ref: '#/components/schemas/CurrencySourceEnum'
        CurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        Base:
          type: number
          description: >-
            The base price prior to all applicable taxes or fees of a product,
            such as the amount for a room or fare for a flight.
          format: float
          example: 120.2
        Taxes:
          $ref: '#/components/schemas/Taxes'
        Fees:
          $ref: '#/components/schemas/Fees'
        Total:
          type: number
          description: >-
            "Specifies the total price including base + taxes + fees. 

            In PriceBreakdownHospitality, this total is for a given group of
            nights. 

            In PriceBreakdownAir this is the total for one passenger of this PTC
            type."
          format: float
          example: 230.13
        approximateInd:
          type: boolean
          description: if true this amount has been converted from the original amount
          example: true
      description: Amount represents the cost applied
    Commission:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator. Child classes CommissionAmount or CommissionPercent
          example: CommissionAmount
        application:
          $ref: '#/components/schemas/CommissionEnum'
      description: >-
        Commission information. In Air Search commission is returned for GDS
        only; not supported for NDC. Any commission filed by an airline in a
        CAT35 fare is returned in PriceBreakdownAir/Commission. The amount is
        either a percent of the fare component (@type CommissionPercent and the
        Percent object) or an amount (@type CommissionAmount and the Amount
        object).
      discriminator:
        propertyName: '@type'
    CommissionEnum:
      type: string
      description: Type of commission
      example: Full
      enum:
        - Full
        - Partial
        - Non-paying
        - No-show
        - Adjustment
        - Commissionable
      x-enumDescriptions:
        Commissionable: Indicates the rate pays commission.
        Non-paying: Indicates no commission.
    TermsAndConditions:
      description: Terms And Conditions that apply to an offer.
      allOf:
        - $ref: '#/components/schemas/TermsAndConditionsID'
        - properties:
            ExpiryDate:
              type: string
              description: >-
                The date and time the offer will expire. Not returned in GDS
                Search. NDC generally allows 20 to 30 minutes to create a
                booking (the offer time limit). That time limit varies by
                airline and is returned here in the Search response.
              format: date-time
              example: '2022-08-07 12:12:00+00:00'
            CustomerLoyalty:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/CustomerLoyalty'
    TermsAndConditionsID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator. Air Search child classes are TermsAndConditionsAir
            and TermsAndConditionsAncillary. Exchange Search child class is
            TermsAndConditionsAirChange. Search Ancillaries and Seat
            Availabilities child classes are TermsAndConditions,
            TermsAndConditionsAncillary, and TermsAndConditionsAncillaryAir.
            Hotel Availability child class is TermsAndConditionsHospitality.
          example: TermsAndConditionsAir
        id:
          type: string
          description: >-
            Local id within a given message to support referencing this object.
            For Air Search APIs, matches to the reference value in
            ProductBrandOffering/TermsAndConditions/termsAndConditionsRef in
            instances of ProductBrandOptions.
          example: TC_1
        termsAndConditionsRef:
          type: string
          description: >-
            Reference id that corresponds to the TermsAndConditions 'id' in
            ReferenceListTermsAndConditions.TermsAndConditions.
          example: TC_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    CustomerLoyalty:
      required:
        - supplier
        - value
      properties:
        value:
          maxLength: 1000
          minLength: 1
          type: string
          description: Number on loyalty card.
          example: '132456'
        id:
          type: string
          description: Optional Customer Loyalty Id. Not saved
          example: Loyalty_1
        priority:
          type: integer
          description: Optional Numeric Priority Code
          format: int32
          example: 2
        programId:
          maxLength: 128
          type: string
          description: >-
            "Specifies an identifier to indicate the company owner of the
            loyalty program. Typically two characters.

            For frequent guest number, the hotel supplier or brand code. 

            For frequent flyer number, the air supplier code of the loyalty
            program."
          example: United
        programName:
          maxLength: 128
          type: string
          description: Supplier's loyalty program name.
          example: Frontier-EarlyReturns
        supplierType:
          maxLength: 32
          type: string
          description: >-
            The type of supplier of a loyalty program. Uses 'hotel' for frequent
            guest number or 'air' for frequent flyer number.
          example: Airline
        supplier:
          maxLength: 128
          type: string
          description: >-
            Supplier of a loyalty program (typically 2 characters representing
            the hotel, brand, or airline).
          example: UA
        tier:
          maxLength: 32
          type: string
          description: Customer Loyalty tier
          example: Silver
        shareWithSupplier:
          type: array
          description: >-
            The list of suppliers that the CustomerLoyalty number is shared.
            Used for cross accrual.
          items:
            maxLength: 32
            type: string
            example: LH
        cardHolderName:
          maxLength: 128
          type: string
          description: >-
            Customer loyalty member name; up to 128 characters are supported. In
            Air Search, for discounted offers to be returned, the name must be
            sent as LAST FIRST; e.g.,if SMITH is the last name and JORDAN the
            first name, send as SMITH JORDAN
          example: John Smith
        validatedInd:
          type: boolean
          description: Customer loyalty number has been validated by the supplier
          example: true
        prefix:
          maxLength: 10
          type: string
          description: The cardholder name prefix title like Mr, Mrs, Dr
          example: Dr
        given:
          maxLength: 30
          type: string
          description: The First Name of the Cardholder
          example: John
        middle:
          maxLength: 30
          type: string
          description: Middle Name of the Cardholder
          example: Wilkinson
        surname:
          maxLength: 30
          minLength: 1
          type: string
          description: Last Name of the Cardholder
          example: Smith
      description: >-
        Specifies the ID for the membership program. Object for sending customer
        loyalty information, such as for a frequent flyer program.
    AncillaryOfferingID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes AncillaryOfferingID and AncillaryOffering
          example: AncillaryOffering
        id:
          type: string
          description: Local identifier within a given message for this object.
        CatalogOfferingRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            message
        AncillaryOfferingRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
    OfferQueryBuildFromCatalogOfferingWrapper:
      properties:
        OfferQueryBuildFromCatalogOffering:
          $ref: '#/components/schemas/OfferQueryBuildFromCatalogOffering'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    OfferQueryBuildFromCatalogOffering:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator class OfferQueryBuildFromCatalogOffering only
          example: OfferQueryBuildFromCatalogOffering
        BuildFromCatalogOfferingHospitality:
          $ref: '#/components/schemas/BuildFromCatalogOfferingHospitality'
      description: >-
        Used for a Hotel Rules (Reference Payload) request. Defines a request to
        retrieve the rules associated with a specific rate by referencing a
        selected offer from a preceding Hotel Availability response. This
        request is typically sent directly after Hotel Availability and before
        booking. If the cached offer expires, a new Hotel Availability request
        must be sent.
    BuildFromCatalogOfferingHospitality:
      properties:
        '@type':
          type: string
          example: BuildFromCatalogOfferingHospitality
        CatalogOfferingIdentifier:
          $ref: '#/components/schemas/Identifier'
        SpecialInstruction:
          maxLength: 50
          type: string
          description: Customer generated special instructions transmitted to the hotel.
          example: Guest prefers room on first floor.
        NumberOfRooms:
          type: integer
          description: Not supported.
          format: int32
          example: 1
          deprecated: true
        RoomPerTravelerInd:
          type: boolean
          description: Not implemented.
          deprecated: true
      description: >-
        For a Rules (Reference Payload) or a Create Reservation (Reference
        Payload) call, reference the value returned in the Availability response
        at CatalogOffering/id for the specific offer you want to request. Send
        this value in CatalogOfferingIdentifier. Offers from an Availability
        response are stored in cache for 30 minutes. If the offers expire you
        must send a new Availability request.
    OfferHospitalityResponseWrapper:
      properties:
        OfferHospitalityResponse:
          $ref: '#/components/schemas/OfferHospitalityResponse'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    OfferHospitalityResponse:
      properties:
        Offer:
          $ref: '#/components/schemas/Offer'
      description: >-
        The response of a Hotel Rules (Reference Payload) or Hotel Rules (Full
        Payload) endpoint request.
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
    Offer:
      description: Contains all of the returned offer details.
      allOf:
        - $ref: '#/components/schemas/OfferID'
        - required:
            - Price
            - Product
          properties:
            parentOfferRef:
              type: string
              description: A reference to the Offer this offer is sold in conjunction with
              example: offer_1
            offerModifyRef:
              type: string
              description: >-
                Reference to the new Offer created as a result of this Offer
                being subject to a schedule change.
            Product:
              maxItems: 100
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ProductID'
            Price:
              $ref: '#/components/schemas/Price'
            TermsAndConditionsFull:
              maxItems: 100
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/TermsAndConditionsFullID'
            passiveOfferInd:
              type: boolean
              description: >-
                Indicates aggregator segment built into PNR. Always send with
                true when using in a request. If returned true in a response,
                the Offer is passive for booking purposes.
              example: true
            scheduleChangeInd:
              type: boolean
              description: If true, this Offer is subject to a schedule change.
    OfferID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            "Discriminator classes for Air Price are OfferID, Offer, and
            OfferUpsell. 

            Discriminator classes for Reservation and ReservationWorkbench are
            OfferID, Offer, OfferModify, and OfferUpsell. 

            Discriminator classes for Hotel Rules are OfferID and Offer."
          example: Offer
        id:
          type: string
          description: >-
            Offer identifier sent in the reference payload request to book that
            offer. Not returned in the full payload response; this is the only
            difference in the two responses.
          example: offer_1
        offerRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            message
          example: offer_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
        ContentSource:
          $ref: '#/components/schemas/ContentSourceEnum'
      discriminator:
        propertyName: '@type'
    TermsAndConditionsFullID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            'Discriminator classes for Air Price are TermsAndConditionsFullAir
            and TermsAndConditionsFullAncillary. 

            Discriminator class for Hotel Rules and Reservation is
            TermsAndConditionsFullHospitality. 

            Discriminator class for Vehicle Rules and Reservation is
            TermsAndConditionsFullVehicle. 

            Discriminator classes for Reservation and Reservation Workbench APIs
            are TermsAndConditionsFullAir, TermsAndConditionsFullAncillary,
            TermsAndConditionsFullHospitality, TermsAndConditionsFullVehicle,
            TermsAndConditionsFullVehicle, and
            TermsAndConditionsFullScheduleChange.'
          example: TermsAndConditionsFullAir
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: TC_1
        termsAndConditionsRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            message.
          example: TC_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    OfferQueryHospitalityRequestWrapper:
      properties:
        OfferQueryHospitalityRequest:
          $ref: '#/components/schemas/OfferQueryHospitalityRequest'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    OfferQueryHospitalityRequest:
      required:
        - '@type'
        - PropertyKey
        - checkinDate
        - checkoutDate
        - numberOfGuests
      properties:
        '@type':
          type: string
          description: Discriminator class OfferQueryHospitalityRequest only
          example: OfferQueryHospitalityRequest
        checkinDate:
          type: string
          description: Check-in date in YYYY-MM-DD format.
          format: date
        checkoutDate:
          type: string
          description: Check-out date in YYYY-MM-DD format.
          format: date
        numberOfGuests:
          type: integer
          description: >-
            Total number of travelers. Must be a numeric value between 1 and 9.
            Required; send with same value as the total across all counts in
            RoomStayCandidate/GuestCount/count
          format: int32
        bookingCode:
          maxLength: 32
          type: string
          description: >-
            For the offer you want to request rules on, send the value found for
            that offer in CatalogOffering/ProductOptions/Product/bookingCode
            from the Availability response.
        storedCurrency:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: >-
            For the offer you want to request rules on, send the value found for
            that offer in CatalogOffering/Price/CurrencyCode/value from the
            Availability response.
        storedAmount:
          type: number
          description: >-
            For the offer you want to request rules on, send the value found for
            that offer in CatalogOffering/Price/TotalPrice from the Availability
            response.
          format: float
        requestedCurrency:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: >-
            Send the currency code to return a conversion rate for. The response
            returns the currency conversion rate of the local currency to the
            requested currency. This can be used to calculate, independently of
            the API, conversion for the rates returned in the response. The
            response does not convert any amounts.
        ExtraAccommodation:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/ExtraAccommodation'
        RoomStayCandidates:
          $ref: '#/components/schemas/RoomStayCandidates'
        PropertyKey:
          $ref: '#/components/schemas/PropertyKey'
        HotelAggregator:
          $ref: '#/components/schemas/HotelAggregatorEnum'
        RateCandidate:
          $ref: '#/components/schemas/RateCandidate'
      description: >-
        Used for a Hotel Rules (Full Payload) request. Defines a request to
        retrieve the rules associated with a specific rate by sending the
        required rate details directly instead of referencing a preceding Hotel
        Availability response. This request is typically sent after Hotel
        Availability and before booking.
    HotelAggregatorEnum:
      type: string
      description: >-
        "Identifies the source of the rate.  Send the value for the abbreviation
        returned for the offer in the Availability response in
        CatalogOffering/Identifier/authority.  Access to Booking.com rates
        requires additional provisioning and a direct agreement with the
        supplier. Contact your Travelport Account Manager for details."
      enum:
        - Travelport
        - Agoda
        - Booking
        - Expedia
        - Bonotel
      x-enumDescriptions:
        Travelport: TVPT
        Agoda: not supported
        Booking: BKNG
        Expedia: not supported
        Bonotel: not supported
    ReservationResponseWrapper:
      properties:
        ReservationResponse:
          $ref: '#/components/schemas/ReservationResponse'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    ReservationResponse:
      description: >-
        The response of Create Reservation (Reference Payload), Create
        Reservation (Full Payload), Sync Reservation, Modify/Add Reservation,
        Create/Modify Passive Reservation, Retrieve Reservation, or Cancel
        Reservation endpoint requests.
      allOf:
        - properties:
            Reservation:
              $ref: '#/components/schemas/ReservationID'
        - $ref: '#/components/schemas/BaseResponse'
    ReservationID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes ReservationID, Reservation or
            ReservationDetail
          example: Reservation
        id:
          type: string
          description: Internal identifier for the response.
          example: REF12873
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    ReservationQueryBuildWrapper:
      properties:
        ReservationQueryBuild:
          $ref: '#/components/schemas/ReservationQueryBuild'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    ReservationQueryBuild:
      required:
        - '@type'
        - ReservationBuild
      properties:
        '@type':
          type: string
          description: Discriminator classes ReservationQueryBuild only
          example: ReservationQueryBuild
        ReservationBuild:
          $ref: '#/components/schemas/ReservationBuild'
      description: >-
        Used for a Create Hotel Reservation (Reference Payload) request. Defines
        a request to create a hotel reservation using selected hotel offer data
        together with traveler and payment details. This request typically
        follows Hotel Availability, Rules, or SearchComplete and is sent to
        finalize a booking. If the price or guarantee type changes from the
        preceding response, the request may need to be sent again with the
        applicable acceptance indicator.
    ReservationBuild:
      required:
        - '@type'
        - Traveler
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes ReservationBuildFromCatalogOffering,
            ReservationBuildFromCatalogOfferings,
            ReservationBuildfromCatalogOfferingsAir, 
            ReservationBuildFromCatalogProductOfferings,
            ReservationBuildFromProducts, ReservationBuildVehicle
          example: ReservationBuildFromProducts
        autoDeleteDate:
          type: string
          description: >-
            Creates a retention segment to keep the host PNR alive until this
            date.
          format: date
          example: '2011-01-24'
        receivedFrom:
          maxLength: 128
          type: string
          description: Allows the user to specify who the request was received from.
          example: TW
        issuance:
          $ref: '#/components/schemas/IssuanceEnum'
        Traveler:
          maxItems: 9
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/TravelerID'
        FormOfPayment:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/FormOfPaymentID'
        Payment:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/PaymentID'
        ReservationComment:
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/ReservationCommentID'
        PrimaryContact:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/PrimaryContactID'
        SpecialService:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/SpecialServiceID'
        Accounting:
          $ref: '#/components/schemas/AccountingID'
        DocumentOverrides:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/DocumentOverridesID'
        Notification:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        Preference:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/PreferenceID'
        ReceiptConfirmation:
          $ref: '#/components/schemas/ReceiptConfirmation'
        TravelAgency:
          $ref: '#/components/schemas/TravelAgency'
        scheduleChangeAcceptedInd:
          type: boolean
          description: If true, the schedule change has been accepted.
          example: true
        overrideMCTInd:
          type: boolean
          description: >-
            If true, the minimum connection time warning will be ignored and the
            Reservation created.
          example: true
        errorWhenScheduleChangesInd:
          type: boolean
          description: >-
            If true, an error will be returned when the flight schedule changes
            during commit processing
          example: true
        errorWhenOfferPriceChangesInd:
          type: boolean
          description: >-
            If true, an error will be returned when the flight price changes
            during commit processing.
          example: true
      description: >-
        Defines the reservation build details used to create a hotel reservation
        from a cached offer, including traveler, payment, and related booking
        details.
      discriminator:
        propertyName: '@type'
    IssuanceEnum:
      type: string
      description: Mid/BackOffice instructions.
      example: Ticket
      enum:
        - Ticket
        - BackOffice
        - All
        - Invoice
    TravelerID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes TravelerID or Traveler
          example: Traveler
        id:
          type: string
        TravelerRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    FormOfPaymentID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes FormOfPaymentID, FormOfPaymentBSP,
            FormOfPaymentCash, FormOfPaymentCheck, FormOfPaymentDocument,
            FormOfPaymentFlightPass, FormOfPaymentForfeit, FormOfPaymentInvoice,
            FormOfPaymentPaymentCard, FormOfPaymentVirtualPaymentAccount,
            FormOfPaymentWaiverCode
          example: FormOfPaymentPaymentCard
        id:
          type: string
          description: Form of Payment reference ID.
        FormOfPaymentRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: Parent class of Form of Payment.
      discriminator:
        propertyName: '@type'
    PaymentID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes PaymentID or Payment
          example: Payment
        id:
          type: string
          description: Customer-assigned identifier for the payment.
        PaymentRef:
          type: string
          description: Customer-assigned name for the payment.
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    ReservationCommentID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes ReservationCommentID or ReservationComment
          example: ReservationComment
        id:
          type: string
          description: Local identifier within a given message for this object.
      discriminator:
        propertyName: '@type'
    PrimaryContactID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes PrimaryContactID or PrimaryContact
          example: PrimaryContact
        id:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    SpecialServiceID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes SpecialServiceID, SpecialServiceBassinet,
            SpecialServiceBlind, SpecialServiceDeaf, SpecialServiceDPNA,
            SpecialServiceMeal, SpecialServiceUnaccompaniedMinor,
            SpecialServiceWheelchairAirlineSupplied,
            SpecialServiceWheelchairTravelerSupplied
          example: SpecialService
        id:
          type: string
          description: Internal Id
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    AccountingID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes AccountingID or Accounting
          example: Accounting
        id:
          type: string
        AccountingRef:
          type: string
          description: Accounting reference
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    DocumentOverridesID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes DocumentOverridesID or DocumentOverrides
          example: DocumentOverrides
        id:
          type: string
          description: The reporting number.
          example: documentoverrides_001
        DocumentOverridesRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    Notification:
      properties:
        QueueNumber:
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/QueueNumber'
        Date:
          type: string
          description: >-
            The notification date is equivalent to ticket time limit and will
            place the Reservation on the defined queue for the date specified.
            Sending a new notification date at commit step will update the
            existing notificationDate. Sending 000/00/00 will delete an existing
            notificationDate.
          format: date
        Comment:
          maxLength: 69
          type: string
          description: Optional ticket time limit text string.
          example: Optional free text
    QueueNumber:
      properties:
        value:
          type: integer
          format: int32
          example: 10
        category:
          maxLength: 3
          pattern: ([0-9a-zA-Z]+)?
          type: string
          description: The Queue Category
          example: CAE
        subCategory:
          maxLength: 32
          type: string
          description: Date range subCategory
          example: Date Range sub-category
        overridePCC:
          maxLength: 10
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,10})
          type: string
          description: Use PCC to override to queue the Reservation to another PCC
          example: 0XS4
      description: The queue number
    PreferenceID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes PreferenceID, Preference, PreferenceAirSeat or
            PreferenceRailSeat
          example: Preference
        id:
          type: string
      discriminator:
        propertyName: '@type'
    ReceiptConfirmation:
      allOf:
        - $ref: '#/components/schemas/Receipt'
        - properties:
            Confirmation:
              $ref: '#/components/schemas/Confirmation'
            SegmentSequenceList:
              type: array
              description: The segmentSequenceList the ReceiptConfirmation applies to
              items:
                type: integer
                format: int32
    Receipt:
      description: >-
        Specifies the payment or guarantee information for a reservation. If
        zero dollars and in the amount then the payment information acts as a
        guarantee.
      allOf:
        - $ref: '#/components/schemas/ReceiptID'
        - properties:
            dateTime:
              type: string
              description: Receipt date time
              format: date-time
              example: '2022-08-07 12:12:00+00:00'
            OfferRef:
              type: array
              description: >-
                List of offer reference ids for the offer(s) returned in the
                Reservation response.
              items:
                type: string
            ProductRef:
              type: string
              description: Reference of product
    ReceiptID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes ReceiptID, ReceiptConfirmation,
            ReceiptConfirmationDivide, ReceiptCancellation, ReceiptPayment
          example: ReceiptConfirmation
        id:
          type: string
          description: The verification number.
          example: '3493289238'
        ReceiptRef:
          type: string
          example: 6773 2389 2239 2832
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    Confirmation:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes ConfirmationHold or ConfirmationVehicle
          example: ConfirmationHold
      description: Confirmation details, such as those found in a Receipt.
      discriminator:
        propertyName: '@type'
    TravelAgency:
      description: An optional object to define travel agency information.
      allOf:
        - $ref: '#/components/schemas/TravelAgencyID'
        - required:
            - OrganizationName
          properties:
            organizationType:
              $ref: '#/components/schemas/OrganizationTypeEnum'
            OrganizationName:
              $ref: '#/components/schemas/CompanyName'
            CorporateCode:
              maxLength: 32
              type: string
              description: >-
                A reference assigned by the Travel Agency to identify the
                corporate organization
              example: Air Agency
            ProfileName:
              maxItems: 200
              type: array
              items:
                maxLength: 64
                type: string
    TravelAgencyID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes TravelAgency, TravelAgencyID, or
            TravelAgencyDetail
          example: TravelAgencyDetail
        id:
          type: string
          description: Simple xsd id, not for external use
          example: '2'
        TravelOrganizationRef:
          type: string
          description: >-
            An organization that has a name and a structure and members and
            directly works in the travel industry
          example: TravelAgency_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    OrganizationTypeEnum:
      type: string
      description: >-
        The type of organization such as an Agency, Branch, Company, Supplier,
        Provider
      enum:
        - TravelAgency
        - AgencyBranch
        - LoyaltyProgram
        - IdDocumentIssuer
        - TravelSupplier
        - TravelProvider
        - Regulatory
    CompanyName:
      properties:
        value:
          maxLength: 128
          type: string
        id:
          type: string
          description: Use this id to internally identify this company in NextSteps
          example: '2'
        division:
          maxLength: 32
          type: string
          description: The division name or ID with which the contact is associated
          example: Travel Division
        department:
          maxLength: 32
          type: string
          description: The department name or ID with which the contact is associated
          example: Adventure department
        shortName:
          maxLength: 32
          type: string
          description: Used to provide the company common name
          example: Adventure Inc
        code:
          maxLength: 32
          type: string
          description: Identifies a company by the company code
          example: AI
        codeContext:
          maxLength: 32
          type: string
          description: >-
            Identifies the context of the identifying code, such as DUNS, IATA,
            or internal code
          example: ISO
        systemOfRecord:
          type: array
          description: The system(s) that maintain the data
          items:
            maxLength: 5
            minLength: 2
            pattern: ([a-zA-Z0-9]{2,5})
            type: string
            example: MB
      description: Identifies a company by name
    ReservationDetailMultipleWrapper:
      properties:
        ReservationDetailMultiple:
          $ref: '#/components/schemas/ReservationDetailMultiple'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    ReservationDetailMultiple:
      properties:
        ReservationDetails:
          type: array
          items:
            $ref: '#/components/schemas/ReservationDetail'
      description: >-
        Used for a Create Hotel Reservation (Multiple, Full Payload) request.
        Defines a request to create multiple individual hotel reservations in a
        single payload using full reservation details. This request typically
        follows Hotel Availability, Rules, or SearchComplete and is sent to
        finalize a booking.
    ReservationDetail:
      description: >-
        Used for Hotel Reservation (Full Payload), Sync Reservation, and Passive
        Reservation requests. Defines the reservation details sent to create,
        add, modify, synchronize, or passively store a hotel booking segment. 
        In standard booking workflows, this request is typically sent after
        Hotel Availability, Rules, or SearchComplete.  In passive or sync
        workflows, it is used to store or synchronize hotel reservation
        information without performing a standard hotel sell. Additionally used
        for the response of Create Reservation (Reference Payload), Create
        Reservation (Full Payload), or Sync endpoint calls.
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - properties:
            Accounting:
              $ref: '#/components/schemas/Accounting'
            DocumentOverrides:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/DocumentOverrides'
            CustomRule:
              $ref: '#/components/schemas/CustomRule'
    Reservation:
      allOf:
        - $ref: '#/components/schemas/ReservationID'
        - properties:
            Offer:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/Offer'
            Traveler:
              maxItems: 300
              type: array
              items:
                $ref: '#/components/schemas/Traveler'
            TravelerProduct:
              maxItems: 3000
              type: array
              items:
                $ref: '#/components/schemas/TravelerProduct'
            FormOfPayment:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/FormOfPaymentID'
            Payment:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/Payment'
            Receipt:
              maxItems: 1000
              type: array
              items:
                $ref: '#/components/schemas/Receipt'
            OfferLink:
              type: array
              items:
                $ref: '#/components/schemas/OfferLink'
            ReservationComment:
              maxItems: 1000
              type: array
              items:
                $ref: '#/components/schemas/ReservationComment'
            PrimaryContact:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/PrimaryContact'
            TravelAgency:
              $ref: '#/components/schemas/TravelAgency'
            GroupName:
              maxLength: 64
              type: string
              description: Group name will be passed in the new Group object
              deprecated: true
            SpecialService:
              type: array
              items:
                $ref: '#/components/schemas/SpecialService'
            Preference:
              $ref: '#/components/schemas/Preference'
            OrganizationLoyaltyProgram:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/OrganizationLoyaltyProgram'
            ShoppingCart:
              deprecated: true
              allOf:
                - $ref: '#/components/schemas/ShoppingCart'
            ReservationDisplaySequence:
              $ref: '#/components/schemas/ReservationDisplaySequence'
            AgencyServiceFee:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/AgencyServiceFee'
            autoDeleteDate:
              type: string
              description: >-
                The auto delete date represents the date that the Reservation
                will be kept active. Also known as retention segment or
                retention date.
              format: date
            notificationDate:
              type: string
              description: >-
                The notification date represents the date that the Reservation
                should be reviewed. Also known as ticket time limit date.
              format: date
            CustomAuxiliarySegment:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/CustomAuxiliarySegmentID'
            Group:
              $ref: '#/components/schemas/Group'
            UnpricedSegments:
              $ref: '#/components/schemas/UnpricedSegments'
    Traveler:
      description: >-
        Information regarding a traveler, including name, contact information,
        and loyalty details.
      allOf:
        - $ref: '#/components/schemas/TravelerID'
        - required:
            - PersonName
          properties:
            birthDate:
              type: string
              description: Date of Birth YYYY-MM-DD
              format: date
              example: '2021-06-05'
            gender:
              $ref: '#/components/schemas/GenderEnum'
            PersonName:
              $ref: '#/components/schemas/PersonName'
            Address:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/Address'
            Telephone:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/Telephone'
            Email:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/Email'
            passengerTypeCode:
              maxLength: 5
              minLength: 3
              pattern: ([a-zA-Z0-9]{3,5})
              type: string
              description: Passenger type code
              example: CHD
            nationality:
              pattern: '[a-zA-Z]{2}'
              type: string
              description: Nationality on country code ISO
              example: AL
            age:
              type: integer
              description: The age of the traveller at the time of travel
              format: int32
              example: 13
            CustomerLoyalty:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/CustomerLoyalty'
            AlternateContact:
              maxItems: 20
              type: array
              items:
                $ref: '#/components/schemas/AlternateContact'
            TravelDocument:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/TravelDocument'
            Comments:
              $ref: '#/components/schemas/Comments'
            RailDiscountCard:
              maxItems: 50
              type: array
              items:
                $ref: '#/components/schemas/RailDiscountCard'
            accompaniedByInfantInd:
              type: boolean
              example: true
    GenderEnum:
      type: string
      description: >-
        Gender Type Male, Female etc. This field is not used by Hotel APIs and
        will be ignored.
      example: Female
      enum:
        - Male
        - Female
        - Unknown
        - Undisclosed
    PersonName:
      required:
        - '@type'
        - Surname
      properties:
        '@type':
          type: string
          description: Discriminator classes PersonName or PersonNameDetail
          example: PersonNameDetail
        Prefix:
          maxLength: 10
          type: string
          description: Salutation of honorific (e.g. Mr., Mrs., Ms., Miss, Dr.)
          example: Mr
        Given:
          maxLength: 30
          type: string
          description: Given name, first name or names.
          example: John
        Middle:
          maxLength: 30
          type: string
          description: The middle name of the person name.
          example: Erick
        Surname:
          maxLength: 30
          minLength: 1
          type: string
          description: Family name, last name.
          example: Smith
      description: >-
        Travelport+ limits the combination of Given and Surname to 22
        characters. Given name must have at least one character. Any PersonName
        exceeding 22 characters is truncated in the response.
      discriminator:
        propertyName: '@type'
    Telephone:
      required:
        - '@type'
        - phoneNumber
      properties:
        '@type':
          type: string
          description: Discriminator classes Telephone or TelephoneDetail
          example: Telephone
        countryAccessCode:
          pattern: '[0-9]{1,3}'
          type: string
          description: Phone country code
          example: '1'
        areaCityCode:
          pattern: '[0-9]{1,8}'
          type: string
          description: Phone local area code
          example: '972'
        phoneNumber:
          maxLength: 32
          type: string
          description: >-
            Mobile/Telephone Number. Accepted characters are numeric, dash,
            space, and period.
          example: 972-000-787
        extension:
          pattern: '[0-9]{0,5}'
          type: string
          description: Telephone extension number
          example: '234'
        id:
          type: string
          description: Optional internally referenced id
          example: '3'
        cityCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: IATA city code if referenced by phone number.
          example: DEN
        role:
          $ref: '#/components/schemas/Enum_TelephoneRole'
      discriminator:
        propertyName: '@type'
    Enum_TelephoneRole:
      type: string
      description: >-
        Defines the type of location the Telephone is assigned to. For Travel
        Agency telephone select "Other" or leave blank.
      example: Mobile
      enum:
        - Mobile
        - Home
        - Work
        - Office
        - Fax
        - Other
    AlternateContact:
      required:
        - PersonName
      properties:
        '@type':
          type: string
          example: AlternateContact
        id:
          type: string
        contactType:
          maxLength: 128
          type: string
          description: Contact type value
          example: Relative
        relation:
          maxLength: 128
          type: string
          description: Relation value
          example: Mother
        PersonName:
          $ref: '#/components/schemas/PersonName'
        Address:
          maxItems: 3
          type: array
          items:
            $ref: '#/components/schemas/Address'
        Telephone:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/Telephone'
        Email:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/Email'
        emergencyInd:
          type: boolean
          description: This is the contact in case of an emergency
          example: true
        defaultInd:
          type: boolean
          description: This is the default contact
          example: true
    TravelDocument:
      required:
        - '@type'
        - Gender
        - PersonName
      properties:
        '@type':
          type: string
          description: Discriminator classes TravelDocument or TravelDocumentDetail
          example: TravelDocumentDetail
        docNumber:
          maxLength: 128
          type: string
          description: Document number value
          example: B37201
        docType:
          $ref: '#/components/schemas/DocTypeCodeEnum'
        issueDate:
          type: string
          description: Date of Issue
          format: date
          example: '2002-10-13'
        expireDate:
          type: string
          description: Date of expiration
          format: date
          example: '2002-11-13'
        stateProvCode:
          maxLength: 8
          minLength: 2
          type: string
          description: State Province Code value
          example: '44'
        placeOfIssue:
          maxLength: 32
          type: string
          description: Place of issue value
          example: Birmingham
        issueCountry:
          pattern: '[a-zA-Z]{2}'
          type: string
          description: Issue country on Country Code ISO
          example: CA
        birthDate:
          type: string
          description: The date of birth of the document holder
          format: date
          example: '1995-04-22'
        birthCountry:
          pattern: '[a-zA-Z]{2}'
          type: string
          description: Birth country on Country Code ISO value
          example: AR
        birthPlace:
          maxLength: 128
          type: string
          description: Birth place value
          example: Ontario
        residence:
          maxLength: 512
          type: string
          description: Residence value
          example: 1st section 8th st
        id:
          type: string
          description: Locally referenced id
          example: '34'
        Gender:
          $ref: '#/components/schemas/GenderEnum'
        Nationality:
          pattern: '[a-zA-Z]{2}'
          type: string
          description: Specifies a 2 character country code as defined in ISO3166.
          example: BR
        PersonName:
          $ref: '#/components/schemas/PersonName'
      discriminator:
        propertyName: '@type'
    DocTypeCodeEnum:
      type: string
      description: Codes from OTA DOC - Document Type
      example: Passport
      enum:
        - Visa
        - Passport
        - MilitaryIdentification
        - DriversLicense
        - NationalIdentityDocument
        - VaccinationCertificate
        - AlienRegistrationNumber
        - InsurancePolicyNumber
        - TaxExemptionNumber
        - VehicleRegistrationLicenseNumber
        - BoderCrossingCard
        - RefugeeTravelDocument
        - PilotsLicense
        - PermanentResidentCard
        - RedressNumber
        - KnownTravelerNumber
        - Non-Standard
        - MerchantNumber
        - AirNexusCard
        - CrewMemberCertificate
        - PassportCard
        - NaturalizationCertificate
        - TicketNumber
        - LargeFamilyDiscountCard
        - IdentityCardTypeA
        - IdentityCardTypeC
        - IdentityCardTypeI
    Comments:
      properties:
        '@type':
          type: string
          example: Comments
        Comment:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      description: Comments object to relay text information
    Comment:
      properties:
        value:
          maxLength: 4096
          type: string
          description: >-
            Actual text. May be restricted by character limits based on the type
            of comment (e.g. Notepad remarks limited to 87 characters).
          example: Additional comments
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: comment_1
        name:
          maxLength: 128
          type: string
          description: Title of comment or type of remark.
          example: Comment name
        language:
          type: string
          description: Language code using ISO-639 standard
          example: EN
      description: Textual information.
    RailDiscountCard:
      required:
        - supplierCode
      properties:
        value:
          maxLength: 128
          type: string
          example: Rail1234546
        supplierCode:
          maxLength: 5
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,5})
          type: string
          description: Code of the Supplier
          example: Enco
        referenceNumber:
          maxLength: 128
          type: string
          description: ReferenceNumber
          example: '134256'
      description: Rail discount card information
    TravelerProduct:
      description: >-
        The relationship mapping a traveler to a specific product. Used for SSR,
        OSI and other specific offerings (such as a hotel segment). Each offer
        has a linked traveler.
      allOf:
        - $ref: '#/components/schemas/TravelerProductID'
        - properties:
            TravelerRef:
              type: string
              description: Traveler reference number associated with offer in OfferRef.
            OfferRef:
              type: string
              description: Offer reference number associated with traveler in TravelerRef.
            ProductRef:
              type: string
              description: A pointer to the product id
            ConfirmationStatusEnum:
              $ref: '#/components/schemas/ConfirmationStatusEnum'
            UnpricedFlightSegmentRefs:
              type: array
              description: >-
                References the flight segment/s within UnpricedSegments that are
                associated to this Traveler.
              example:
                - unpricedFlightSegment_001
                - unpricedFlightSegment_002
              items:
                type: string
    TravelerProductID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes TravelerProductID or TravelerProduct
          example: TravelerProduct
        id:
          type: string
      discriminator:
        propertyName: '@type'
    ConfirmationStatusEnum:
      type: string
      description: Status returned in a response for a two or more phase commitment process
      example: Confirmed
      enum:
        - Pending
        - Confirmed
        - Cancelled
        - Rejected
        - Requested
    Payment:
      description: >-
        A monetary payment for one or more product offers.

        For Hotels, the amount to be charged for the Hotel Reservation as
        follows: For Prepay Required rates, the full total amount is used. This
        amount will be charged to the credit card on this transaction.
        Indicators should be set as: depositInd = true; guaranteeInd = false.
        For Deposit Required rates, the deposit amount is used. This amount will
        be charged to the credit card on this transaction. Indicators should be
        set as: depositInd = true; guaranteeInd = false. For Guarantee Required
        rates, the full total amount is used. This amount is expected to be
        charged to the credit card at check in. Indicators should be set as:
        depositInd = false; guaranteeInd = true.
      allOf:
        - $ref: '#/components/schemas/PaymentID'
        - required:
            - Amount
          properties:
            Amount:
              $ref: '#/components/schemas/CurrencyAmount'
            FormOfPaymentIdentifier:
              $ref: '#/components/schemas/FormOfPaymentIdentifier'
            OfferIdentifier:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/OfferIdentifier'
            Fees:
              $ref: '#/components/schemas/Fees'
            Taxes:
              $ref: '#/components/schemas/Taxes'
            TravelerIdentifierRef:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/TravelerIdentifierRef'
            BaseAmount:
              $ref: '#/components/schemas/CurrencyAmount'
            depositInd:
              type: boolean
              description: >-
                If true, the payment is a deposit on the referenced Offer; at
                booking the provided card is charged for deposit or prepay rate.
            ExtendedPayment:
              description: >-
                Note this field is deprecated in Payment schema and should be
                passed in FormOfPaymentPaymentCardExtendPayment schema
              deprecated: true
              allOf:
                - $ref: '#/components/schemas/ExtendedPayment'
            AgencyServiceFeeIdentifier:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/AgencyServiceFeeIdentifier'
            guaranteeInd:
              type: boolean
              description: >-
                If true, the payment is a guarantee for the referenced Offer; no
                amounts are charged at booking; the customer is to make payment
                in person upon arrival.
    FormOfPaymentIdentifier:
      properties:
        '@type':
          type: string
          example: FormOfPaymentPaymentCash
        id:
          type: string
          description: Form of payment identifier reference ID.
        FormOfPaymentRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: The Travelport-assigned identifier for the FOP used for purchase.
    OfferIdentifier:
      properties:
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: offer_1
        offerRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            message
          example: offer_1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: Travelport-generated offer identifier number.
    TravelerIdentifierRef:
      properties:
        name:
          maxLength: 512
          type: string
          description: Traveler identifier
        passengerTypeCode:
          maxLength: 5
          minLength: 3
          pattern: ([a-zA-Z0-9]{3,5})
          type: string
          description: Passenger Type code
          example: ADT
        ages:
          type: array
          description: >-
            The ages of the travelers associated to a particular ptc. For NDC,
            this value will be returned in PriceBreakdownAir if sent as part of
            the PassengerCriteria in the Air Search request.
          items:
            type: integer
            format: int32
            example: 15
        age:
          type: integer
          description: Replaced with ages array. The age of the traveler.
          format: int32
          example: 11
          deprecated: true
        passengerCriteriaRef:
          maxLength: 32
          type: string
          description: Allows the user to associate passenger criteria information.
          example: passengerCriteria_1
      description: >-
        Identifier references as object both within a message payload or an
        object held in cache that may be used for subsequent workflows
      allOf:
        - $ref: '#/components/schemas/IdentifierRef'
    IdentifierRef:
      properties:
        value:
          maxLength: 128
          type: string
        id:
          type: string
          description: A locally referenced ID
        description:
          type: string
          description: Descriptive text used to identify the contents of a target object
        uris:
          type: array
          description: Uniform Resource Identifier
          items:
            type: string
            example: google.com
      description: >-
        Identifier references as object both within a message payload or an
        object held in cache that may be used for subsequent workflows
    ExtendedPayment:
      required:
        - NumberOfInstallments
      properties:
        NumberOfInstallments:
          type: integer
          description: >-
            The number of installment payments to be charged by the payment card
            provider
          format: int32
          example: 6
        FirstInstallment:
          type: number
          description: >-
            For Pagos Parceledos, specify the first installment amount. This
            will be the same currency as the payment
          format: float
          example: 100
        RemainingAmount:
          type: number
          description: >-
            For Pagos Parceledos, specify the remaining amount to be charged
            that will be spread across the number of installments. This will be
            the same currency as the payment
          format: float
          example: 50
        OTATOCode:
          maxLength: 32
          type: string
          description: For Pagos Parceledos the OTATOCode
      description: >-
        Note this field is deprecated in Payment schema and should be passed in
        FormOfPaymentPaymentCardExtendPayment schema
    AgencyServiceFeeIdentifier:
      properties:
        id:
          type: string
          description: Unique id for this object within a message
      description: Agency Service Fee Identifier object.
    OfferLink:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          example: OfferLink
        OfferRef:
          type: string
        ParentOffer:
          $ref: '#/components/schemas/ParentOffer'
    ParentOffer:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator class ParentOffer only
          example: ParentOffer
        OfferRef:
          type: string
        ProductRef:
          type: string
    ReservationComment:
      description: >-
        An optional object used to define certain remarks. 

        Create Reservation supports Notepad remarks (general, historical, and
        confidential), Unassociated remarks, Special Instruction remarks, and
        Accounting remarks.
      allOf:
        - $ref: '#/components/schemas/ReservationCommentID'
        - properties:
            commentSource:
              $ref: '#/components/schemas/CommentSourceEnum'
            shareWith:
              $ref: '#/components/schemas/ShareWithEnum'
            shareWithSupplier:
              type: array
              description: Reservation comment shared with supplier
              items:
                maxLength: 32
                type: string
            Comment:
              maxItems: 1000
              type: array
              description: >-
                Defines the type of remark (name) and the remark itself (value).

                Send the following in 'name' for each type of remark: Notepad
                remarks: Two-character code. Use asterisk for any placeholder.
                (HS, CR, R*, **) Unassociated remarks: ITIN COMMENTS Special
                instruction remarks: SI

                For remark text 'value', please note character limits for each
                type of remark: Notepad remarks: 87 Unassociated remarks: 70
                Special instruction remarks: 50
              items:
                $ref: '#/components/schemas/Comment'
            AppliesTo:
              maxItems: 1000
              type: array
              items:
                $ref: '#/components/schemas/AppliesTo'
    CommentSourceEnum:
      type: string
      description: Originator of a comment.
      example: Agency
      enum:
        - Agency
        - Supplier
        - Traveler
      x-enumDescriptions:
        Agency: >-
          For Hotel Create Reservation (Full Payload)
          ReservationComment/commentSource 'Agency' is the only supported value.
    ShareWithEnum:
      type: string
      description: Designates the visibility of a remark.
      example: Supplier
      enum:
        - Supplier
        - Agency
        - Traveler
      x-enumDescriptions:
        Supplier: >-
          For Hotel Create Reservation (Full Payload)
          ReservationComment/shareWith 'Supplier' is used for Special
          instructions.
        Agency: >-
          For Hotel Create Reservation (Full Payload)
          ReservationComment/shareWith 'Agency' is used for Notepad remarks.
        Traveler: >-
          For Hotel Create Reservation (Full Payload)
          ReservationComment/shareWith 'Traveler' is used for Unassociated
          remarks.
    AppliesTo:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes AppliesToOffer, AppliesToOfferProduct,and
            AppliesToOfferProductSegment
          example: AppliesToOffer
      description: >-
        In a request, used to apply a feature to a specific Offer, Product, or
        Segment. In a response, returned for Special Instruction and Associated
        Remarks.
      discriminator:
        propertyName: '@type'
    PrimaryContact:
      description: Primary contact details.
      allOf:
        - $ref: '#/components/schemas/PrimaryContactID'
        - properties:
            shareWith:
              $ref: '#/components/schemas/ShareWithEnum'
            shareWithSupplier:
              type: array
              description: Primary contact shared with supplier
              items:
                maxLength: 32
                type: string
            Email:
              $ref: '#/components/schemas/Email'
            Telephone:
              $ref: '#/components/schemas/Telephone'
            TravelerIdentifier:
              $ref: '#/components/schemas/TravelerIdentifier'
            contactInformationRefusedInd:
              type: boolean
              description: >-
                If true, the passenger has refused to provide emergency contact
                details
              example: true
    TravelerIdentifier:
      properties:
        '@type':
          type: string
          example: TravelerIdentifier
        id:
          type: string
        TravelerRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: Traveler Identifier object.
    SpecialService:
      description: Traveler Special Assistance
      example: SpecialServiceMeal
      allOf:
        - $ref: '#/components/schemas/SpecialServiceID'
        - properties:
            AppliesTo:
              $ref: '#/components/schemas/AppliesTo'
            Status:
              $ref: '#/components/schemas/Status'
            ServiceAnimalType:
              maxLength: 32
              type: string
              description: >-
                The type of service animal accompanying the Traveler. If no
                service animal leave blank.
              example: Horse
            TravelerIdentifier:
              $ref: '#/components/schemas/TravelerIdentifier'
            Quantity:
              type: integer
              format: int32
              example: 1
            FreeText:
              type: string
              example: NO SEAFOOD
            SSRCode:
              maxLength: 4096
              pattern: ([A-Z]+)?
              type: string
              example: SPML
            Carrier:
              pattern: ([a-zA-Z0-9]{2,3})
              type: string
              description: >-
                For unassociated SSRs use carrier to instruct which airline to
                send the service information to
              example: BA
    Status:
      properties:
        value:
          $ref: '#/components/schemas/ConfirmationStatusEnum'
        supplierText:
          maxLength: 128
          type: string
          description: Supplier status text
          example: Active/In-active
        code:
          maxLength: 32
          type: string
          description: Special service status code
          example: NN
    Preference:
      allOf:
        - $ref: '#/components/schemas/PreferenceID'
        - properties:
            AppliesTo:
              $ref: '#/components/schemas/AppliesTo'
            TravelerIdentifier:
              $ref: '#/components/schemas/TravelerIdentifier'
    OrganizationLoyaltyProgram:
      allOf:
        - $ref: '#/components/schemas/OrganizationLoyaltyProgramID'
        - required:
            - LoyaltyIdentifier
            - Supplier
          properties:
            Supplier:
              maxLength: 32
              type: string
              description: The supplier of the loyalty program
              example: Air Canada
            LoyaltyIdentifier:
              maxLength: 1000
              minLength: 1
              type: string
              description: Loyalty Identifier
              example: LP029381
    OrganizationLoyaltyProgramID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes OrganizationLoyaltyProgramID or
            OrganizationLoyaltyProgram
          example: OrganizationLoyaltyProgramID
        id:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    ShoppingCart:
      properties:
        '@type':
          type: string
          example: ShoppingCart
        Product:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/ProductAir'
    ProductAir:
      description: Detailed information of the Air product
      allOf:
        - $ref: '#/components/schemas/Product'
        - required:
            - FlightSegment
            - PassengerFlight
          properties:
            totalDuration:
              type: string
              description: >-
                Total duration of the combined segments in hours (H) and minutes
                (M). ISO 8601 format.
              example: PT2H40M
            FlightSegment:
              maxItems: 99
              minItems: 1
              type: array
              description: One instance for each flight segment in the product.
              items:
                $ref: '#/components/schemas/FlightSegment'
            PassengerFlight:
              maxItems: 10
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/PassengerFlight'
    Product:
      description: Summary Product information inherited by all Product child classes.
      allOf:
        - $ref: '#/components/schemas/ProductID'
        - properties:
            Quantity:
              type: integer
              description: >-
                "The quantity of the product. 

                For Hotel Create Reservation (Full Payload) request, the number
                of rooms requested; 1-9 inclusive supported. If not provided,
                default is 1. For Hotel responses, the number of rooms currently
                available matching this rate.

                In Air Search quantity represents the number of seats available
                for that Product. If the Product has connecting flights,
                Quantity returns the lowest number available. For example, if
                the first flight has 9 seats in Y class and the connecting
                flight has 4 seats in Y class, Quantity returns a value of 4."
              format: int32
              example: 2
    FlightSegment:
      required:
        - Flight
        - sequence
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: FlightSegment
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: flightSegment_01
        sequence:
          type: integer
          description: >-
            Order of the flight segment. e.g. 1 for the first segment on the
            leg.
          format: int32
          example: 1
        connectionDuration:
          type: string
          description: >-
            When a flight connection exists, this is the lapsed time between the
            connecting flights (in minutes). ISO 8601 format.
          example: PT1H3M
        amenityRefs:
          type: array
          description: >-
            If RouteHappy flight amenities were requested
            (includeFlightAmenitiesInd=true), amenityRefs is returned.
            Cross-reference the amenityRef with the Amenity 'id' in
            ReferenceListAmenity.Amenity for detailed information.
          items:
            type: string
            example: '["amenity_1","amenity_2"]'
        universalProductAttributeRefs:
          type: array
          description: >-
            If universal product attributes (UPAs) for RouteHappy data were
            requested (includeUniversalProductAttributesInd=true) along with
            RouteHappy flight amenities, universalProductAttributeRefs is
            returned. Cross-reference the universalProductAttributeRef with the
            universalProductAttribute 'id' in
            ReferenceListUniversalProductAttribute.UniversalProductAttribute.
            UPAs provide images, icons, and URLs as provided by ATPCO.
            RouteHappy data must have also been requested per amenityRefs above.
          items:
            type: string
            example: '["upa_1","upa_2"]'
        Flight:
          $ref: '#/components/schemas/FlightID'
        IntermediateStopAmenities:
          maxItems: 9
          type: array
          items:
            $ref: '#/components/schemas/IntermediateStopAmenities'
        OperationalStatus:
          $ref: '#/components/schemas/OperationalStatusENUM'
        boundFlightsInd:
          type: boolean
          description: >-
            Indicates flight segments are married/bound. When 'true', indicates
            the flight segments in a single or double connection must be sold
            together. When true, the indicator is returned for all leading
            segments on one leg of the flight, and not returned for the last
            segment of the bound flight leg journey, indicating where the bound
            flights end. For example, if an O&D pair has 3 flight segments,
            boundFlightsInd is returned for the first two segments on that leg.
            If the segments are not bound, boundFlightsInd is false and not
            returned. GDS only; not supported for NDC.
          example: true
        CO2Actual:
          description: >-
            Returned if requested 'includCo2EmissionsDataInd'. Actual carbon
            emissions for this specific flight. CO2 emissions are measured as a
            weight in kilograms.
          allOf:
            - $ref: '#/components/schemas/Measurement'
      description: >-
        Groups the flight into sequence and contains connecting flight
        information
    FlightID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator. Child classes Flight and FlightDetail.
          example: FlightDetail
        id:
          type: string
          description: Local id within a given message to support referencing this object.
          example: '126'
        FlightRef:
          type: string
          description: >-
            Reference id that corresponds to the flight 'id' in
            ReferenceListFlight.Flight.
          example: s1
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: Flight common schema. Used across Air workflow.
      discriminator:
        propertyName: '@type'
    IntermediateStopAmenities:
      required:
        - '@type'
        - arrivalLocation
        - departureLocation
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: IntermediateStopAmenities
        departureLocation:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: The departure location.
          example: NYC
        arrivalLocation:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: The arrival location.
          example: DEN
        amenityRefs:
          type: array
          description: List of amenity references for this portion of the flight.
          items:
            type: string
            example: amenity_1
        universalProductAttributeRefs:
          type: array
          description: List of UPA references for this portion of the flight.
          items:
            type: string
            example: upa_1
      description: Amenities available on this flight with intermediate stops.
    OperationalStatusENUM:
      properties:
        value:
          $ref: '#/components/schemas/OperationalStatusENUM_Base'
      description: The operational status of the flight
    OperationalStatusENUM_Base:
      type: string
      description: List of operational flight status
      example: FlightBoarding
      enum:
        - FlightBoarding
        - FlightCancelled
        - FlightDeparted
        - FlightPastScheduledDeparture
        - NotAvailableUseSearch
    Measurement:
      properties:
        value:
          type: number
          format: float
          example: 2.22
        measurementType:
          $ref: '#/components/schemas/MeasurementTypeEnum'
        unit:
          $ref: '#/components/schemas/UnitOfMeasureEnum'
      description: Used for dimensional units (width, height, depth) or weight
    MeasurementTypeEnum:
      type: string
      description: The type of measurement such as width, height, weight
      enum:
        - Width
        - Height
        - Depth
        - Weight
        - OverallDimension
    UnitOfMeasureEnum:
      type: string
      description: >-
        The unit of measure in a code format. Refer to OpenTravel Code List Unit
        of Measure Code (UOM).
      example: Kilograms
      enum:
        - Miles
        - Kilometers
        - Meters
        - Millimeters
        - Centimeters
        - Yards
        - Feet
        - Inches
        - Pixels
        - Block
        - Megabytes
        - Gigabytes
        - Square feet
        - Square meters
        - Pounds
        - Kilograms
        - Square inch
        - Square yard
        - Acre
        - Square millimeter
        - Square centimeter
        - Hectare
        - Ounce
        - Gram
        - Gallons
        - Liters
        - Kilowatts
        - Cubic meters
    PassengerFlight:
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: PassengerFlight
        passengerQuantity:
          type: integer
          description: Number of passengers of the specified passenger type code.
          format: int32
          example: 26
        passengerTypeCode:
          maxLength: 5
          minLength: 3
          pattern: ([a-zA-Z0-9]{3,5})
          type: string
          description: >-
            Passenger type code applicable to the offer/offering. This may be
            different to the requested passenger type code sent in
            PassengerCriteria.
          example: ADT
        FlightProduct:
          maxItems: 99
          type: array
          items:
            $ref: '#/components/schemas/FlightProduct'
      description: >-
        Returns PTC and class/fare information for each PTC requested. One
        instance of Passenger Flight is returned for each PTC requested.
    FlightProduct:
      required:
        - segmentSequence
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: FlightProduct
        segmentSequence:
          type: array
          description: >-
            The Segment sequence which correlates with the sequence in
            FlightSegment.
          example:
            - 1
          items:
            type: integer
            format: int32
        classOfService:
          maxLength: 2
          minLength: 1
          pattern: ([a-zA-Z0-9]{1,2})
          type: string
          description: The class of service code.
          example: F
        cabin:
          $ref: '#/components/schemas/CabinAirEnum'
        fareBasisCode:
          maxLength: 32
          type: string
          description: >-
            Fare basis code for the flight. For NDC, also returns the ticket
            designator after a slash (/) following the fare basis code. GDS
            ticket designators are returned in ticketDesignator per below.
          example: YEE1Y
        fareType:
          $ref: '#/components/schemas/FareTypeEnum'
        carCode:
          maxLength: 32
          type: string
          description: The car code or deal code. Net remit.
          example: P1234
        valueCode:
          maxLength: 32
          type: string
          description: The value code. Net remit.
          example: '365'
        Brand:
          $ref: '#/components/schemas/BrandID'
        CustomerLoyaltyCredit:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/CustomerLoyaltyCredit'
        ClassOfServiceAvailability:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/ClassOfServiceAvailability'
        FareQualifier:
          $ref: '#/components/schemas/FareQualifierENUM'
        stopoverPriced:
          $ref: '#/components/schemas/YesNoUnknownEnum'
        ticketDesignator:
          maxLength: 32
          type: string
          description: >-
            Returns the ticket designator for GDS. The ticket designator is a
            code used by airlines to indicate the type of discount applied to a
            fare. An airline may have a specific ticket designator used to
            differentiate its fares, which may also signify anything from
            private fares, wholesale, promotion, or discounted fares. GDS only;
            not supported for NDC. (NDC ticket designators are returned in
            fareBasisCode per above.)
          example: BB5662Y
        fareTypeCode:
          maxLength: 32
          type: string
          description: >-
            Provides the ATPCO defined fare type code for unbundled fares when
            the Search response includes unbundled fares.
          example: ERU
        FareQualifierString:
          maxLength: 32
          type: string
          description: >-
            NDC only. Not supported for GDS. Fare qualifier of a private leisure
            fares.
          example: '["Tour"]'
      description: Fare related attributes of the Offer/Offering.
    CabinAirEnum:
      type: string
      description: >-
        Specifies the cabin type (e.g. first, business, economy). If sent for
        Flight Specific Search, this field is ignored.
      example: Economy
      enum:
        - PremiumFirst
        - First
        - Business
        - PremiumEconomy
        - Economy
    FareTypeEnum:
      type: string
      description: >-
        Indicates the type of fare that applies to this Offer/Offering. NetFare
        is not supported for NDC.
      example: PublicFare
      enum:
        - PublicFare
        - AgencyPrivateFare
        - AirlinePrivateFare
        - NetFare
      x-enumDescription:
        PublicFare: This portion of the product is a public fare.
        AgencyPrivateFare: This portion of the product is an agency private fare.
        AirlinePrivateFare: This portion of the product is an airline private fare.
        NetFare: This portion of the product is a net fare. Not supported for NDC.
    BrandID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator. Child classes BrandID, Brand. BrandCompleteInfo is no
            longer in use
          example: BrandID
        id:
          type: string
          description: Local id within a given message to support referencing this object.
          example: brand_001
        BrandRef:
          type: string
          description: >-
            Reference id that corresponds to the brand 'id' in
            ReferenceListBrand.Brand.
          example: brandRef_001
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: Brand ID parent class
      discriminator:
        propertyName: '@type'
    CustomerLoyaltyCredit:
      required:
        - CustomerLoyalty
        - Earned
        - Status
      properties:
        '@type':
          type: string
          example: CustomerLoyaltyCredit
        CustomerLoyalty:
          $ref: '#/components/schemas/CustomerLoyalty'
        Earned:
          maxLength: 32
          type: string
          description: >-
            Represents the amount of award credit awarded for this
            offer/offering. Award credit can be used for purchasing goods and
            services through a customer loyalty program
          example: '500'
        Status:
          maxLength: 32
          type: string
          description: >-
            Represents the amount of status credit awarded for this
            offer/offering. Status credit allow a customer to move up the ladder
            of a customer loyalty program.
          example: gold
      description: >-
        Returned only if CustomerLoyalty sent in the request. Returns
        information sent in the request and other details including the miles
        earned for this flight. Includes the ProductRef, CustomerLoyalty,
        Earned, and Status objects. NDC only; not supported for GDS.
    ClassOfServiceAvailability:
      properties:
        value:
          maxLength: 2
          minLength: 1
          pattern: ([a-zA-Z0-9]{1,2})
          type: string
          description: The class of service code. (RBD)
          example: F
        number:
          type: integer
          description: The amount of seats available on this class of service.
          format: int32
          example: 2
        status:
          $ref: '#/components/schemas/AvailabilityStatusEnum'
      description: >-
        Returned in Air Availability API only. Defines the class of service, the
        number of seats available for the class of service, and the status of
        the class of service (E.g., Available).
    FareQualifierENUM:
      properties:
        value:
          $ref: '#/components/schemas/FareQualifierENUM_Base'
      description: deprecated - do not use
      deprecated: true
    FareQualifierENUM_Base:
      type: string
      description: Deprecated - do not use. Replaced by FareQualiferString
      example: Consolidator
      deprecated: true
      enum:
        - Consolidator
        - Government
        - Marine
        - Military
        - Reward
        - StandBy
        - Staff
        - Student
        - Tour
        - Youth
        - VistFriendsAndRelatives
    ReservationDisplaySequence:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes ReservationDisplaySequence only
          example: ReservationDisplaySequence
        DisplaySequence:
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/DisplaySequence'
        autoDeleteDateSequence:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: >-
            The sequence of the autoDeleteDate (retention segment) within the
            Reservation
          format: int32
        AuxiliaryDisplaySequence:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/AuxiliaryDisplaySequence'
        UnpricedSegmentDisplaySequence:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/UnpricedSegmentDisplaySequence'
    DisplaySequence:
      required:
        - '@type'
        - OfferRef
        - displaySequence
      properties:
        '@type':
          type: string
          description: Discriminator
          example: DisplaySequence
        displaySequence:
          type: integer
          description: >-
            The sequence the products are to be displayed for sequential date
            ordering. Data type has been corrected from string to integer in
            v11.24
          format: int32
          example: 1
        OfferRef:
          type: string
          description: Offer reference
        ProductRef:
          type: string
          description: >-
            Product reference. If blank, display sequence applies to all
            products within the Offer.
        Sequence:
          type: integer
          description: >-
            Segment sequence, if blank, display sequence applies to all segments
            within the product
          format: int32
          example: 1
    AuxiliaryDisplaySequence:
      required:
        - '@type'
        - displaySequence
      properties:
        '@type':
          type: string
          description: Discriminator classes AuxillaryDisplaySequence only
          example: AuxiliaryDisplaySequence
        displaySequence:
          type: integer
          format: int32
          example: 3
        CustomAuxiliarySegmentRef:
          type: string
          example: aux_1
    UnpricedSegmentDisplaySequence:
      required:
        - '@type'
        - UnpricedFlightSegmentRef
        - displaySequence
      properties:
        '@type':
          type: string
          description: Discriminator classes UnpricedSegmentDisplaySequence only
          example: UnpricedSegmentDisplaySequence
        displaySequence:
          type: integer
          description: The order for this segment to be displayed
          format: int32
          example: 2
        UnpricedFlightSegmentRef:
          type: string
          description: Reference to the Unpriced Flight Segment
          example: s1
      description: The sequence of the segment in date order.
    AgencyServiceFee:
      allOf:
        - $ref: '#/components/schemas/AgencyServiceFeeID'
        - required:
            - Amount
          properties:
            ExpiryDate:
              type: string
              description: >-
                The service fee expiry date. Once expiry date has been reached,
                the service fee information will only be stored in the
                ReservationReceipt
              format: date-time
              example: '2022-08-07 12:12:00+00:00'
            Description:
              maxLength: 512
              type: string
              description: The description of the service fee
              example: Flight reservation service fee
            Amount:
              $ref: '#/components/schemas/CurrencyAmount'
            Tax:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/Tax'
            RelatedDocumentNumber:
              $ref: '#/components/schemas/DocumentNumber'
            TravelerRef:
              type: string
              description: >-
                Reference to a Traveler within the Reservation that this service
                fee applies to
            OfferRef:
              type: string
              description: >-
                Reference to an Offer within the Reservation that this service
                fee applies to
    AgencyServiceFeeID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes AgencyServiceFeeID or AgencyServiceFee
          example: AgencyServiceFee
        id:
          type: string
          description: Unique id for this object within a message
          example: AgencyServiceFee_1
      discriminator:
        propertyName: '@type'
    Tax:
      properties:
        value:
          type: number
          description: >-
            Amount of the tax. Returned as 0 if a tax was marked as exempt with
            TaxExemption.
          format: float
          example: 12.2
        currencyCode:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: A ISO 4217 currency code associated to the value.
          example: USD
        taxCode:
          maxLength: 512
          type: string
          description: |-
            "Code for the tax. 
            For Hotels this is the OTA code."
          example: XF2
        reportingAuthority:
          maxLength: 512
          type: string
          description: Identifies the reporting authority such as airport code for XF taxes
          example: JFK1
        purpose:
          maxLength: 512
          type: string
          description: Supplier returned description of tax.
          example: Fuel surcharge
        description:
          maxLength: 4096
          type: string
          description: |-
            "Short summary of the tax.
            In Air workflows this is returned only for NDC. 
            For Hotels this is the OTA tax description."
          example: Lodging tax
        includedInBase:
          $ref: '#/components/schemas/YesNoUnknownEnum'
        codeAuthority:
          maxLength: 32
          type: string
          description: Not used. Currency Code Authority
          example: ISO
        decimalPlace:
          type: integer
          description: Permitted number of decimals. Associated to the currency value.
          format: int32
          example: 2
        decimalAuthority:
          maxLength: 32
          type: string
          description: Not used. Currency decimal authority
          example: ISO
        exemptInd:
          type: boolean
          description: >-
            Returned if a tax was marked exempt in the Search request with the
            TaxExemption pricing modifer. GDS only; not supported for NDC. If
            true, this tax is exempt
          example: true
        nonRefundableInd:
          type: boolean
          description: >-
            If true, the tax is non refundable. This indicator is only supported
            for exchange search and exchange price quote transactions.
          example: true
        excludedFromTotalPriceInd:
          type: boolean
          description: >-
            Returned in Hotel APIs when a tax is not included in the TotalPrice.
            Default behavior is for taxes to be included in TotalPrice.
          example: true
      description: Breakdown of the individual Tax information
    DocumentNumber:
      properties:
        value:
          maxLength: 4096
          pattern: ([0-9]+)?
          type: string
          example: '1259900123456'
        documentIssuer:
          maxLength: 32
          type: string
          description: Document issuer
          example: BA
        documentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
        travelerIdentifierRef:
          maxLength: 128
          type: string
          description: traveler identifier reference
        name:
          maxLength: 512
          type: string
          description: The name of the Traveler being referenced.
        passengerTypeCode:
          maxLength: 5
          minLength: 3
          pattern: ([a-zA-Z0-9]{3,5})
          type: string
          description: The passenger type code of the Traveler being referenced.
          example: ADT
        id:
          type: string
          description: A locally referenced ID
        description:
          type: string
          description: Descriptive text used to identify the contents of a target object
        uris:
          type: array
          description: The URI used to GET the target object in another domain.
          items:
            type: string
      description: Document Number with additional attributes that the document represents
    DocumentTypeEnum:
      type: string
      description: Document type like EMD, MCO
      example: Ticket
      enum:
        - EMD
        - MCO
        - Ticket
        - TASF
        - Invoice
      x-enumDescriptions:
        EMD: Electronic Miscellaneous document
        MCO: Miscellaneous Charge order
        Ticket: Ticket
        TASF: Travel Agency Service Fee
        Invoice: Invoice
    CustomAuxiliarySegmentID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes CustomAuxiliarySegmentID or
            CustomAuxiliarySegment
          example: CustomAuxiliarySegment
        id:
          type: string
          description: Custom Auxiliary segment reference ID.
          example: aux_001
        customAuxiliarySegmentRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupID'
        - required:
            - GroupName
            - totalGroupPlaces
            - unallocatedPlaces
          properties:
            unallocatedPlaces:
              type: integer
              description: >-
                The amount of unallocated places available which is the
                difference between the group size and the number of Travelers
                associated
              format: int32
              example: 5
            totalGroupPlaces:
              type: integer
              description: >-
                The total number of passenger places available for this group
                booking
              format: int32
              example: 15
            GroupName:
              maxLength: 128
              type: string
              example: EUROPAGLOBALCONFERENCE
    GroupID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator.
          example: Group
        id:
          type: string
          example: group_001
        GroupRef:
          type: string
          example: groupRef_001
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    UnpricedSegments:
      required:
        - '@type'
        - UnpricedFlightSegment
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes available.
          example: UnpricedSegments
        UnpricedFlightSegment:
          maxItems: 100
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/UnpricedFlightSegment'
      description: Top level object for request. Top level container object for response.
    UnpricedFlightSegment:
      required:
        - '@type'
        - Flight
        - sequence
      properties:
        '@type':
          type: string
          example: UnpricedFlightsegment
        id:
          type: string
          description: Local identifier within a given message for this FlightSegment
          example: unpricedSegment_1
        sequence:
          type: integer
          description: Sequence of the leg of the segment.
          format: int32
          example: 1
        connectionDuration:
          type: string
          description: The actual duration of the connecting FlightSegment
          example: PT2H30M
        passengerQuantity:
          type: integer
          description: Number of passengers on this segment.
          format: int32
          example: 2
        cabin:
          $ref: '#/components/schemas/CabinAirEnum'
        classOfService:
          maxLength: 2
          minLength: 1
          pattern: ([a-zA-Z0-9]{1,2})
          type: string
          description: Class of service of the segment.
          example: 'Y'
        amenityRefs:
          type: array
          description: List of amenity references for this flight
          items:
            type: string
            example: amenity_1
        universalProductAttributeRefs:
          type: array
          description: List of universal product attributes for this flight.
          example: upa_1
          items:
            type: string
        passiveSegmentStatus:
          maxLength: 2
          type: string
          description: >-
            If the segment is to be sold as passive enter the passive segment
            status. AK supplier message sent upon cancel only, BK supplier
            message sent on book and cancel, YK Information only, no supplier
            message sent, segment cannot be priced or ticketed.
          example: AK
        IntermediateStopAmenities:
          maxItems: 9
          type: array
          items:
            $ref: '#/components/schemas/IntermediateStopAmenities'
        OperationalStatus:
          $ref: '#/components/schemas/OperationalStatusENUM'
        Flight:
          $ref: '#/components/schemas/FlightID'
        Co2Actual:
          description: The actual CO2 emissions of this flight. Measured in kilograms.
          allOf:
            - $ref: '#/components/schemas/Measurement'
        boundFlightInd:
          type: boolean
          description: If present and true, the Segments in this Connection are married.
      description: Flight segment information
    Accounting:
      description: Defines Accounting information. Used for all DOCI remarks.
      allOf:
        - $ref: '#/components/schemas/AccountingID'
        - properties:
            dataType:
              maxLength: 32
              type: string
              description: >-
                Accounting data type. When used as Accounting remark designator
                the accepted value is DOCI.
              example: DateTime
            template:
              maxLength: 512
              type: string
              description: Accounting template
              example: Internal Finance template
            NameValuePair:
              maxItems: 50
              type: array
              description: >-
                'Defines the type of accounting-specific remark (name) and the
                remark itself (value). 

                Send the following in "name" for each type of remark: DYO -
                Design Your Own Itinerary FS - Fare Saver CR - Canned Remarks TK
                - Ticket Number Details AC - Agent, Account, or Branch Details
                AR - Replace Sign On Code X* - Back Office Accounting Details FT
                - Free Text

                For remark text "value", please note character limits for each
                type of remark:  DYO - 2 digit, numeric FS - 9 characters total
                limit in format 1 (all numeric) or format 2 (numeric “–“ two
                alpha) CR - 42 characters total limit in format (two numeric "."
                two numeric "." etc) TK - 8 to 12 characters in format 1 (all
                numeric) or format 2 (numeric “-“ three numeric) AC - 42
                characters, alphanumeric and some special characters AR - 10
                characters, alphanumeric X* - 84 characters, alphanumeric and
                some special characters FT - 84 characters, alphanumeric and
                some special characters'
              items:
                $ref: '#/components/schemas/NameValuePair'
    DocumentOverrides:
      allOf:
        - $ref: '#/components/schemas/DocumentOverridesID'
        - properties:
            OfferIdentifier:
              $ref: '#/components/schemas/OfferIdentifier'
            ProductIdentifier:
              $ref: '#/components/schemas/ProductIdentifier'
            Commissions:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/Commissions'
            DestinationPurpose:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/DestinationPurpose'
            Restrictions:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/Restrictions'
            TourCodes:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/TourCodes'
            ChangeFeeCollectionMethod:
              $ref: '#/components/schemas/ChangeFeeCollectionMethod'
            NetRemitInfo:
              $ref: '#/components/schemas/NetRemitInfo'
            TicketDesignators:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/TicketDesignators'
            InvoiceFareAmount:
              $ref: '#/components/schemas/CurrencyAmount'
            residualValueAsEvenExchangeMIRInd:
              type: boolean
              description: >-
                Report an exchange with residual value transaction as an Even
                exchange in the MIR.
              example: true
            obFeeExemptInd:
              type: boolean
              description: >-
                If true, the associated Offer is exempt from OB Payment Card
                Fees.
              example: true
    ProductIdentifier:
      properties:
        id:
          type: string
          description: Local identifier within a given message for this object.
          example: product_1
        productRef:
          type: string
          description: >-
            Used to reference another instance of this object in the same
            payload.
          example: product_1
        Identifier:
          description: >-
            In next leg search Value from
            CatalogProductOffering/ProductBrandOptions/ProductBrandOffering/Product/productRef
            in the Search response for the product to select for the first leg
            of the itinerary. When sending a second Next Leg Search request in a
            multi-city search, this value should be the offer for the second leg
            of the itinerary, and so on for additional O&D pairs.
          allOf:
            - $ref: '#/components/schemas/Identifier'
      description: Product Identifier class
    Commissions:
      required:
        - Commission
      properties:
        '@type':
          type: string
          default: Commissions
        TravelerIdentifierRef:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/TravelerIdentifierRef'
        Commission:
          $ref: '#/components/schemas/Commission'
        ApplyTo:
          $ref: '#/components/schemas/CommissionApplyEnum'
      description: Commissions override
    CommissionApplyEnum:
      type: string
      description: List of commission Apply
      example: Base
      enum:
        - Base
        - Fee
    DestinationPurpose:
      required:
        - destination
        - purpose
      properties:
        '@type':
          type: string
          example: DestinationPurpose
        destination:
          $ref: '#/components/schemas/DestinationEnum'
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
    DestinationEnum:
      type: string
      description: List of destinations
      example: Africa
      enum:
        - United States of America
        - Mexico / Central America / Canal Zone/ Costa Rica
        - Islands and Countries of the Caribbean
        - South America
        - Europe
        - Africa
        - Middle East / Western Asia
        - Asia
        - Australia / New Zealand / Pacific Islands
        - Canada and Greenland
    PurposeEnum:
      type: string
      description: The purpose exposed.
      example: Business
      enum:
        - Business
        - Pleasure
        - Charter Service
    Restrictions:
      required:
        - Restriction
      properties:
        '@type':
          type: string
          default: Restrictions
        TravelerIdentifierRef:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/TravelerIdentifierRef'
        Restriction:
          maxItems: 10
          minItems: 1
          type: array
          items:
            maxLength: 128
            type: string
            example: NON REFUNDABLE/NON ENDORSEABLE
        DocumentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
      description: A list of restrictions applied to the document
    TourCodes:
      required:
        - TourCode
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: TourCodes
        TravelerIdentifierRef:
          maxItems: 10
          type: array
          description: >-
            Reference the traveler if the tour code is traveler specific. Leave
            blank to apply to all travelers.
          items:
            $ref: '#/components/schemas/TravelerIdentifierRef'
        TourCode:
          $ref: '#/components/schemas/TourCode'
      description: >-
        A tour code is a carrier specified and agreed code for a negotiated
        fare. It is used by the BSP or ARC data processing center to perform a
        series of calculations that may be based on the itinerary, agency code,
        dates, and other transaction attributes. The tour code can help identify
        airline-specific incentive payments such as commissions for fares that
        offer the most revenue.
    TourCode:
      properties:
        value:
          maxLength: 32
          type: string
          description: The actual value of the tour code.
        tourCodeType:
          $ref: '#/components/schemas/TourCodeTypeEnum'
      description: Tour code
    TourCodeTypeEnum:
      type: string
      description: List of tour code types.
      example: Inclusive Tour
      enum:
        - Bulk Tour
        - Inclusive Tour
    ChangeFeeCollectionMethod:
      required:
        - code
      properties:
        value:
          $ref: '#/components/schemas/ChangeFeeMethodEnum'
        code:
          maxLength: 32
          type: string
          description: The code value
          example: f2142
        subCode:
          maxLength: 32
          type: string
          description: The subcode value
          example: 631b
        description:
          maxLength: 128
          type: string
          description: The description value
          example: Change fee collection method
        changeFeeIssuedSeparatelyInd:
          type: boolean
          description: >-
            if true, the change fee will be issued as a separate transaction to
            the residual amount
          example: true
        taxIncludedInBaseAmountInd:
          type: boolean
          description: >-
            If true, the tax  on the fee will be included in the base fee amount
            and sent as a single value to the supplier for fulfilment
          example: true
    ChangeFeeMethodEnum:
      type: string
      description: List of change fee method
      example: EMD
      enum:
        - EMD
        - MCO
        - Tax
        - Unknown
    NetRemitInfo:
      properties:
        '@type':
          type: string
          example: NetRemitInfo
        CarCode:
          maxLength: 32
          type: string
          description: >-
            The CAR code or deal code applied to this product for use in net
            remit.
          example: ACAR
        ValueCode:
          maxLength: 32
          type: string
          description: The Value code applied to this product for use in net remit
          example: D1000
        ActualSellingFare:
          type: number
          description: >-
            The actual selling fare which will override the Offer base fare on
            the document
          format: float
          example: 100.5
        NetBaseAmount:
          $ref: '#/components/schemas/FiledAmount'
        ClientDiscountCode:
          maxLength: 32
          type: string
          description: The client discount code applied to this product for net remit.
          example: DEF456
    FiledAmount:
      required:
        - decimalPlace
      properties:
        value:
          type: number
          description: Filed amount value
          format: float
          example: 43.3422
        currencyCode:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: Filed amount currency code
          example: USD
        codeAuthority:
          maxLength: 32
          type: string
          description: Filed amount currency code authority
          example: Australian Dollar
        decimalPlace:
          type: integer
          description: ISO 4217 standard has a different number of decimals
          format: int32
          example: 3
        decimalAuthority:
          maxLength: 32
          type: string
          description: ISO 4217 standard decimal authority
          example: ISO 4217
      description: >-
        The base amount of a ticket price or net price that is filed in local
        currency
    TicketDesignators:
      required:
        - '@type'
        - TicketDesignator
      properties:
        '@type':
          type: string
          description: Discriminator class TicketDesignators only
        TravelerIdentifierRef:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/TravelerIdentifierRef'
        TicketDesignator:
          maxLength: 32
          type: string
    CustomRule:
      properties:
        PseudoCityCode:
          maxLength: 10
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,10})
          type: string
          description: The PCC that the custom rule belongs to
        RuleRecord:
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/RuleRecord'
      allOf:
        - $ref: '#/components/schemas/CustomRuleID'
    CustomRuleID:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes CustomRuleID or CustomRule
        id:
          type: string
          description: Custom rule id reference ID.
        Identifier:
          $ref: '#/components/schemas/Identifier'
      discriminator:
        propertyName: '@type'
    RuleRecord:
      required:
        - '@type'
        - RuleRecordName
        - Sequence
      properties:
        '@type':
          type: string
          description: Discriminator class RuleRecord only
        sequence:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: The sequence of the RuleRecord line
          format: int32
        RuleRecordName:
          maxLength: 32
          type: string
          description: The name of the rule record
          example: CTCM
        RuleText:
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/RuleText'
    RuleText:
      required:
        - '@type'
        - StringText
        - sequence
      properties:
        '@type':
          type: string
          description: Discriminator class RuleText only
        sequence:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: The sequence of the RuleText line
          format: int32
        StringText:
          maxLength: 512
          type: string
    ReservationDetailListResponseWrapper:
      properties:
        ReservationDetailMultipleResponse:
          $ref: '#/components/schemas/ReservationDetailMultipleResponse'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    ReservationDetailMultipleResponse:
      description: >-
        An array of ReservationResponse objects to support multiple individual
        hotel reservations within a single payload.
      allOf:
        - properties:
            ReservationResponses:
              type: array
              items:
                $ref: '#/components/schemas/ReservationResponse'
        - $ref: '#/components/schemas/BaseResponse'
    ReservationQueryBuildMultipleWrapper:
      properties:
        ReservationQueryBuildMultiple:
          $ref: '#/components/schemas/ReservationQueryBuildMultiple'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    ReservationQueryBuildMultiple:
      properties:
        ReservationBuildsFromCatalogOffering:
          type: array
          items:
            $ref: '#/components/schemas/ReservationBuildFromCatalogOffering'
      description: >-
        Used for a Create Hotel Reservation (Multiple, Reference Payload)
        request. Defines a request to create multiple individual hotel
        reservations in a single payload by referencing cached offer data from a
        preceding Hotel Availability or SearchComplete response. If the cached
        offers expire before booking, a new request must be sent to refresh
        them. This request typically follows Hotel Availability, Rules, or
        SearchComplete and is sent to finalize a booking.
    ReservationBuildFromCatalogOffering:
      allOf:
        - $ref: '#/components/schemas/ReservationBuild'
        - properties:
            id:
              type: string
              description: >-
                Sequence of the reservation when part of build multiple
                reservations
              example: ref_001
            BuildFromCatalogOfferingHospitality:
              $ref: '#/components/schemas/BuildFromCatalogOfferingHospitality'
    IdentifierTypeENUM:
      type: string
      example: Locator
      enum:
        - Reservation
        - Locator
        - SupplierLocator
        - DocumentNumber
    ErrorResponseWrapper:
      properties:
        ErrorResponse:
          $ref: '#/components/schemas/ErrorResponse'
      description: Wrapper object
    ReservationQueryCommitReservation:
      properties:
        Notification:
          maxItems: 5
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        scheduleChangeAcceptedInd:
          type: boolean
          description: If true, the schedule change is accepted by the consumer.
        errorWhenOfferPriceCancelledInd:
          type: boolean
          deprecated: true
        inhibitResidualDocumentIssuanceInd:
          type: boolean
          description: If true, any residual value will not be applied to an MCO or EMD.
          example: true
        enableTwoStepCommitInd:
          type: boolean
          description: >-
            If true, reservation warnings such as minimum connection time will
            be returned to the user for review and a second commit will be
            required to proceed with creating the reservation.
          example: true
        overrideMCTInd:
          type: boolean
          description: >-
            If true, the minimum connection time warning will be ignored and the
            Reservation created.
          example: true
        errorWhenScheduleChangesInd:
          type: boolean
          description: >-
            If true, an error will be returned when the flight schedule changes
            during commit processing
          example: true
        scheduleChangeReprice:
          $ref: '#/components/schemas/ScheduleChangeRepriceEnum'
        ReceivedFrom:
          maxLength: 61
          type: string
          description: >-
            Override the received from field with custom data. Field is stored
            in Reservation history.
          example: TW
        errorWhenOfferPriceChangesInd:
          type: boolean
          description: >-
            If true, an error will be returned when the flight price changes
            during commit processing.
          example: true
    ScheduleChangeRepriceEnum:
      type: string
      example: AcceptOfferPriceDifference
      enum:
        - RetainOfferPrice
        - AcceptOfferPriceDifference
    OfferQueryBuildHotelFromCatalogOfferingWrapper:
      properties:
        OfferQueryBuildHotelFromCatalogOfferingRequest:
          $ref: '#/components/schemas/OfferQueryBuildHotelFromCatalogOfferingRequest'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    OfferQueryBuildHotelFromCatalogOfferingRequest:
      properties:
        OfferQueryBuildHotelsFromCatalogOffering:
          type: array
          items:
            $ref: '#/components/schemas/OfferQueryBuildHotelFromCatalogOffering'
    OfferQueryBuildHotelFromCatalogOffering:
      required:
        - BuildFromCatalogOfferingHospitality
        - FormOfPaymentID
        - TravelerID
      properties:
        '@type':
          type: string
          description: Discriminator class OfferQueryBuildHotelFromCatalogOffering only
          example: OfferQueryBuildHotelFromCatalogOffering
        BuildFromCatalogOfferingHospitality:
          $ref: '#/components/schemas/BuildFromCatalogOfferingHospitality'
        TravelerID:
          type: string
          description: >-
            Reference the Traveler ID from the workbench that this hotel is to
            be booked for. If not sent, the first traveler in the reservation
            will be allocated to the hotel.
          example: traveler_1
        FormOfPaymentID:
          type: string
          description: >-
            Reference the Form Of Payment ID from the workbench that will be
            used for guarantee or deposit of this hotel.
          example: formOfPayment_1
        DepositInd:
          type: boolean
          description: >-
            If true, the payment is a deposit on the referenced Offer. Default
            is guarantee.
        SpecialInstruction:
          maxLength: 50
          type: string
          description: Customer generated special instructions transmitted to the hotel.
          example: Guest prefers room on first floor.
    OfferHospitalityWrapper:
      properties:
        OfferHospitalityRequest:
          $ref: '#/components/schemas/OfferHospitalityRequest'
      description: Wrapper schema to expose the root element in the JSON example
    OfferHospitalityRequest:
      properties:
        OffersHospitality:
          type: array
          items:
            $ref: '#/components/schemas/OfferHospitality'
    OfferHospitality:
      required:
        - FormOfPaymentID
        - Offer
        - TravelerID
      properties:
        Offer:
          $ref: '#/components/schemas/Offer'
        TravelerID:
          type: string
          description: >-
            Reference the Traveler ID from the workbench that this hotel is to
            be booked for. If not sent, the first traveler in the reservation
            will be allocated to the hotel.
          example: traveler_1
        FormOfPaymentID:
          type: string
          description: >-
            Reference the Form Of Payment ID from the workbench that will be
            used for guarantee or deposit of this hotel.
          example: formOfPayment_1
        DepositInd:
          type: boolean
          description: >-
            If true, the payment is a deposit on the referenced Offer. Default
            is guarantee.
        SpecialInstruction:
          maxLength: 50
          type: string
          description: Customer generated special instructions transmitted to the hotel.
          example: Guest prefers room on first floor.
        SupplierLocator:
          description: Pass supplier locator for passive segment bookings.
          allOf:
            - $ref: '#/components/schemas/SupplierLocator'
      description: Create full payload hotel offers (workbench).
    SupplierLocator:
      properties:
        value:
          maxLength: 16
          pattern: ([A-Z0-9]+)?
          type: string
          example: WTR45G
        supplierCode:
          maxLength: 5
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,5})
          type: string
          description: Supplier Code
          example: AA
        supplierName:
          maxLength: 64
          type: string
          description: Name of the supplier
          example: American Airlines
      description: The supplier and the supplier's locator code for a product
    ReservationDetailWrapper:
      properties:
        ReservationDetail:
          $ref: '#/components/schemas/ReservationDetail'
      description: >-
        Wrapper schema to expose the name of the top level schema in the JSON
        example
    TermsAndConditionsFullHospitality:
      description: >-
        Defines the Terms and Conditions present on a specific hotel offer. For
        a Hotel Create Reservation (Full Payload) request, be sure to send
        TermsAndConditionsFull if it was returned in the Availability response.
      allOf:
        - $ref: '#/components/schemas/TermsAndConditionsFull'
        - properties:
            Guarantee:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/Guarantee'
            CancelPenalty:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/CancelPenalty'
            AcceptedCreditCard:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/AcceptedCreditCard'
            Description:
              maxItems: 10
              type: array
              description: >-
                Free-form text for a room and rate description.This duplicates
                the room description in RoomType and the rate description in
                Price; planned for deprecation.
              items:
                type: string
            MealsIncluded:
              $ref: '#/components/schemas/MealsIncluded'
            ProductRateCodeInfo:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/ProductRateCodeInfo'
            CheckInOutPolicy:
              $ref: '#/components/schemas/CheckInOutPolicy'
            DepositPolicy:
              $ref: '#/components/schemas/DepositPolicy'
            RatePaymentInfo:
              $ref: '#/components/schemas/RatePaymentEnum'
            CustomerLoyaltyIDRequiredAtReservation:
              type: boolean
              description: >-
                If true, the rate returned is contingent on a membership number
                to be included within the sell request, typically associated to
                frequent guest or frequent flyer loyalty numbers.
            RateQualificationIDRequiredAtCheckIn:
              type: boolean
              description: >-
                If true, the rate returned is contingent on qualification to be
                presented at check-in at the property; the discounted rate
                returned may be denied at the property if guest does not show
                proof of qualifying, typically a
                government/military/workplace/association/membership ID.
    TermsAndConditionsFull:
      allOf:
        - $ref: '#/components/schemas/TermsAndConditionsFullID'
        - properties:
            ExpiryDate:
              type: string
              description: The data and time the offer will expire
              format: date-time
              example: '2022-08-07 12:12:00+00:00'
            CustomerLoyalty:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/CustomerLoyalty'
            TextBlock:
              maxItems: 50
              type: array
              items:
                $ref: '#/components/schemas/TextBlock'
    TextBlock:
      required:
        - '@type'
        - TextFormatted
      properties:
        '@type':
          type: string
          description: Discriminator classes TextBlock or TextBlockDetail
          example: TextBlockDetail
        title:
          maxLength: 512
          type: string
          description: >-
            "The title of the rule or information. 

            For TermsAndConditionsFullHospitality, may include any of the
            following Rule Types; Promotional Data, Rate Description, Room Rate
            Data, Rate Text, Guarantee, Cancellation, Deposit, Check in/out,
            Room detail, Extra charges, Packages, Property, Location,
            Miscellaneous, Rate Amount, Alternate Rate Amount, Rate Comment,
            FAX, Phone, Special Information, Information, Room Hold Expiration
            Time. Not every property returns all of these types. Some properties
            do not return any title. Only English is supported for these
            values."
          example: Baggage Details
        id:
          type: string
          description: Internally referenced id
          example: '2'
        TextFormatted:
          maxItems: 50
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/TextFormatted'
      description: Each instance is one rule or set of information.
    TextFormatted:
      properties:
        value:
          maxLength: 4096
          type: string
          description: The actual text of the hotel rule or information.
          example: ID Required Must Guarantee Late Arrival
        language:
          type: string
          description: The language in which the text or rule is provided.
          example: English
        textFormat:
          $ref: '#/components/schemas/TextFormatEnum'
      description: >-
        Provides text, generally rules or information, and indicates how it is
        formatted.
    TextFormatEnum:
      type: string
      description: Describes the format of text such as plain text or html
      enum:
        - PlainText
        - HTML
    Guarantee:
      properties:
        '@type':
          type: string
          default: Guarantee
        code:
          maxLength: 32
          type: string
          description: The guarantee code
        guaranteeType:
          $ref: '#/components/schemas/GuaranteeTypeEnum'
        credentialsRequiredInd:
          type: boolean
      description: >-
        If returned by the provider, Guarantee indicates whether payment is
        required to hold the room.
    GuaranteeTypeEnum:
      type: string
      description: Defines the type of guarantee to be applied to this reservation.
      enum:
        - GuaranteeRequired
        - CC/DC/Voucher
        - Profile
        - NoGuaranteesAccepted
        - GuaranteesAccepted
        - DepositRequired
        - GuaranteesNotRequired
        - DepositNotRequired
        - PrepayRequired
        - PrepayNotRequired
        - NoDepositsAccepted
    CancelPenalty:
      properties:
        '@type':
          type: string
          default: CancelPenalty
        Description:
          type: string
          description: >-
            A readable text equivalent of the structured Deadline/HotelPenalty
            combination.
          example: >-
            If you cancel, modify, or do not arrive until Dec 01, 2025, you will
            be charged with a fee of 100% of the total stay.
        Deadline:
          $ref: '#/components/schemas/Deadline'
        HotelPenalty:
          $ref: '#/components/schemas/HotelPenalty'
        Refundable:
          $ref: '#/components/schemas/YesNoUnknownEnum'
      description: >-
        Defines the cancellation policy of the hotel facility. When there is a
        refundable period and a non-refundable period for a rate, separate
        instances of CancelPenalty return the Deadline and HotelPenalty objects
        for each period.
    Deadline:
      required:
        - SpecificDate
      properties:
        '@type':
          type: string
          default: Deadline
        SpecificDate:
          $ref: '#/components/schemas/DateOrDateWindows'
        Time:
          type: string
          description: >-
            The deadline time in 24-hour HH:MM:SS format, in the local time of
            the property.
      description: >-
        The absolute deadline, or amount of offset time prior to a deadline,
        before a payment or cancel goes into effect.
    HotelPenalty:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes HotelPenaltyAmount, HotelPenaltyNights, and
            HotelPenaltyPercent
        subjectToTax:
          $ref: '#/components/schemas/YesNoUnknownEnum'
      description: >-
        Cancellation penalty amount. Returns different objects based on penalty
        type. 

        For HotelPenaltyNights, the Nights and subjectToTax objects may return. 

        For HotelPenaltyPercent, the Percent and appliesTo objects may return. 

        For HotelPenaltyAmount, the Amount and includesTax objects may return.
      discriminator:
        propertyName: '@type'
    AcceptedCreditCard:
      properties:
        value:
          maxLength: 2
          pattern: ([A-Z0-9]+)?
          type: string
          description: Two-character code of credit card type.
          example: VI
        processingCountry:
          pattern: '[a-zA-Z]{2}'
          type: string
          description: Country Code ISO
      description: A list of accepted credit cards.
    MealsIncluded:
      properties:
        breakfastInd:
          type: boolean
        lunchInd:
          type: boolean
        dinnerInd:
          type: boolean
      description: Meal attributes are returned with a value of true if a meal is included.
    ProductRateCodeInfo:
      required:
        - RateCodeInfo
      properties:
        '@type':
          type: string
          example: ProductRateCodeInfo
        ProductRef:
          type: string
          description: Product reference
          example: product_1
        RateCodeInfo:
          $ref: '#/components/schemas/RateCodeInfo'
        ExtraAccommodation:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/ExtraAccommodation'
      description: Includes any negotiated rate code details if applicable to this offer.
    RateCodeInfo:
      properties:
        value:
          maxLength: 32
          type: string
          description: The negotiated rate plan code.
          example: HL12344
        rateName:
          maxLength: 32
          type: string
          description: Name of the rate plan.
          example: Special
        rateID:
          maxLength: 32
          type: string
          description: ID of the rate plan associated with the negotiated rate plan code.
          example: '2345'
        rateCategory:
          $ref: '#/components/schemas/RateCategoryEnum'
      description: >-
        Rate code information for this offer, if applicable.

        For a Hotel Create Reservation (Full Payload) request, send RateCodeInfo
        when it's returned in the Availability response. Send the values from
        ProductRateCodeInfo/RateCodeInfo. You must include value and rateID.
        When returned from Availability, additionally send rateCategory and
        rateName.
    DepositPolicy:
      required:
        - Deposit
      properties:
        '@type':
          type: string
          example: DepositPolicy
        Deposit:
          maxItems: 3
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Deposit'
      description: >-
        If returned by the provider, DepositPolicy indicates whether a deposit
        is required to hold the room.
    Deposit:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes DepositAmount or DepositPercent
          example: DepositAmount
        Date:
          type: string
          description: The date and time the deposit is due
          format: date-time
          example: '2026-08-07 12:12:00+00:00'
        remainderInd:
          type: boolean
          description: >-
            Indicates if a deposit was part of the TotalPrice. If true, a
            remainder is due and the related Date object will indicate when that
            deposit amount is due. If false, the deposit was part of TotalPrice
            and no remainder is due.
      description: Deposit amount in relation to TotalPrice.
      discriminator:
        propertyName: '@type'
    RatePaymentEnum:
      type: string
      description: Payment Rate designation
      example: PrePay
      enum:
        - PrePay
        - PostPay
        - Unknown
      x-enumDescriptions:
        PrePay: Payment must be made at the time of booking.
        PostPay: >-
          Payment is made upon arrival. Generally, only credit card details are
          required to hold the reservation.
    ProductHospitality:
      allOf:
        - $ref: '#/components/schemas/Product'
        - required:
            - PropertyKey
          properties:
            bookingCode:
              maxLength: 32
              type: string
              description: >-
                Send the value returned from the Availability response
                ProductOptions/ProductBooking.
            passiveBookingReasonCode:
              $ref: '#/components/schemas/PassiveBookingReasonCodeENUM'
            guests:
              type: integer
              description: Total number of guests. Numeric values 1-9 inclusive supported.
              format: int32
            moreRatesToken:
              maxLength: 512
              type: string
              description: More rates token
            adaCompliant:
              $ref: '#/components/schemas/YesNoUnknownEnum'
            propertyName:
              maxLength: 128
              type: string
              description: Name of property offering this product.
              example: Hilton Garden Inn Brighton
            associatedCityCode:
              maxLength: 3
              minLength: 3
              pattern: ([a-zA-Z]{3})
              type: string
              description: The logistically closest city associated to the property
              example: LON
            associatedAirportCode:
              maxLength: 3
              minLength: 3
              pattern: ([a-zA-Z]{3})
              type: string
              description: The logistically closest airport associated to the property
              example: LGW
            PropertyAddress:
              $ref: '#/components/schemas/Address'
            Telephone:
              $ref: '#/components/schemas/Telephone'
            Email:
              $ref: '#/components/schemas/Email'
            GuestCounts:
              $ref: '#/components/schemas/GuestCounts'
            PropertyKey:
              $ref: '#/components/schemas/PropertyKey'
            TravelerContact:
              $ref: '#/components/schemas/TravelerContact'
            RoomType:
              $ref: '#/components/schemas/RoomType'
            DateRange:
              $ref: '#/components/schemas/DateRange'
            SpecialInstruction:
              maxLength: 50
              type: string
              description: >-
                Customer generated special instructions transmitted to the
                hotel.
              example: Guest prefers room on first floor.
    PassiveBookingReasonCodeENUM:
      type: string
      example: I
      enum:
        - G
        - H
        - I
        - 'N'
        - P
        - R
        - U
        - V
      x-enumDescriptions:
        G: Group Booking
        H: Property not listed
        I: Internet only rate
        'N': Multi-level rate not offered
        P: Package or Tour rate not offered
        R: Rate not offered
        U: Property sold out
        V: Government rate not offered
    TravelerContact:
      required:
        - '@type'
      type: object
      properties:
        '@type':
          type: string
          example: TravelerContact
        Email:
          $ref: '#/components/schemas/Email'
        Telephone:
          $ref: '#/components/schemas/Telephone'
      description: >-
        Identifies the traveler contact information delivered to the hotel
        supplier for this segment
    RoomType:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          example: RoomType
        RoomCharacteristics:
          $ref: '#/components/schemas/RoomCharacteristics'
        Description:
          $ref: '#/components/schemas/TextTitleAndDescription'
        RoomAmenity:
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/RoomAmenity'
      description: >-
        Provides details regarding rooms, such as characteristics, descriptions,
        and amenities.
      discriminator:
        propertyName: '@type'
    RoomCharacteristics:
      properties:
        '@type':
          type: string
          default: RoomCharacteristics
        typeCode:
          maxLength: 32
          type: string
          description: OTA room type code.
        viewCode:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: OTA code describing the view.
        viewDescription:
          type: string
          description: Free text describing the view
          example: Mountain View
        category:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: Category of the room.
          deprecated: true
        smokingAllowed:
          $ref: '#/components/schemas/YesNoUnknownEnum'
        wifiIncluded:
          $ref: '#/components/schemas/YesNoUnknownEnum'
        BedConfiguration:
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/BedConfiguration'
        nonSmokingInd:
          type: boolean
        shortRoomDescription:
          maxLength: 100
          type: string
          description: Normalized text for grouping rates against similar room types.
          example: 2 Queen bed(s) Standard Room Smoking
          deprecated: true
        accessibleRoom:
          $ref: '#/components/schemas/YesNoUnknownEnum'
      description: Used to define a room (eg. its location, configuration, view).
    BedConfiguration:
      properties:
        quantity:
          type: integer
          description: The number of beds of a specified type in the room.
          format: int32
        bedType:
          maxLength: 32
          type: string
          description: >-
            Bed type. Possible values include King Bed(s), Queen Bed(s), Twin
            Bed(s), Sofa Bed(s), and OTHER Bed(s).
        size:
          maxLength: 32
          type: string
          description: Approximate measurement/size of the bed(s) in the room.
      description: Configuration of bed(s) in room.
    DateRange:
      required:
        - end
        - start
      properties:
        start:
          type: string
          description: >-
            Specifies the start date for an event, such as a booking or check-in
            date in YYYY-MM-DD format.
          format: date
          example: '2026-03-03'
        end:
          type: string
          description: >-
            Specifies the end date an event, such as a booking or check-out date
            in YYYY-MM-DD format.
          format: date
          example: '2026-03-03'
      description: >-
        Specifies the begin and end date of an event, such as check-in and
        check-out dates.
    PriceBreakdownHospitality:
      description: >-
        The information returned may vary by provider and location. May include
        Amount and Commission.

        If roomPricingType = Per night, PriceBreakdown may include the
        NightlyRate, AverageNightlyRate, and AmenitySurcharges objects. 

        If roomPricingType = Per stay, PriceBreakdown may return the Description
        object with rate description text containing more information.
      allOf:
        - $ref: '#/components/schemas/PriceBreakdown'
        - properties:
            roomPricingType:
              $ref: '#/components/schemas/PricingEnum'
            Description:
              maxLength: 1024
              type: string
              example: Advance Purchase-Ro-Free WiFi
            NightlyRate:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/NightlyRate'
            AverageNightlyRate:
              maxItems: 2
              type: array
              description: The average nightly rate for a given offer.
              items:
                $ref: '#/components/schemas/CurrencyAmount'
            AmenitySurcharges:
              $ref: '#/components/schemas/AmenitySurchargesDetail'
            priceChangesDuringStayInd:
              type: boolean
              description: >-
                "If true, indicates the price changes at least once during
                requested dates. 

                If roomPricingType = Per night, multiple instances of
                priceChangesDuringStayInd are returned."
            shortRateDescription:
              type: string
              description: >-
                A normalized rate description for comparing rates across
                multiple aggregators.
              example: Flexible Rate
    PricingEnum:
      type: string
      description: >-
        A string provided by the hotel to describe how a service is priced, such
        as per night or per stay.
      enum:
        - Per stay
        - Per person
        - Per night
        - Per person per night
        - Per use
    NightlyRate:
      required:
        - Amount
        - startDate
      properties:
        '@type':
          type: string
          default: NightlyRate
        startDate:
          type: string
          description: Start date for the nightly rate in YYYY-MM-DD format.
          format: date
        nights:
          type: integer
          description: Number of nights the nightly rate is valid.
          format: int32
        Amount:
          $ref: '#/components/schemas/Amount'
      description: >-
        A monetary amount, representing Rate per night. Supports up to 4 decimal
        places; decimal place must be included. If the nightly rate changes
        during the stay, multiple instances of NightlyRate are returned.
    AmenitySurchargesDetail:
      description: Amenity Surcharges information.
      allOf:
        - $ref: '#/components/schemas/AmenitySurcharges'
        - description: A detailed breakdown of the amenity surcharges
        - required:
            - Surcharge
          properties:
            Surcharge:
              maxItems: 100
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/Surcharge'
    AmenitySurcharges:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes AmenitySurcharges or AmenitySurchargesDetail
          example: AmenitySurchargesDetail
        TotalSurcharges:
          type: number
          description: >-
            A monetary amount, up to 4 decimal places. Decimal place needs to be
            included.
          format: float
          example: 211.11
        approximateInd:
          type: boolean
          description: if true, the surcharge amounts are approximate
          example: false
      discriminator:
        propertyName: '@type'
    Surcharge:
      properties:
        value:
          type: number
          description: Surcharge amount
          format: float
          example: 12
        currencyCode:
          pattern: '[a-zA-Z]{3}'
          type: string
          description: ISO 4217 currency code for the surcharge.
          example: USD
        surchargeCode:
          maxLength: 512
          type: string
          description: Surcharge code
          example: ADDITIONAL COSTS
        reportingAuthority:
          maxLength: 512
          type: string
          description: Not used. Surcharge reporting authority
          example: Federal register
        purpose:
          maxLength: 512
          type: string
          description: >-
            Surcharge purpose. For Air workflows possible values include Weekend
            Surcharge, Stopover Charge, Multiple Stopover Charges, Other
            (default value that covers all other surcharges such as fuel
            surcharges).
          example: Weekend Surcharge
        description:
          maxLength: 4096
          type: string
          description: Description of the surcharge.
          example: Rollaway Surcharge
        surchargeApplication:
          $ref: '#/components/schemas/ApplicationEnum'
        surchargeFrequency:
          $ref: '#/components/schemas/FrequencyEnum'
        codeAuthority:
          maxLength: 32
          type: string
          description: Not used. Currency code authority.
          example: ISO 4217
        decimalPlace:
          type: integer
          description: Decimal place for the currency unit.
          format: int32
          example: 4
        decimalAuthority:
          maxLength: 32
          type: string
          description: Not used. Currency code decimal authority.
          example: ISO 4217
      description: >-
        Breakdown of the individual surcharge that make up TotalSurcharges. For
        Hotels, additional charges are usually related to requested amenities.
    ApplicationEnum:
      type: string
      description: >-
        Application values (such as the application of a fee) like per person or
        per room.
      example: PerPerson
      enum:
        - PerPerson
        - PerRoom
        - PerAccommodation
        - PerHouse
        - PerApartment
        - PerAdult
        - PerChild
    FrequencyEnum:
      type: string
      description: The frequency of a fee such as per night or per stay.
      example: PerNight
      enum:
        - PerNight
        - PerDay
        - PerStay
        - PerWeek
        - RoundTrip
        - OneWay
    DepositNumberOfNights:
      allOf:
        - $ref: '#/components/schemas/Deposit'
        - required:
            - NumberOfNights
          properties:
            NumberOfNights:
              type: integer
              description: The number of nights that must be paid for by deposit
              format: int32
    DepositAmount:
      description: A flat amount that must be paid as a deposit.
      allOf:
        - $ref: '#/components/schemas/Deposit'
        - required:
            - CurrencyAmount
          properties:
            CurrencyAmount:
              $ref: '#/components/schemas/CurrencyAmount'
    DepositPercent:
      allOf:
        - $ref: '#/components/schemas/Deposit'
        - properties:
            Percent:
              type: number
              description: >-
                The percentage of the TotalPrice that must be paid for as a
                deposit.
              format: float
              example: 20
    HotelPenaltyAmount:
      allOf:
        - $ref: '#/components/schemas/HotelPenalty'
        - required:
            - Amount
          properties:
            includesTax:
              $ref: '#/components/schemas/YesNoUnknownEnum'
            Amount:
              maxItems: 2
              minItems: 1
              type: array
              description: Exact penalty amount.
              items:
                $ref: '#/components/schemas/CurrencyAmount'
    HotelPenaltyNights:
      allOf:
        - $ref: '#/components/schemas/HotelPenalty'
        - required:
            - Nights
          properties:
            Nights:
              type: integer
              description: >-
                The number of nights that will be charged as a penalty, if the
                provider charges a cancellation fee.
              format: int32
    HotelPenaltyPercent:
      allOf:
        - $ref: '#/components/schemas/HotelPenalty'
        - required:
            - Percent
            - appliesTo
          properties:
            appliesTo:
              $ref: '#/components/schemas/PercentAppliesTo'
            Percent:
              minimum: 0
              exclusiveMinimum: false
              type: number
              description: Percentage of total amount to be charged as penalty.
              format: float
            Nights:
              type: integer
              description: >-
                The number of nights the percentage needs to be applied to
                determine cancel penalty amount
              format: int32
            Amount:
              maxItems: 2
              type: array
              items:
                $ref: '#/components/schemas/CurrencyAmount'
    PercentAppliesTo:
      type: string
      description: The increment the percent applies to. Default value is Amount
      example: Amount
      enum:
        - Nights
        - Stay
        - Amount
    AgeQualifying:
      properties:
        '@type':
          type: string
          example: AgeQualifying
        minAge:
          type: integer
          description: 'MinAge: The minimum age to qualify for AgeQualifyingCode.'
          format: int32
        maxAge:
          type: integer
          description: 'Max Age: The maximum age to qualify for AgeQualifyingCode.'
          format: int32
        ageBucket:
          maxLength: 32
          type: string
          description: The age bucket
        count:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: The number of age qualifying
          format: int32
        ageQualifyingCode:
          maxLength: 32
          type: string
          description: Enter 10 for an adult or 08 for a child
          example: '10'
      description: Base age group of occupants for which this rate is valid.
    RoomTypeDetail:
      allOf:
        - $ref: '#/components/schemas/RoomType'
        - properties:
            numberOfUnits:
              type: integer
              description: >-
                The number of rooms that have been combined to create this room
                type.
              format: int32
            reqdGuaranteeType:
              type: string
              description: >-
                TODO-(Should this be Guarantee?)Denotes the form of guarantee
                for this room.
            AdditionalDetails:
              $ref: '#/components/schemas/AdditionalDetails'
            RoomOccupancy:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/RoomOccupancy'
            roomInd:
              type: boolean
              description: Indicates the room is a sleeping room when true.
            convertedInd:
              type: boolean
              description: Indicates the room is converted when true.
            alternateInd:
              type: boolean
              description: >-
                Indicates the room is an alternate room type to the requested
                room type when true.
    AdditionalDetails:
      required:
        - AdditionalDetail
      properties:
        '@type':
          type: string
          example: AdditionalDetails
        AdditionalDetail:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/AdditionalDetail'
      description: A collection of AdditionalDetail.
    AdditionalDetail:
      properties:
        '@type':
          type: string
          example: AdditionalDetail
        detailType:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: OTA Code
        code:
          maxLength: 32
          type: string
          description: Partner code
        Amount:
          $ref: '#/components/schemas/CurrencyAmount'
        Description:
          $ref: '#/components/schemas/TextTitleAndDescription'
      description: Used to send additional information.
    RoomOccupancy:
      properties:
        '@type':
          type: string
          default: RoomOccupancy
        minOccupancy:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: The minimum occupancy
          format: int32
        maxOccupancy:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          description: The maximum number of room occupants.
          format: int32
        AgeQualifying:
          maxItems: 20
          type: array
          items:
            $ref: '#/components/schemas/AgeQualifying'
      description: Room occupancy value.
    RateCandidateDetail:
      allOf:
        - $ref: '#/components/schemas/RateCandidate'
        - properties:
            rateID:
              maxLength: 32
              type: string
              description: >-
                'ID of the rate plan associated with the negotiated rate. 

                For Hotel Availability,Optional; will be added automatically if
                missing.

                For Hotel Rules, this value can be found, if returned, in the
                Availability response's
                ProductRateCodeInfo/RateCodeInfo/rateID.'
              example: HL123
            CustomerLoyalty:
              $ref: '#/components/schemas/CustomerLoyalty'
    RateCandidatesDetail:
      allOf:
        - $ref: '#/components/schemas/RateCandidates'
        - properties:
            numberOfRatePlans:
              type: integer
              description: Minimum number rate plans requested in response
              format: int32
    PropertyAddress:
      type: object
      allOf:
        - $ref: '#/components/schemas/Address'
    ProductHospitalityOffer:
      allOf:
        - $ref: '#/components/schemas/Product'
        - properties:
            propertyDatesRef:
              type: string
              description: >-
                Refers to PropertyDates object in the
                ReferenceList_PropertyDates
            bookingCode:
              maxLength: 32
              type: string
              description: Booking code retrieved from the Availability response.
            RoomType:
              $ref: '#/components/schemas/RoomType'
    TermsAndConditionsHospitality:
      allOf:
        - $ref: '#/components/schemas/TermsAndConditions'
        - properties:
            Guarantee:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/Guarantee'
            CancelPenalty:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/CancelPenalty'
            AcceptedCreditCard:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/AcceptedCreditCard'
            Description:
              maxItems: 10
              type: array
              description: >-
                Free-form text for a room and rate description. This duplicates
                the room description in RoomType
              example: >-
                "Prepay Non-Refundable, Prepay In Full, No Changes, Traditional,
                Guest Room, 2 Queen"
              items:
                type: string
            MealsIncluded:
              $ref: '#/components/schemas/MealsIncluded'
            ProductRateCodeInfo:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/ProductRateCodeInfo'
            CheckInOutPolicy:
              $ref: '#/components/schemas/CheckInOutPolicy'
            DepositPolicy:
              $ref: '#/components/schemas/DepositPolicy'
            RatePaymentInfo:
              $ref: '#/components/schemas/RatePaymentEnum'
            CustomerLoyaltyIDRequiredAtReservation:
              type: boolean
              description: >-
                If true, the rate returned is contingent on a membership number
                to be included within the sell request, typically a frequent
                guest or frequent flyer loyalty number.
            RateQualificationIDRequiredAtCheckIn:
              type: boolean
              description: >-
                If true, indicates the rate returned is contingent on
                qualification to be presented at check-in at the property; guest
                must show proof of qualifying, typically an ID for government,
                military, workplace, association, or membership.
    ReferenceListPropertyDates:
      description: >-
        Returned by default to consolidate common property details. Not returned
        if verboseResponseInd was set to true in the request.
      allOf:
        - $ref: '#/components/schemas/ReferenceList'
        - required:
            - PropertyDates
          properties:
            PropertyDates:
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/PropertyDates'
    PropertyDates:
      required:
        - DateRange
        - PropertyKey
        - id
      properties:
        '@type':
          type: string
          default: PropertyDates
        availability:
          $ref: '#/components/schemas/AvailabilityStatusEnum'
        adaCompliant:
          $ref: '#/components/schemas/YesNoUnknownEnum'
        id:
          type: string
          description: >-
            Key to matching the common information in ReferenceList with an
            Offer; corresponds to the propertyDatesRef value in each
            Offer/Products/Product.
        moreRatesToken:
          maxLength: 512
          type: string
          description: More rates token
        propertyName:
          maxLength: 128
          type: string
          description: Name of property offering these products.
        PropertyAddress:
          $ref: '#/components/schemas/Address'
        PropertyKey:
          $ref: '#/components/schemas/PropertyKey'
        DateRange:
          $ref: '#/components/schemas/DateRange'
        GeoLocation:
          $ref: '#/components/schemas/GeoLocation'
        Telephone:
          $ref: '#/components/schemas/Telephone'
        Email:
          $ref: '#/components/schemas/Email'
    CatalogOfferingHospitality:
      allOf:
        - $ref: '#/components/schemas/CatalogOffering'
        - properties:
            Sequence:
              minimum: 0
              exclusiveMinimum: false
              type: integer
              description: >-
                Sequence determines the order in which the offer shall be
                displayed to the customer
              format: int32
            NextSteps:
              $ref: '#/components/schemas/NextSteps'
            limitedAvailabilityInd:
              type: boolean
              description: If true the offering\/Offer has limited availability
    SearchByAddress:
      description: Search by city name, state/province, and country.
      allOf:
        - $ref: '#/components/schemas/SearchBy'
        - required:
            - SearchAddress
          properties:
            SearchAddress:
              $ref: '#/components/schemas/SearchAddress'
    SearchAddress:
      properties:
        City:
          maxLength: 128
          type: string
          description: >-
            Full name of a city, town, or postal station (i.e., a postal service
            territory, often used in a military address).
          example: Denver
        StateProv:
          $ref: '#/components/schemas/StateProv'
        Country:
          maxLength: 128
          type: string
          description: Country Code (typically 2 characters).
    SearchByAirport:
      description: Search by airport code.
      allOf:
        - $ref: '#/components/schemas/SearchBy'
        - required:
            - SearchAirport
          properties:
            SearchAirport:
              maxLength: 3
              minLength: 3
              pattern: ([a-zA-Z]{3})
              type: string
              description: An airport IATA code. Must be three alpha characters.
    SearchByCity:
      description: Search by city code.
      allOf:
        - $ref: '#/components/schemas/SearchBy'
        - required:
            - SearchCity
          properties:
            SearchCity:
              maxLength: 3
              minLength: 3
              pattern: ([a-zA-Z]{3})
              type: string
              description: >-
                A city IATA code. Must be three alpha characters. If no matching
                city code is found, airport search is automatically invoked.
    SearchByGeoLocation:
      description: Search by latitude and longitude.
      allOf:
        - $ref: '#/components/schemas/SearchBy'
        - required:
            - Latitude
            - Longitude
          properties:
            Latitude:
              type: number
              description: >-
                Numeric value representing latitude of search center point in
                degrees and decimal minutes.
              format: double
              example: 39.7392
            Longitude:
              type: number
              description: >-
                Numeric value representing longitude of search center point in
                degrees and decimal minutes.
              format: double
              example: -104.9903
    FeesDetail:
      description: Extended Fees object provides breakdown of individual Fees.
      allOf:
        - $ref: '#/components/schemas/Fees'
        - properties:
            Fee:
              maxItems: 100
              type: array
              description: Array of individual fees.
              items:
                $ref: '#/components/schemas/Fee'
    Fee:
      required:
        - FeeAmountOrPercent
      properties:
        '@type':
          type: string
          default: Fee
        feeCode:
          maxLength: 32
          type: string
          description: >-
            For Hotel, the Hotel provider's explanation of the fee; can be
            returned either as a code or as text. For Air, the code for the fee,
            such as OB for OB fees.
          example: '1011'
        reportingAuthority:
          maxLength: 32
          type: string
          description: Not used. Identifies the reporting authority.
          example: OPRA
        purpose:
          maxLength: 32
          type: string
          description: Not used. Fee purpose
          example: Service charge
        description:
          maxLength: 512
          type: string
          description: >-
            For Hotels, the Hotel provider's text explanation of the charge. For
            Air, any description for that fee code.
          example: Resort Fee
        feeApplication:
          $ref: '#/components/schemas/ApplicationEnum'
        feeFrequency:
          $ref: '#/components/schemas/FrequencyEnum'
        FeeAmountOrPercent:
          $ref: '#/components/schemas/FeeAmountOrPercent'
        Tax:
          maxItems: 5
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        includedinBaseInd:
          type: boolean
          description: If true, indicates the fee is included in Base Price.
        includedInTotalPriceInd:
          type: boolean
          description: >-
            If true, indicates the fee is included in Total Price. Default
            behavior is for fees not to be included in TotalPrice.
        collectionMethod:
          $ref: '#/components/schemas/ChangeFeeMethodEnum'
      description: >-
        Individual Fee object provides detailed information on the fee. In Air
        workflow, if OB-T fees are part of the price, those are detailed here.
        OB-T fees are ticketing fees independent of the form of payment. They
        are defined by the carrier and can be based on multiple criteria.
    FeeAmountOrPercent:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator. Child classes FeeAmountOrPercentAmount or
            FeeAmountOrPercentPercent
        application:
          $ref: '#/components/schemas/CommissionEnum'
      description: Defines whether the fee is charged as an amount or percentage.
      discriminator:
        propertyName: '@type'
    TaxesDetail:
      description: >-
        Taxes Detail contains the breakdown of individual Taxes that make up the
        summary total
      allOf:
        - $ref: '#/components/schemas/Taxes'
        - properties:
            Tax:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/Tax'
            TaxPercent:
              $ref: '#/components/schemas/TaxPercent'
    TaxPercent:
      properties:
        value:
          type: number
          description: The tax percentage amount.
          format: float
          example: 5.5
        taxCode:
          maxLength: 512
          type: string
          description: Any code for the tax.
          example: 971 - IRS Notice
        reportingAuthority:
          maxLength: 512
          type: string
          description: Tax reporting authority
          example: Georgia Department of Revenue
        purpose:
          maxLength: 512
          type: string
          description: Purpose of tax
          example: statutory tax
        description:
          maxLength: 4096
          type: string
          description: Description
          example: 1.5% of SGST
        includedInBase:
          $ref: '#/components/schemas/YesNoUnknownEnum'
      description: Returned when the tax is expressed as a percentage of the amount.
    SurchargesDetail:
      description: Extended class of Surcharges
      allOf:
        - $ref: '#/components/schemas/Surcharges'
        - description: A detailed breakdown of the summary surcharges
        - required:
            - Surcharge
          properties:
            Surcharge:
              maxItems: 100
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/Surcharge'
    Surcharges:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator. Child class SurchargesDetail
          example: SurchargesDetail
        TotalSurcharges:
          type: number
          description: A monetary amount, up to 4 decimal places.
          format: float
          example: 211.11
        approximateInd:
          type: boolean
          description: If true, the surcharge amounts are approximate.
          example: false
      description: >-
        In AirSearch workflow this applies to GDS only. Not supported for NDC,
        which does not return surcharges. Returned if surcharges apply to this
        offer. For GDS only, for a multi-city offer with stopovers (see
        multi-city offers with stopovers for details), surcharges and commission
        amounts are for the entire journey. For all other offers, the surcharges
        and commission amounts are for each leg (origin and destination pair). A
        multi-city offer can be identified by the jc in its CombinabilityCode:
        jc1, jc2. Surcharges can be omitted from the Search response with
        excludeSurchargesInd.
      discriminator:
        propertyName: '@type'
    ErrorWarningDetail:
      description: Detailed child class of ErrorWarning
      allOf:
        - $ref: '#/components/schemas/ErrorWarning'
        - required:
            - SourceID
          properties:
            category:
              maxLength: 128
              type: string
              description: A category to assist in identifying the error
              example: VALIDATION
            SourceID:
              maxLength: 128
              type: string
              description: The identifier of the source system sending the error or warning
            SourceCode:
              maxLength: 32
              type: string
              description: >-
                The error or warning code returned by the source airline or host
                system
            SourceDescription:
              maxLength: 4096
              type: string
              description: >-
                The error or warning message as it is returned by the source
                airline or host system
    ErrorWarning:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes ErrorWarning or ErrorWarningDetail
          example: ErrorWarning
        StatusCode:
          type: integer
          description: Http standard response code
          format: int32
          deprecated: true
        Message:
          maxLength: 4096
          type: string
          description: The Travelport standardized error or warning message
        NameValuePair:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/NameValuePair'
      discriminator:
        propertyName: '@type'
    ErrorDetail:
      description: Detailed child class of Error
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            category:
              maxLength: 128
              type: string
              description: A category to assist in identifying the error
              example: VALIDATION
            SourceID:
              maxLength: 128
              type: string
              description: The identifier of the source system sending the error or warning
              example: 1G
            SourceCode:
              maxLength: 32
              type: string
              description: >-
                The error or warning code returned by the source airline or host
                system
              example: '1234'
            SourceDescription:
              maxLength: 4096
              type: string
              description: >-
                The error or warning message as it is returned by the source
                airline or host system
    WarningDetail:
      description: Detailed child class of Warning
      allOf:
        - $ref: '#/components/schemas/Warning'
        - properties:
            category:
              maxLength: 128
              type: string
              description: A category to assist in identifying the error
              example: INFORMATION
            SourceID:
              maxLength: 128
              type: string
              description: The identifier of the source system sending the error or warning
              example: 1G
            SourceCode:
              maxLength: 32
              type: string
              description: >-
                The error or warning code returned by the source airline or host
                system
              example: '1234'
            SourceDescription:
              maxLength: 4096
              type: string
              description: >-
                The error or warning message as it is returned by the source
                airline or host system
    TravelAgencyDetail:
      description: The extended class of Travel Agency.
      allOf:
        - $ref: '#/components/schemas/TravelAgency'
        - properties:
            Telephone:
              maxItems: 50
              type: array
              description: Defines agency telephone information.
              items:
                $ref: '#/components/schemas/Telephone'
            Address:
              maxItems: 50
              type: array
              items:
                $ref: '#/components/schemas/Address'
            Email:
              maxItems: 50
              type: array
              items:
                $ref: '#/components/schemas/Email'
    AmountPercentAmount:
      description: T"his charge is applied as a fixed amount."
      allOf:
        - $ref: '#/components/schemas/AmountPercent'
        - properties:
            Amount:
              $ref: '#/components/schemas/CurrencyAmount'
    AmountPercent:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes AmountPercentAmount or AmountPercentPercent
          example: AmountPercentAmount
        application:
          $ref: '#/components/schemas/CommissionEnum'
      description: Parent object when amount is applied as an Amount or a Percent.
      discriminator:
        propertyName: '@type'
    AmountPercentPercent:
      description: This charge is applied as a percentage.
      allOf:
        - $ref: '#/components/schemas/AmountPercent'
        - properties:
            Percent:
              type: number
              description: Percent amount of commission
              format: float
              example: 20
    PenaltyAmount:
      description: >-
        Amount of penalty fee. Some NDC carriers may not return Penalty/Amount
        when a change is permitted, which means there is no charge for the
        change.
      allOf:
        - $ref: '#/components/schemas/Penalty'
        - properties:
            Amount:
              $ref: '#/components/schemas/CurrencyAmount'
    Penalty:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator. Child classes PenaltyAmount or PenaltyPercent
          example: PenaltyAmount
        application:
          $ref: '#/components/schemas/CommissionEnum'
      description: >-
        Returned in Change and Cancel objects to specify either a percentage or
        amount for a change or cancel penalty.
      discriminator:
        propertyName: '@type'
    PenaltyPercent:
      description: Percent of fare charged for the penalty.
      allOf:
        - $ref: '#/components/schemas/Penalty'
        - properties:
            Percent:
              type: number
              description: Percent of the fare charges for the penalty
              format: float
              example: 20
    PersonNameDetail:
      description: The extended class of Person Name.
      allOf:
        - $ref: '#/components/schemas/PersonName'
        - properties:
            personNameType:
              $ref: '#/components/schemas/NameTypeEnum'
            language:
              type: string
              description: '''ISO639 code of the language the name is represented '
              example: EN
            SurnamePrefix:
              maxLength: 32
              type: string
              description: The surname prefix
              example: Von
            Suffix:
              maxLength: 10
              type: string
              description: Hold various name suffixes and letters
              example: Jr.
            Title:
              maxLength: 32
              type: string
              description: Degree or honors
              example: DR
            Privacy:
              $ref: '#/components/schemas/Privacy'
            defaultInd:
              type: boolean
              description: >-
                If true, this is the default or primary name within a collection
                of names.
              example: true
    NameTypeEnum:
      type: string
      description: OTA Code
      enum:
        - Former
        - Nickname
        - Alternate
        - Maiden
    Privacy:
      properties:
        id:
          type: string
          description: Optional internally referenced id
          example: '2'
        shareMarketing:
          $ref: '#/components/schemas/YesNoInheritEnum'
        shareSync:
          $ref: '#/components/schemas/YesNoInheritEnum'
        optOutInd:
          $ref: '#/components/schemas/YesNoInheritEnum'
        optInStatus:
          $ref: '#/components/schemas/OptInStatusEnum'
        optInDate:
          type: string
          description: The datetime of receiving the opt in notice
          format: date-time
          example: '2026-08-07 12:12:00+00:00'
        optOutDate:
          type: string
          description: The datetime the opt out notice was received
          format: date-time
          example: '2026-08-07 12:12:00+00:00'
      description: Confidential details for marketing purpose
    TelephoneDetail:
      description: Extended class of Telephone
      allOf:
        - $ref: '#/components/schemas/Telephone'
        - properties:
            phoneLocationType:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: Location of the phone
              example: Agency
            phoneTechType:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: >-
                Indicates the type of technology associated with the telephone
                number
              example: Voice
            phoneUseType:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: >-
                Agency code for how phone is used (e.g., Home, Business,
                Emergency Contact, Travel Arranger, Day, Evening).
              example: Home
            pin:
              maxLength: 32
              type: string
              description: Additional codes used for telephone
              example: '3456'
            priority:
              type: integer
              description: Priority
              format: int32
              example: 1
            Privacy:
              $ref: '#/components/schemas/Privacy'
            Enum_TelephoneRole:
              $ref: '#/components/schemas/Enum_TelephoneRole'
            Comment:
              $ref: '#/components/schemas/Comment'
            defaultInd:
              type: boolean
              description: When true, indicates a default value should be used.
              example: true
            provisionedInd:
              type: boolean
              description: true indicates this phone number was created through provisioned
              example: false
    AddressDetail:
      description: The extended class of Address.
      allOf:
        - $ref: '#/components/schemas/Address'
        - properties:
            addressType:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: OTA code for address type
              example: CLT
            use:
              pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
              type: string
              description: OTA code for address use
              example: AUT
            Comment:
              $ref: '#/components/schemas/Comment'
            Privacy:
              $ref: '#/components/schemas/Privacy'
            Priority:
              type: integer
              description: The priority ranking within the group
              format: int32
              example: 1
            validInd:
              type: boolean
              description: >-
                If true, this is a valid and complete mailing address that has
                been verified through an address verification service or
                previously mailed materials have not been returned.
              example: false
            provisionedInd:
              type: boolean
              description: If true, this address came into the system through provisioning
              example: false
    DepartureDetail:
      description: Extended class of Departure
      allOf:
        - $ref: '#/components/schemas/Departure'
        - properties:
            terminal:
              maxLength: 4096
              pattern: ([0-9a-zA-Z]+)?
              type: string
              description: Departure/Arrival terminal
              example: Terminal 1
            country:
              pattern: '[a-zA-Z]{2}'
              type: string
              description: Country of to departure or arrival
              example: US
    Departure:
      required:
        - '@type'
        - date
        - location
        - time
      properties:
        '@type':
          type: string
          description: Discriminator classes Departure or DepartureDetail
          example: DepartureDetail
        location:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: Location of departure or arrival
          example: AMS
        date:
          type: string
          description: Local date of for arrival or departure
          format: date
          example: '0011-10-17'
        time:
          type: string
          description: Local time Date of for arrival or departure
          example: '04:45:00'
      discriminator:
        propertyName: '@type'
    ArrivalDetail:
      description: Extended class of Arrival.
      allOf:
        - $ref: '#/components/schemas/Arrival'
        - properties:
            terminal:
              maxLength: 4096
              pattern: ([0-9a-zA-Z]+)?
              type: string
              description: Departure/Arrival terminal
              example: Terminal 1
            country:
              pattern: '[a-zA-Z]{2}'
              type: string
              description: Country of to departure or arrival
              example: US
    Arrival:
      required:
        - '@type'
        - date
        - location
      properties:
        '@type':
          type: string
          description: Discriminator classes Arrival or ArrivalDetail
          example: ArrivalDetail
        location:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: Location of departure or arrival
          example: MAD
        date:
          type: string
          description: Local date of for arrival or departure
          format: date
          example: '0011-10-17'
        time:
          type: string
          description: Local time Date of for arrival or departure
          example: '04:45:00'
      discriminator:
        propertyName: '@type'
    FeeAmountOrPercentAmount:
      description: >-
        Indicates that this fee is applied as a fixed amount. In this case, the
        response will return the Amount object.
      allOf:
        - $ref: '#/components/schemas/FeeAmountOrPercent'
        - properties:
            Amount:
              $ref: '#/components/schemas/CurrencyAmount'
    FeeAmountOrPercentPercent:
      description: >-
        Indicates that this fee is applied as a percentage of the base amount.
        In this case, the response will return the Percent object.
      allOf:
        - $ref: '#/components/schemas/FeeAmountOrPercent'
        - properties:
            Percent:
              type: number
              description: The percentage of a base amount being charged for the fee.
              format: float
              example: 20
    CommissionAmount:
      description: >-
        Indicates that this commission is applied as a fixed amount. In this
        case, the response will return the Amount object.
      allOf:
        - $ref: '#/components/schemas/Commission'
        - properties:
            Amount:
              $ref: '#/components/schemas/CurrencyAmount'
    CommissionPercent:
      description: >-
        Indicates that this fee is applied as a percentage. In this case, the
        response will return the Percent object.
      allOf:
        - $ref: '#/components/schemas/Commission'
        - properties:
            Percent:
              type: number
              description: Percent amount of commission
              format: float
              example: 20
    ConfirmationHold:
      allOf:
        - $ref: '#/components/schemas/Confirmation'
        - properties:
            Locator:
              $ref: '#/components/schemas/Locator'
            OfferStatus:
              $ref: '#/components/schemas/OfferStatus'
            UnpricedSegmentsStatus:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/UnpricedSegmentsStatus'
            ShoppingCartProductStatus:
              $ref: '#/components/schemas/ShoppingCartProductStatusAir'
            OfferDocumentStatus:
              type: array
              items:
                $ref: '#/components/schemas/OfferDocumentStatus'
    Locator:
      properties:
        value:
          maxLength: 16
          pattern: ([A-Z0-9]+)?
          type: string
          description: >-
            "Reference number for locatorType.

            Booking.com returns a PIN number along with the confirmation number
            for each sold hotel segment. If the agent/traveler needs to
            reconcile the booking with Booking.com, Booking.com requires both
            the PIN number and confirmation number to locate the segment in
            their system."
          example: ZXG25P
        locatorType:
          maxLength: 32
          type: string
          description: >-
            Specifies the type of reservation ID

            Travelport - Confirmation number; PNR locator Agency - IATA Number
            Booking.com - Confirmation number; PIN number

            In Document History, may return the content source (e.g. GDS or NDC)
          example: Confirmation Number
        source:
          maxLength: 128
          type: string
          description: >-
            "Content source. Typically a two-character Supplier code that
            indicates the source system which generated the resid.

            For Hotels, if source matches chain code, the offer is directly with
            the supplier. If source is 'BO', the offer is with Booking.com."
          example: 1G
        sourceContext:
          maxLength: 128
          type: string
          description: >-
            Specifies the context of the source. Either Travelport, Agency, or
            Supplier.
          example: Travelport
        otaType:
          pattern: '[0-9A-Z]{1,3}(\.[A-Z]{3}(\.X){0,1}){0,1}'
          type: string
          description: Used for codes
          example: 14.UIT
        creationDate:
          type: string
          description: Date created in Travelport or supplier system in YYYY-MM-DD format.
          format: date
          example: '2026-03-01'
        lastUpdated:
          type: string
          description: The date and time stamp the Reservation was last updated.
          format: date-time
          example: '2026-08-07 12:12:00+00:00'
      description: >-
        Locator information for the reservation. Contains the locator (PNR or
        external locator) or cancellation number for the reservation, order, or
        offer.
    OfferStatus:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes OfferStatus, OfferStatusAir,
            OfferStatusAncillary, OfferStatusHospitality, OfferStatusVehicle
          example: OfferStatus
      discriminator:
        propertyName: '@type'
    UnpricedSegmentsStatus:
      required:
        - '@type'
        - StatusAir
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: UnpricedSegmentsStatus
        StatusAir:
          maxItems: 10
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/StatusAir'
      description: Status of the unpriced flight segment
    StatusAir:
      properties:
        value:
          $ref: '#/components/schemas/OfferStatusEnum'
        flightRefs:
          type: array
          description: The flightRefs the status is applicable to within the Offer
          items:
            type: string
        code:
          maxLength: 32
          type: string
          description: Status code
        pastDateInd:
          type: boolean
          description: If true, the flight is considered to be past date
          example: true
    OfferStatusEnum:
      type: string
      description: Status of an offer.
      example: Confirmed
      enum:
        - Confirmed
        - Cancelled
        - Pending
        - Modifed
        - Rejected
        - Waitlisted
    ShoppingCartProductStatusAir:
      allOf:
        - $ref: '#/components/schemas/ShoppingCartProductStatus'
        - properties:
            StatusAir:
              maxItems: 10
              type: array
              items:
                $ref: '#/components/schemas/StatusAir'
    ShoppingCartProductStatus:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator classes ShoppingCartProductStatus or
            ShoppingCartProductStatusAir
          example: ShoppingCartProductStatusAir
      discriminator:
        propertyName: '@type'
    OfferDocumentStatus:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Status of Offer completion.
          example: OfferDocumentStatus
        Status:
          $ref: '#/components/schemas/ReservationOfferStatusEnum'
        TravelerDocumentStatus:
          maxItems: 20
          type: array
          description: Status of Offer completion by Traveler.
          items:
            $ref: '#/components/schemas/TravelerDocumentStatus'
    TravelerDocumentStatus:
      properties:
        value:
          $ref: '#/components/schemas/ReservationOfferStatusEnum'
        travelerRefs:
          type: array
          description: The traveler associated to the document status.
          example: traveler_001
          items:
            type: string
            example: traveler_001
      description: Status of Offer completion by Traveler.
    ReceiptPayment:
      allOf:
        - $ref: '#/components/schemas/Receipt'
        - properties:
            PaymentIdentifier:
              $ref: '#/components/schemas/PaymentIdentifier'
            SecondPaymentIdentifier:
              $ref: '#/components/schemas/IdentifierRef'
            ThirdPaymentIdentifier:
              $ref: '#/components/schemas/IdentifierRef'
            Document:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/Document'
            depositInd:
              type: boolean
              description: if true, the receipt is for a deposit or prepayment
            guaranteeInd:
              type: boolean
              description: >-
                if true, the receipt is for a guarantee only. Guarantee rules
                are in accordance with the Offer TermsAndConditions.
    PaymentIdentifier:
      properties:
        '@type':
          type: string
          example: Payment
        id:
          type: string
        PaymentRef:
          type: string
        Identifier:
          $ref: '#/components/schemas/Identifier'
      description: Payment Identifier object.
    Document:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: >-
            Discriminator class DocumentTicket, DocumentTicketExchange,
            DocumentTicketRefund, DocumentTicketRetained, DocumentTicketVoid,
            DocumentEMD, DocumentEMDExchange, DocumentEMDRefund,
            DocumentEMDVoid, DocumentMCO, DocumentMCOExchange,
            DocumentMCORefund, DocumentMCOVoid, DocumentForfeit,
            DocumentAgencyServiceFee, DocumentAgencyServiceFeeVoid
          example: DocumentTicket
        nonTravelportInd:
          type: boolean
          description: If true, this document was issued outside of Travelport systems.
        Number:
          maxLength: 32
          type: string
          description: The identifying number of the document
          example: '1259900123457'
        TravelerIdentifierRef:
          $ref: '#/components/schemas/TravelerIdentifierRef'
        Amount:
          $ref: '#/components/schemas/Amount'
        WaiverCode:
          $ref: '#/components/schemas/WaiverCode'
        Commission:
          $ref: '#/components/schemas/Commission'
        CumulativeValue:
          $ref: '#/components/schemas/CumulativeValue'
        IssuingPCC:
          maxLength: 10
          minLength: 2
          pattern: ([a-zA-Z0-9]{2,10})
          type: string
          description: Document issuing pcc
          example: India RPO
        IssuingIATA:
          pattern: ([0-9]{8})
          type: string
          description: Document issuing IATA
          example: '12387498'
        IssuingCity:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: Document issuing city
          example: NYK
        FiledAmount:
          $ref: '#/components/schemas/FiledAmount'
        contentSource:
          $ref: '#/components/schemas/ContentSourceEnum'
      discriminator:
        propertyName: '@type'
    WaiverCode:
      properties:
        value:
          maxLength: 128
          type: string
        reasonCode:
          type: integer
          description: A code assigned to identify the reason for disruption
          format: int32
          example: 2
        waiverType:
          $ref: '#/components/schemas/WaiverTypeEnum'
      description: >-
        A code assigned by an airline to support waiver of fees or ticket value
        as a result of disruption to the passenger.
    WaiverTypeEnum:
      type: string
      description: List of waiver types.
      example: ChangePenalty
      enum:
        - ChangePenalty
        - PriceDifference
        - ChangePenaltyAndPriceDifference
        - RefundPenalty
        - NameChangePenalty
    CumulativeValue:
      properties:
        '@type':
          type: string
          example: CumulativeValue
        currencySource:
          $ref: '#/components/schemas/CurrencySourceEnum'
        CurrencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        Base:
          type: number
          description: >-
            The price prior to all applicable taxes of a product such as the
            rate for a room or fare for a flight.
          format: float
          example: 120.2
        Taxes:
          $ref: '#/components/schemas/Taxes'
        Fees:
          $ref: '#/components/schemas/Fees'
        Total:
          type: number
          description: Specifies the total price including base + taxes + fees
          format: float
          example: 30.13
        approximateInd:
          type: boolean
          description: True if this amount has been converted from the original amount
          example: true
      description: >-
        Used to show the cumulative value of a document when it has been
        exchanged multiple times
    ReceiptCancellation:
      allOf:
        - $ref: '#/components/schemas/Receipt'
        - properties:
            Cancellation:
              $ref: '#/components/schemas/Cancellation'
    Cancellation:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes CancellationHold or CancellationHospitality
          example: CancellationHold
      discriminator:
        propertyName: '@type'
    CancellationHold:
      allOf:
        - $ref: '#/components/schemas/Cancellation'
        - properties:
            Locator:
              $ref: '#/components/schemas/Locator'
    AppliesToOffer:
      allOf:
        - $ref: '#/components/schemas/AppliesTo'
        - properties:
            OfferIdentifier:
              maxItems: 1000
              type: array
              items:
                $ref: '#/components/schemas/OfferIdentifier'
    AppliesToOfferProduct:
      allOf:
        - $ref: '#/components/schemas/AppliesTo'
        - properties:
            OfferIdentifier:
              $ref: '#/components/schemas/OfferIdentifier'
            ProductIdentifier:
              maxItems: 100
              type: array
              items:
                $ref: '#/components/schemas/ProductIdentifier'
    CustomAuxiliarySegment:
      allOf:
        - $ref: '#/components/schemas/CustomAuxiliarySegmentID'
        - required:
            - Date
            - Location
            - Quantity
            - SegmentType
            - StatusCode
            - SupplierCode
          properties:
            SegmentType:
              maxLength: 3
              pattern: ([A-Z]+)?
              type: string
              description: The auxiliary segment type. SUR, TUR
              example: TUR
            SupplierCode:
              pattern: ([a-zA-Z0-9]{2})
              type: string
              description: The supplier code application to this segment.
              example: YY
            StatusCode:
              maxLength: 2
              pattern: ([A-Z]+)?
              type: string
              example: BK
            Quantity:
              type: integer
              description: The quantity of services provided for this auxiliary segment.
              format: int32
              example: 1
            Location:
              maxLength: 3
              minLength: 3
              pattern: ([a-zA-Z]{3})
              type: string
              description: >-
                Three character IATA location code relevant to the auxiliary
                segment.
              example: LON
            Date:
              type: string
              description: The local date relevant to the auxiliary segment.
              format: date
            CustomTextQualifier:
              maxLength: 3
              pattern: ([0-9a-zA-Z]+)?
              type: string
              description: Text qualifier such as DO for drop off.
              example: DO
            CustomText:
              maxLength: 115
              type: string
              description: Custom text relevant to this auxiliary segment.
    DocumentAgencyServiceFee:
      allOf:
        - $ref: '#/components/schemas/Document'
        - properties:
            RelatedDocumentNumber:
              $ref: '#/components/schemas/DocumentNumber'
    TravelDocumentDetail:
      description: The extended class of Traveler Document.
      allOf:
        - $ref: '#/components/schemas/TravelDocument'
        - properties:
            IssuedForGeoPoliticalArea:
              $ref: '#/components/schemas/GeoPoliticalArea'
            Address:
              $ref: '#/components/schemas/Address'
    GeoPoliticalArea:
      properties:
        value:
          maxLength: 32
          type: string
          example: G
        level:
          $ref: '#/components/schemas/GeoPoliticalAreaLevelEnum'
        id:
          type: string
          description: Optional internally referenced id
          example: '2'
      description: The location code of the geographical location. Codes from Ref Pub
    GeoPoliticalAreaLevelEnum:
      type: string
      description: Represents the type of geopolitical area (country, Continent, State etc)
      example: Continent
      enum:
        - World
        - Global Area
        - Continent Group
        - Continent
        - Country
        - StateProvince
        - City
        - Airport
    OfferStatusHospitality:
      description: Status associated to the sold hotel segment.
      allOf:
        - $ref: '#/components/schemas/OfferStatus'
        - properties:
            consumedInd:
              type: boolean
              description: >-
                If true, the hotel offer has already been consumed and is for
                information only.
              example: true
            code:
              maxLength: 2
              type: string
              description: The booking status code. HK, MK
              example: MK
            Status:
              $ref: '#/components/schemas/OfferStatusEnum'
    FormOfPaymentCash:
      description: Form Of Payment is by Cash
      allOf:
        - $ref: '#/components/schemas/FormOfPaymentID'
        - properties:
            agentNonRefundableInd:
              type: boolean
              description: This indicates that the Cash payment should not be refunded
            Comment:
              maxLength: 35
              type: string
              deprecated: true
            FreeText:
              maxLength: 35
              type: string
            miscellaneousInd:
              type: boolean
              description: If true, the form of payment type is MS, miscellaneous
    FormOfPaymentPaymentCard:
      description: >-
        Defines the payment details included when the form of payment is by
        payment card.
      allOf:
        - $ref: '#/components/schemas/FormOfPaymentID'
        - properties:
            PaymentCard:
              $ref: '#/components/schemas/PaymentCard'
            inhibitPaymentCardAuthorizationInd:
              type: boolean
              description: >-
                If true, the payment card will not go through card authorization
                process
            notValidForPaymentInd:
              type: boolean
              description: >-
                If true, the payment card has been masked and is not valid for
                making payments
            ExtendedPayment:
              $ref: '#/components/schemas/ExtendedPayment'
    PaymentCard:
      required:
        - '@type'
      properties:
        '@type':
          type: string
          description: Discriminator classes PaymentCard or PaymentCardDetail
          example: PaymentCard
        id:
          type: string
          description: Payment card reference ID.
          example: paymentCard_01
        effectiveDate:
          type: string
          description: Indicated starting date.
          format: date
        expireDate:
          pattern: (0[1-9]|1[0-2])[0-9][0-9]
          type: string
          description: Card expiration date in MMYY format.
          example: 558
        approvalCode:
          maxLength: 16
          pattern: ([A-Z0-9]+)?
          type: string
          description: The approval code value
          example: C59
        PrivacyGroup:
          $ref: '#/components/schemas/Privacy'
        CardType:
          $ref: '#/components/schemas/PaymentCardTypeEnum'
        CardCode:
          maxLength: 2
