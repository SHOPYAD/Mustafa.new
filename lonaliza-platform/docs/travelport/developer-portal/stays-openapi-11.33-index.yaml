openapi: 3.0.0
info:
  title: TripServices Stays
  description: >-
    The TripServices Stay v11 APIs are a robust, flexible set of RESTful JSON
    endpoints that empower developers to build seamless, beautiful hotel booking
    experiences with global reach and real-time data. Built for developers, our
    APIs are designed to integrate easily into your applications, enabling you
    to build rich, responsive hotel booking interfaces tailored to your users.
  version: 11.33.0
servers:
  - url: https://api.pp.travelport.net/11
  - url: https://api.travelport.net/11
security:
  - bearerAuth: []
tags:
  - name: Search and Details
    description: Hotel searches.
  - name: Availability
    description: Hotel availability and pagination.
  - name: Rules
    description: Reference payload and full payload hotel rules.
  - name: Reservations
    description: Create, modify and cancel hotel reservations.
paths:
  /hotel/search/propertiesdetail:
    get:
      tags:
        - Search and Details
      summary: Return hotel details.
      description: >-
        The Hotel Details request retrieves, for a specified property, a
        additional property-level information such as description and images
        provided by the supplier. It is an optional request and does not need to
        be preceded by a Hotel Search request.
      operationId: GetPropertiesDetail
      parameters:
        - name: chainCode
          in: query
          description: The chain code of the requested property.
          required: true
          schema:
            maxLength: 5
            minLength: 2
            pattern: ([a-zA-Z0-9]{2,5})
            type: string
          example: HL
        - name: propertyCode
          in: query
          description: >-
            The property code of the requested property (typically 5
            characters).
          required: true
          schema:
            maxLength: 32
            type: string
        - name: ImageSize
          in: query
          description: The size of the images to return.
          required: false
          schema:
            $ref: '#/components/schemas/ImageSizeEnum'
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/search/properties/search:
    post:
      tags:
        - Search and Details
      summary: Search hotels by location.
      description: >-
        The Search by Location request searches for hotels by any one of these:
        1) geographic coordinates, 2) address, 3) IATA airport code, or 4) IATA
        city code. Although you can search by various criteria, all responses
        return results in the same format. The response returns up to 100
        properties, or all available properties if less than 100. If more than
        100 properties matching the search criteria are available, you can
        request the next page of results with the Search Pagination API.
      parameters:
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertiesQuerySearchWrapper'
        required: true
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/search/properties:
    post:
      tags:
        - Search and Details
      summary: Search hotels by property ID.
      description: >-
        The Search by ID request searches for specific hotels by their property
        ID. You can send up to 250 property IDs. The response returns a list of
        properties based on the ID/s sent. The Search by ID response format is
        the same as for Search by Location. The response returns up to 100
        properties, or all requested properties if less than 100. If more than
        100 properties were requested and are available, you can request the
        next page with the Search Pagination API.
      operationId: Create
      parameters:
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertiesQuerySpecificPropertyListWrapper'
        required: true
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponseWrapper'
        '201':
          description: Created - 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/search/properties/{identifier}:
    get:
      tags:
        - Search and Details
      summary: Return additional search results (pagination).
      description: >-
        Return additional search results. The v11 hotel search APIs (Search by
        Location and Search by ID) use pagination by default. Search responses
        return up to 100 properties in the initial response, or all available
        properties if fewer than 100. The search response notes the total number
        of properties found and includes an identifier to be used for retrieving
        additional pages. If the search response indicates that more than 100
        properties are available, you can use this Search Pagination request to
        retrieve each additional page of 100 properties until all available
        properties have been retrieved.
      operationId: GetPropertiesPage
      parameters:
        - name: identifier
          in: path
          description: The Identifier of the Properties from which a page is to be returned
          required: true
          schema:
            maxLength: 128
            type: string
        - name: pageNumber
          in: query
          description: >-
            The page number of the page of results to retrieve (e.g., second
            page is pageNumber=2, etc.). The Search by ID or Search by Location
            response returns page 1, so values here should be between 2 and 5
            inclusive. You are not required to retrieve pages consecutively.
          required: true
          schema:
            type: string
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/availability/catalogofferingshospitality:
    post:
      tags:
        - Availability
      summary: Return hotel availability.
      description: >-
        Hotel Availability returns room types and rates available at one or more
        specified properties on specified dates.
      operationId: CreateHotelAvailability
      parameters:
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
