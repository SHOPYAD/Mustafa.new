          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/CatalogOfferingsQueryRequestHospitalityWrapper
        required: true
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/CatalogOfferingsHospitalityResponseWrapper
        '201':
          description: Created - 201
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/CatalogOfferingsHospitalityResponseWrapper
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
