  /hotel/availability/catalogofferingshospitality/{identifier}:
    get:
      tags:
        - Availability
      summary: Return additional availability results (pagination).
      description: >-
        Return additional availability results. The Hotel Availability response
        uses pagination by default. The response notes the total number of rates
        found and, if greater than 100, also returns a pagination identifier
        that can be used for retrieving additional pages of results using this
        Availability Pagination request. You can send an Availability Pagination
        request to retrieve each additional page of 100 rates until all
        available rates have been retrieved. NOTE: Availability results are
        cached for 30 minutes. You cannot retrieve additional results from that
        Availability response after it expires.
      operationId: GetHotelAvailabilityPage
      parameters:
        - name: identifier
          in: path
          description: >-
            The Identifier of the CatalogOfferings from which a page is to be
            returned
          required: true
          schema:
            maxLength: 128
            type: string
        - name: pageNumber
          in: query
          description: >-
            The page number of the page of availability results to retrieve
            (e.g., second page is pageNumber=2, etc.). The Availability response
            returns page 1, so values here should be between 2 and 5 inclusive.
            You are not required to retrieve pages consecutively.
          required: true
          schema:
            type: string
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: travelportPlusSessionIdentifier
          in: header
          description: >-
            travelportPlusSessionIdentifier used to maintain an established
            agency session
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 100
            minLength: 0
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 49f58f5f-c443-43b4-9f5d-be405fd00a01
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/CatalogOfferingsHospitalityResponseWrapper
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/rules/offershospitality/buildfromcatalogoffering:
    post:
      tags:
        - Rules
      summary: Return hotel rules (reference payload).
      description: >-
        Available January 2023. Hotel Rules retrieves the rules associated with
        a specific rate. The reference payload references an offer by sending
        the unique offer ID from an Availability response, instead of sending
        all required offer details as in the full payload Rules request. The
        response for both the reference and full payload is the same.
      operationId: BuildHotelRulesFromCatalogOffering
      parameters:
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferQueryBuildFromCatalogOfferingWrapper'
        required: true
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferHospitalityResponseWrapper'
        '201':
          description: Created - 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferHospitalityResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/rules/offershospitality/buildfromrequest:
    post:
      tags:
        - Rules
      summary: Return hotel rules (full payload).
      description: >-
        Hotel Rules retrieves the rules associated with a specific rate. The
        full payload request in this topic sends all required rate details,
        while the reference payload Rules request references rate details from a
        previous Availability response by sending the offer ID from that
        response. The response for both the reference and full payload is the
        same.
      operationId: CreateHotelRules
      parameters:
