                $ref: '#/components/schemas/ReservationResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/book/reservations/{reservationIdentifier}/passive:
    put:
      tags:
        - Reservations
      summary: Add passive reservation to a booking.
      description: >-
        Use the Add Passive Reservation request to add a passive hotel booking
        segment to an existing reservation. You can add either of two types of
        passive segments to an existing reservation: 1) Sending full details of
        the room in the request adds a single hotel segment with a status of MK
        (confirmed passive) to the reservation, or, 2) Sending only dates in the
        request, which adds a placeholder segment to the reservation. You may
        want to add a placeholder if you do not have all booking details. Or,
        you can send only dates to add a dummy or retention segment, which can
        be used to keep the reservation details active in the system after
        travel is complete, up to the dates on the passive segment. Placeholder
        segments return a status of AK. (A passive hotel segment is any segment
        that is booked using anything other than a product that uses the
        Travelport GDS. Passive segments are informational only. They do not
        result in a reservation or a change in inventory. Information on a
        passive segment is not received from or passed to the hotel supplier.
        Instead, passive segments provide a way to consolidate all booking
        information, including details from direct hotel bookings or even phone
        reservations.)
      operationId: AddPassiveOffer
      parameters:
        - name: reservationIdentifier
          in: path
          required: true
          schema:
            maxLength: 128
            type: string
        - name: Locator
          in: query
          required: false
          schema:
            maxLength: 32
            type: string
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
            tracking id for a single request and response.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 89
            minLength: 10
            pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
            type: string
            example: TraceID_123456789
        - name: XAUTH_TRAVELPORT_ACCESSGROUP
          in: header
          description: >-
            Identifies the Travelport access group with which the caller is
            associated
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: ([a-zA-Z-0-9-_]*)
            type: string
            example: 19Y88702-C27A-4E5D-829A-89D7016688B1
        - name: TVP-PCC-Core
          in: header
          description: Allows user to pass PCC instead of Access Group ID
          required: false
          style: simple
          explode: false
          schema:
            pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
            type: string
            example: DU7_1G
        - name: TVP-Correlation-Id
          in: header
          description: >-
            Identifier used to correlate hotel API invocations across a
            multi-call business flow.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            example: 382c74c3-721d-4f34-80e5-57657b6cbc27
        - name: Accept-Encoding
          in: header
          description: >-
            Comma-separated list of acceptable encodings like gzip and/or
            deflate
          required: true
          schema:
            type: string
            example: gzip, deflate
      responses:
        '200':
          description: OK - Successful Response - 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /hotel/book/reservations/{reservationIdentifier}/passiveupdate:
    put:
      tags:
        - Reservations
      summary: Modify passive hotel reservation.
      description: >-
        Use Modify Passive Reservation to update any parameter within an MK
        passive hotel booking segment of an existing reservation. MK designates
        a confirmed passive segment, while AK is used for placeholder-only
        segments. (A passive hotel segment is any segment that is booked using
        anything other than a product that uses the Travelport GDS. Passive
        segments are informational only. They do not result in a reservation or
        a change in inventory. Information on a passive segment is not received
        from or passed to the hotel supplier. Instead, passive segments provide
        a way to consolidate all booking information, including details from
        direct hotel bookings or even phone reservations.)
      operationId: UpdatePassiveOffer
      parameters:
        - name: reservationIdentifier
          in: path
          required: true
          schema:
            maxLength: 128
            type: string
        - name: Locator
          in: query
          required: false
          schema:
            maxLength: 32
            type: string
        - name: TraceId
          in: header
          description: >-
            Used in hospitality workflows to provide a Unique transaction or
