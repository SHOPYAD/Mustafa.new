        AlternateHotelEmail:
          type: array
          description: >-
            The alternate hotel email to be used for correspondence with this
            virtual payment
          items:
            $ref: '#/components/schemas/Email'
        AgencyEmail:
          type: array
          description: >-
            The agency email to be used for correspondence with this virtual
            payment
          items:
            $ref: '#/components/schemas/Email'
        PaymentComment:
          maxLength: 512
          type: string
          description: Optional text to be sent to the supplier
        AlternateHotelFax:
          type: array
          description: >-
            Hotel fax number to be used if the hotel fax is unknown or not
            provided in Property details
          items:
            $ref: '#/components/schemas/Telephone'
        MaximumChargeableAmount:
          type: array
          description: >-
            The maximum amount that the supplier may charge to the payment card
            including room rate and any incidentals specified
          items:
            $ref: '#/components/schemas/CurrencyAmount'
        IncidentalCharges:
          type: array
          description: >-
            List of incidentals that are permitted to be charged to the virtual
            payment card.
          example:
            - BAR
            - BUS
            - CRB
          items:
            maxLength: 32
            type: string
        DeploymentID:
          maxLength: 30
          type: string
