    FormOfPaymentFlightPass:
      description: Form Of Payment is by Flight Pass
      allOf:
        - $ref: '#/components/schemas/FormOfPaymentID'
        - required:
            - FlightPass
          properties:
            FlightPass:
              maxItems: 10
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/FlightPass'
    FlightPass:
      required:
        - '@type'
        - accountNumber
        - supplier
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes
          example: FlightPass
        accountNumber:
          maxLength: 30
          type: string
          description: The flight pass account number
          example: 140851633093
        supplier:
          pattern: ([a-zA-Z0-9]{2,3})
          type: string
          description: The flight pass supplier code
          example: AC
        Description:
          maxItems: 5
          type: array
          items:
            maxLength: 128
            type: string
            description: Optional program name or description of the flight pass.
            example: FlightPass
        TravelerIdentifierRef:
          maxItems: 10
          type: array
          description: >-
            In Search, use the passengerCriteriaRef to reference the owner of
            the flightpass. This is a mandatory field for Search API.
          items:
            $ref: '#/components/schemas/TravelerIdentifierRef'
    FormOfPaymentCheck:
      description: Form Of Payment is by Check
      allOf:
        - $ref: '#/components/schemas/FormOfPaymentID'
        - properties:
            checkInd:
              type: boolean
              description: If true, the form of payment type is check
    Flight:
      description: Common flight properties.
      allOf:
        - $ref: '#/components/schemas/FlightID'
        - required:
            - Arrival
            - Departure
            - carrier
            - number
          properties:
            distance:
              type: integer
              description: Distance covered by the flight.
              format: int32
              example: 6574
            stops:
              type: integer
              description: Number of stops
              format: int32
              example: 2
            duration:
              type: string
              description: Elapsed flight time represented in ISO 8601 format.
              example: PT1H40M
            carrier:
              pattern: ([a-zA-Z0-9]{2,3})
              type: string
              description: The airline code
              example: BA
            number:
              pattern: '[0-9]{1,4}[A-Z]?|OPEN|ARNK'
              type: string
              description: The marketing carrier flight number
              example: '98'
            operatingCarrier:
              pattern: ([a-zA-Z0-9]{2,3})
              type: string
              description: >-
                The operating airline code. Shown in codeshare situations when
                the operating carrier is different to the marketing carrier.
              example: BA
            operatingCarrierName:
              maxLength: 128
              type: string
              description: The operating carrier name
              example: Liberty Aerospace
            operatingCarrierNumber:
              pattern: '[0-9]{1,4}[A-Z]?|OPEN|ARNK'
              type: string
              description: >-
                Operating airline flight number. If there is no operating
                carrier number, then CO2 emission estimates for operating
                carriers is not supported. GDS only; not returned for NDC.
                Returned only in Search response.
              example: 91
            equipment:
              pattern: ([A-Z0-9]{3})?
              type: string
              description: >-
                Equipment model. Note that TRN, TRS, and BUS equipment codes
                indicate ground transportation.
              example: '777'
            Departure:
              $ref: '#/components/schemas/Departure'
            Arrival:
              $ref: '#/components/schemas/Arrival'
            IntermediateStop:
              maxItems: 9
              type: array
              items:
                $ref: '#/components/schemas/IntermediateStop'
            subjectToGovernmentApprovalInd:
              type: boolean
              description: >-
                If true, the airline has filed in its schedule that availability
                for a specific flight is subject to government approval. GDS
                only, not supported for NDC. Returned only in the Air Search API
                response.
              example: true
    IntermediateStop:
      properties:
        value:
          maxLength: 3
          minLength: 3
          pattern: ([a-zA-Z]{3})
          type: string
          description: >-
            The IATA airport code for the airport where the intermediate stop
            occurs.
        arrivalFlightDuration:
          type: string
          description: >-
            Duration in hours and minutes of the flight arriving at the
            intermediate stop. ISO 8601 format
          example: PT2H35M
        departureFlightDuration:
          type: string
          description: >-
            Duration in hours and minutes of the flight departing the
            intermediate stop. ISO 8601 format
          example: PT1H35M
        duration:
          type: string
          description: >-
            Duration in hours and minutes between the arrival and departure at
            the intermediate stop. ISO 8601 format
          example: PT1H35M
        equipment:
          pattern: ([A-Z0-9]{3})?
          type: string
          description: Equipment model, if there is a change of equipment during the stop.
          example: '777'
        arrivalDate:
          pattern: (\d{4}-\d{2}-\d{2})
          type: string
          description: The local date the aircraft arrives at the intermediate stop
          example: '2026-04-30'
        departureDate:
          pattern: (\d{4}-\d{2}-\d{2})
          type: string
          description: The local date the aircraft departs from the intermediate stop
          example: '2026-04-30'
        arrivalTime:
          pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9]):([0-5]?[0-9])$
          type: string
          description: The local time the aircraft arrives at the intermediate stop
          example: '68400'
        departurelTime:
          pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9]):([0-5]?[0-9])$
          type: string
          description: The local time the aircraft departs from the intermediate stop
          example: '72000'
        arrivalTerminal:
          maxLength: 4096
          pattern: ([0-9a-zA-Z]+)?
          type: string
          description: Arrival terminal of the intermediate stop airport
          example: Terminal2
        departureTerminal:
          maxLength: 4096
          pattern: ([0-9a-zA-Z]+)?
          type: string
          description: Departure terminal of the intermediate stop airport
          example: Terminal4
      description: >-
        Returned if the flight has a technical stop but does not incur a change
        in flight number. Returned in the Search, AirPrice, Exchange Search
        responses. Not returned for Ancillary Shop or Fare Rules.
    Brand:
      description: Information on airline Brand offerings
      allOf:
        - $ref: '#/components/schemas/BrandID'
        - required:
            - name
          properties:
            name:
              maxLength: 128
              type: string
              description: The name of the brand marketed by the airline.
              example: Main Cabin Extra
            tier:
              type: integer
              description: The brand tier. Not returned for NDC.
              format: int32
              example: 2
            shelfNumbers:
              type: array
              description: >-
                ATPCO shelf number. If the carrier has provided it for this
                brand, the shelf number is the number for a grouping of
                comparable brands that share similar ticket and flight
                attributes.
              example:
                - 1
                - 4
                - 5
              items:
                type: integer
                format: int32
            code:
              maxLength: 32
              type: string
              description: The ATPCO Brand Code.
              example: REFMAIN
            BrandAttribute:
              maxItems: 100
              type: array
              description: >-
                Array of enumerated features that are included, chargeable, or
                not offered for this brand. Contains one or more instances of
                the two paired key value pairs classification and inclusion.
              items:
                $ref: '#/components/schemas/BrandAttribute'
            AdditionalBrandAttribute:
              maxItems: 15
              type: array
              description: >-
                Array of non-enumerated features that are included, chargeable,
                or not offered for this brand. Contains one or more instances of
                the two paired key value pairs classification and inclusion.
              items:
                $ref: '#/components/schemas/AdditionalBrandAttribute'
            ImageURL:
              maxItems: 10
              type: array
              example:
                - http:/imageurl.com
              items:
                type: string
    BrandAttribute:
      required:
        - '@type'
        - classification
        - inclusion
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: BrandAttribute
        classification:
          $ref: '#/components/schemas/BrandClassificationEnum'
        inclusion:
          $ref: '#/components/schemas/BrandInclusionEnum'
        ImageURL:
          maxItems: 10
          type: array
          description: URL for an image for the brand, when available.
          example:
            - http:/imageurl.com
          items:
            type: string
        matchedAttributeInd:
          type: boolean
          description: >-
            Returned only if true for any attribute requested in
            ProductInclusionPreference.Classification.
          example: true
        groupCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: Carrier group code. Returned if filed by the carrier.
          example: BG
        subGroupCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: Carrier sub group code. Returned if filed by the carrier.
          example: CY
        subCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: Carrier sub code. Returned if filed by the carrier.
          example: 08A
      description: Brand features.
    BrandClassificationEnum:
      type: string
      description: >-
        The Travelport classification used for a category of ancillaries.
        Additional items can be sent in AdditionalClassification
      example: CarryOn
      enum:
        - CheckedBag
        - CarryOn
        - PersonalItem
        - Rebooking
        - Refund
        - SeatAssignment
        - PremiumSeat
        - LieFlatSeat
        - Meals
        - WiFi
        - Other
    BrandInclusionEnum:
      type: string
      description: The indicator as to how the brand and the product are associated.
      example: Included
      enum:
        - Included
        - Chargeable
        - Not Offered
      x-enumDescriptions:
        Included: Attribute is included in the brand at no additional charge.
        Chargeable: Attribute is available for the brand at a cost.
        NotOffered: Attribute is not available for this brand.
    AdditionalBrandAttribute:
      required:
        - '@type'
        - Classification
        - Inclusion
      properties:
        '@type':
          type: string
          description: Discriminator. No child classes.
          example: AdditionalBrandAttribute
        Classification:
          maxLength: 512
          type: string
          description: >-
            The Travelport classification used for categories of ancillaries.
            Supported attributes currently include ChauffeurTransfer,
            ExtraLegroom, InFlightEntertainment, LoungeAccess, PriorityBaggage,
            PriorityBoarding, PriorityCheckIn, PrioritySecurity,
            PriorityServices,MileageAccrual, Upgrades, USB.
          example: ChauffeurTransfer
        Inclusion:
          $ref: '#/components/schemas/BrandInclusionEnum'
        ImageURL:
          maxItems: 10
          type: array
          description: URL for an image for the brand, when available.
          example:
            - https:/travelport/image/profile/firstviewimage
          items:
            type: string
        matchedAttributeInd:
          type: boolean
          description: >-
            Returned only if true for any attribute requested in
            ProductInclusionPreference.Classification.
          example: true
        groupCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: Carrier group code. Returned if filed by the carrier.
          example: BG
        subGroupCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: Carrier sub group code. Returned if filed by the carrier.
          example: CY
        subCode:
          maxLength: 10
          pattern: ([A-Z0-9]+)?
          type: string
          description: Carrier sub code. Returned if filed by the carrier.
          example: 08A
      description: Additional brand features. Non - enumerated list.
    ChangeFeeMethodEnum_Base:
      type: string
      description: List of change fee method
      example: EMD
      enum:
        - EMD
        - MCO
        - Tax
        - Unknown
  responses:
    BadRequest:
      description: Bad Request - 400
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - 401
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: Payment Required - 402
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - 403
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found - 404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error - 500
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        Service Unavailable - 503. This error may be returned when the service
        is temporarily unavailable due to infrastructure or network issues.
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            type: object
            additionalProperties: true
  parameters:
    TraceId:
      name: TraceId
      in: header
      description: >-
        Used in hospitality workflows to provide a Unique transaction or
        tracking id for a single request and response.
      required: false
      style: simple
      explode: false
      schema:
        maxLength: 89
        minLength: 10
        pattern: (^[a-zA-Z-0-9_]*[-]?[+]?$)
        type: string
        example: TraceID_123456789
    XAUTH_TRAVELPORT_ACCESSGROUP:
      name: XAUTH_TRAVELPORT_ACCESSGROUP
      in: header
      description: >-
        Identifies the Travelport access group with which the caller is
        associated
      required: false
      style: simple
      explode: false
      schema:
        maxLength: 36
        minLength: 36
        pattern: ([a-zA-Z-0-9-_]*)
        type: string
        example: 19Y88702-C27A-4E5D-829A-89D7016688B1
    TVP-PCC-Core:
      name: TVP-PCC-Core
      in: header
      description: Allows user to pass PCC instead of Access Group ID
      required: false
      style: simple
      explode: false
      schema:
        pattern: ^[a-zA-Z\d]{3,4}_\w{2}$
        type: string
        example: DU7_1G
    TVP-Correlation-Id:
      name: TVP-Correlation-Id
      in: header
      description: >-
        Identifier used to correlate hotel API invocations across a multi-call
        business flow.
      required: false
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
        example: 382c74c3-721d-4f34-80e5-57657b6cbc27
    Accept-Encoding:
      name: Accept-Encoding
      in: header
      description: Comma-separated list of acceptable encodings like gzip and/or deflate
      required: true
      schema:
        type: string
        example: gzip, deflate
    travelportPlusSessionIdentifier:
      name: travelportPlusSessionIdentifier
      in: header
      description: >-
        travelportPlusSessionIdentifier used to maintain an established agency
        session
      required: false
      style: simple
      explode: false
      schema:
        maxLength: 100
        minLength: 0
        pattern: ([a-zA-Z-0-9-_]*)
        type: string
        example: 49f58f5f-c443-43b4-9f5d-be405fd00a01
  requestBodies:
    ReservationID:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationDetailWrapper'
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      description: >-
        Bearer authentication using a JSON Web Token (JWT). The token must be
        sent in the Authorization header using the format: `Authorization:
        Bearer <token>`.
      scheme: bearer
      bearerFormat: JWT
