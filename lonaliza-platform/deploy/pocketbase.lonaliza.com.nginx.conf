# PocketBase Admin + API on pocketbase.lonaliza.com
# Reverse-proxies to 127.0.0.1:8090. Do not change search.lonaliza.com CNAME.

server
{
    listen 80;
    server_name pocketbase.lonaliza.com;
    root /www/wwwroot/lonaliza.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/pocketbase.lonaliza.com.conf;
    #CERT-APPLY-CHECK--END

    location ^~ /.well-known/ {
        root /www/wwwroot/lonaliza.com;
        allow all;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/pocketbase.lonaliza.com.log;
    error_log  /www/wwwlogs/pocketbase.lonaliza.com.error.log;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name pocketbase.lonaliza.com;
    root /www/wwwroot/lonaliza.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/pocketbase.lonaliza.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/pocketbase.lonaliza.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/pocketbase.lonaliza.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-END

    location ^~ /.well-known/ {
        root /www/wwwroot/lonaliza.com;
        allow all;
        default_type text/plain;
    }

    location = / {
        return 302 /_/;
    }

    # One-time admin login handoff (token cookie, never the password).
    location = /admin-handoff {
        proxy_pass http://127.0.0.1:3047/api/admin/pocketbase/handoff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js talks to PocketBase on 127.0.0.1:8090. Public vhost locked by IP allowlist.
    include /www/wwwroot/lonaliza.com/lonaliza-platform/deploy/pocketbase-allowlist.conf;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    access_log  /www/wwwlogs/pocketbase.lonaliza.com.log;
    error_log  /www/wwwlogs/pocketbase.lonaliza.com.error.log;
}
