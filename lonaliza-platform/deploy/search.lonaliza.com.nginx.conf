# UNUSED as a vhost while DNS stays official: search.lonaliza.com CNAME
# whitelabel.travelpayouts.com (grey cloud). Do not replace that CNAME
# with an A record to this box. Same-origin embedding uses a location
# on lonaliza.com instead: /tpwl/ → whitelabel.travelpayouts.com
# (see deploy/lonaliza.com.nginx.conf). This file is kept as a reference
# for the upstream proxy headers. SSL cannot be issued here via HTTP-01
# while the CNAME points at Travelpayouts (challenge hits AWS).
server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name search.lonaliza.com;

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/lonaliza.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/lonaliza.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-END

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location ^~ /.well-known/ {
        root /www/wwwroot/lonaliza.com;
        allow all;
        default_type text/plain;
    }

    location / {
        proxy_pass https://whitelabel.travelpayouts.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name whitelabel.travelpayouts.com;
        proxy_ssl_verify off;
        proxy_set_header Host search.lonaliza.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host search.lonaliza.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    access_log  /www/wwwlogs/search.lonaliza.com.log;
    error_log  /www/wwwlogs/search.lonaliza.com.error.log;
}
