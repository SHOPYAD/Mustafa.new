# Isolated Flutter / mobile-shell error pages.
# Include at server{} scope. Do not mix into product location blocks.
error_page 502 503 504 /shell-maintenance.html;

location = /shell-maintenance.html {
    root /www/wwwroot/lonaliza.com/public;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Lonaliza-Shell-Error "1";
}
