# Include from lonaliza.com vhost (before location /).
# Also add deploy/nginx-request-id.conf inside nginx http {} if $lonaliza_request_id is undefined.

map $http_x_request_id $lonaliza_request_id {
    default $http_x_request_id;
    "" $request_id;
}
# Active health checks: mark instance down after repeated failures.

upstream lonaliza_storefront {
    least_conn;
    server 127.0.0.1:3047 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3049 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3050 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limit zones (apply in server block with limit_req)
limit_req_zone $binary_remote_addr zone=lonaliza_api_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=lonaliza_api_search:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lonaliza_api_booking:10m rate=30r/m;
