# Example only — run on a dedicated host for Phase 3 (managed Redis preferred in production).
version: "3.9"
services:
  redis-master:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
  redis-replica:
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379
    depends_on:
      - redis-master
  sentinel:
    image: redis:7-alpine
    command: >
      sh -c 'echo "sentinel monitor lonaliza redis-master 6379 2" > /tmp/sentinel.conf &&
             echo "sentinel down-after-milliseconds lonaliza 5000" >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf'
    depends_on:
      - redis-master
